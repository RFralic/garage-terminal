const DL={save:async({filename,data})=>{
  const type=/\.json$/.test(filename)?"application/json":"text/html";
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}};

/* ---------- garage inventory ---------- */
const PCATS=["Filters","Spark plugs","Belts","Fluids","Hardware","Electrical","Brakes","Tires","Other"];
let invFilter="All", invQuery="", partEdit=null, scanBusy=false;
/* Reordering, like Job_Board's shopping list: Reorder -> Ordered (ordered date, how many, expected date; late is flagged) -> Received (adds what came in to On hand).
   Data: part.order = {on:"YYYY-MM-DD", qty:n, expected:"YYYY-MM-DD"|""}; gone once received. invOrd = the card with its little form open. */
let invOrd=null;
const isOrdered=p=>!!(p&&p.order&&p.order.on);
const orderLate=p=>isOrdered(p)&&p.order.expected&&p.order.expected<today();
const orderQtyGuess=p=>{const r=parseFloat(p.reorderAt);const need=isNaN(r)?1:Math.max(1,Math.ceil(r-qtyN(p)+1));return need};
/* invFor: show only the parts for one engine / vehicle (the spec sheet's "Go to inventory" sets it).
   While it's set, parts you add, scan in or bulk scan are tagged to that machine. */
let invFor=(()=>{try{return localStorage.getItem("inv-for")||""}catch(e){return""}})();
function setInvFor(id){invFor=id||"";try{localStorage.setItem("inv-for",invFor)}catch(e){}}
const forName=()=>invFor?nameOf(invFor):null; // null once that machine is gone
const tagFor=p=>{const n=forName();return n&&!allFits(p).includes(invFor)?{...p,fits:[...(p.fits||[]),invFor]}:p};
const isPart=e=>kindOf(e)==="part";
const partsOf=()=>engines.filter(isPart);
const machines=()=>engines.filter(e=>!isPart(e)&&(!isCust(e)||custOn())&&(!hideOwn||isCust(e))).sort(byName);
const nameOf=id=>{const m=engines.find(e=>e.id===id&&!isPart(e));return m?dname(m):null};
/* cross reference: machine part numbers <-> inventory */
const normPN=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function pnMatch(a,b){const x=normPN(a),y=normPN(b);if(!x||!y)return false;if(x===y)return true;
  const [sh,lo]=x.length<=y.length?[x,y]:[y,x];return sh.length>=5&&/\d/.test(sh)&&lo.includes(sh)}
const ownHit=(p,num)=>pnMatch(p.number,num)||(p.brand&&pnMatch((p.brand||"")+(p.number||""),num))||codeHit(p,num);
/* cross-reference: other brands' numbers for the same part ("Also sold as", part.alts) count as a match too */
/* an entry is usually "Brand number" (Wix 51515); also try it without the first word so short numbers like PH8A match exactly */
const altNums=a=>{const t=String(a||"").trim();const rest=t.replace(/^\S+\s+/,"");return rest&&rest!==t?[t,rest]:[t]};
const altOf=(p,num)=>(p.alts||[]).find(a=>altNums(a).some(x=>pnMatch(x,num)))||"";
const partHits=(p,num)=>ownHit(p,num)||!!altOf(p,num);
/* "as Wix 51515" when a part only matches through its cross-reference */
/* Under a part # on a machine page: what's on the shelf. One exact match shows just its location (the badge
   has the count); several matches, or a match through "Also sold as", list each part with its own count,
   e.g. "1 Fram PH8A (Shelf B) · 1 Wix 51515", so two brands never read as two of the same filter. */
const shelfLine=(st,num)=>{if(!st.length)return"";
  if(st.length===1&&ownHit(st[0],num))return st[0].location||"";
  return st.map(p=>`${qtyTxt(p)} ${withBrand(p.brand,p.number)||p.name||"part"}${p.location?` (${p.location})`:""}`).join(" · ")};
/* barcodes saved on a part (from scanning its packaging) match exactly */
const codeHit=(p,num)=>{const c=normPN(num);return !!c&&(p.barcodes||[]).some(b=>normPN(b)===c)};
/* "Also listed as": every part # on a machine (spec part #s and Other part numbers) can list the same part's
   other numbers (other brands), e.g. oilFilterAlts: "Fram PH8A, Wix 51515", or alts on an Other part number.
   They count when checking stock, like an inventory part's "Also sold as". */
const splitAlts=v=>String(v||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
const specAlts=(e,f)=>splitAlts(e[f+"Alts"]);
const numHits=(p,num,alts)=>partHits(p,num)||(alts||[]).some(a=>partHits(p,a));
function machineParts(e){const k=K(e);if(!k)return[];
  return [...k.spec.filter(s=>s[3]&&(e[s[0]]||"").trim()).map(([f,l])=>({label:l.replace(/ part #$/,""),brand:String(e[f+"Brand"]||"").trim(),number:e[f].trim(),alts:specAlts(e,f)})),
    ...(e.parts||[]).filter(p=>(p.number||"").trim()).map(p=>({label:p.name||"Part",brand:String(p.brand||"").trim(),number:p.number.trim(),alts:splitAlts(p.alts)}))]}
function xref(e){const inv=partsOf();
  const rows=machineParts(e).map(mp=>({...mp,stock:inv.filter(p=>numHits(p,mp.number,mp.alts))}));
  const used=new Set(rows.flatMap(r=>r.stock.map(p=>p.id)));
  const tagged=inv.filter(p=>(p.fits||[]).includes(e.id)&&!used.has(p.id));
  return {rows,tagged}}
const autoFits=p=>machines().filter(m=>machineParts(m).some(mp=>numHits(p,mp.number,mp.alts))).map(m=>m.id);
const allFits=p=>[...new Set([...(p.fits||[]),...autoFits(p)])];
/* typed "Also goes on" names: machines you don't keep in the Logbook (e.g. "Kohler CH18, neighbor's Cub Cadet"). Shown only, never linked */
const fitsTyped=p=>String(p&&p.fitsText||"").split(/[,;\n]/).map(s=>s.trim()).filter(Boolean);
// Machines a scanned part goes with (tagged to it, or listed in that machine's specs), shown on the scan sheet.
function scFits(p){const ms=allFits(p).map(id=>engines.find(e=>e.id===id)).filter(m=>m&&!isPart(m)).sort(byName),tx=fitsTyped(p);
  return `<div class="scfits"><span class="scfl">Fits</span>${ms.map(m=>`<button type="button" data-mach="${esc(m.id)}">${esc(dname(m))}</button>`).join("")}${tx.map(t=>`<span class="scft">${esc(t)}</span>`).join("")}${ms.length||tx.length?"":`<span class="muted">Not linked to a machine yet</span>`}</div>`}
const qtyN=p=>{const n=parseFloat(p.qty);return isNaN(n)?0:Math.round(n*100)/100};
/* Fluids can be measured in quarts or gallons (part.unit "qt" | "gal"); everything else is a count. */
const UNIT_WORD={qt:"quart",gal:"gallon"};
const unitOf=p=>p&&p.category==="Fluids"&&UNIT_WORD[p.unit]?p.unit:"";
const qtyTxt=(p,n=qtyN(p))=>`${Math.round(n*100)/100}${unitOf(p)?" "+unitOf(p):""}`;
const sameUnit=ps=>{const u=[...new Set(ps.map(unitOf))];return u.length===1?u[0]:""};
const qtyStr=n=>String(Math.round(Math.max(0,n)*100)/100);
const isLow=p=>p.reorderAt!==""&&p.reorderAt!=null&&!isNaN(parseFloat(p.reorderAt))&&qtyN(p)<=parseFloat(p.reorderAt);
/* The reorder strip on an inventory card: a Mark ordered button, the order's dates with Received, or the small form for either. */
function ordRow(p){if(!invEditOk)return"";const id=esc(p.id),u=unitOf(p),uw=u?" "+u:"";
  if(invOrd&&invOrd.id===p.id&&invOrd.mode==="order")return `<div class="iord form"><b>Mark ordered</b>
    <div class="iordf"><label>How many<input id="ord-qty" class="pn" inputmode="decimal" value="${esc(String(invOrd.qty))}"></label><label>Expected (optional)<input id="ord-exp" type="date" value="${esc(invOrd.expected||"")}"></label></div>
    <div class="actions"><button type="button" class="primary" data-ordsave="${id}">Mark ordered</button><button type="button" class="ghost" data-ordcancel="1">Cancel</button></div></div>`;
  if(invOrd&&invOrd.id===p.id&&invOrd.mode==="recv")return `<div class="iord form"><b>Received</b>
    <div class="iordf"><label>How many came in${uw?` (${esc(u)})`:""}<input id="ord-got" class="pn" inputmode="decimal" value="${esc(String(invOrd.got))}"></label></div>
    <small class="muted">Adds them to On hand (${esc(qtyTxt(p))} now).</small>
    <div class="actions"><button type="button" class="primary" data-ordrecv="${id}">Add to On hand</button><button type="button" class="ghost" data-ordcancel="1">Cancel</button></div></div>`;
  if(isOrdered(p)){const o=p.order,late=orderLate(p);
    return `<div class="iord"><span class="${late?"late":"muted"}">Ordered ${esc(fmtDate(o.on))}${o.expected?` · ${late?"Late: expected":"Expected"} ${esc(fmtDate(o.expected))}`:""}</span>
      <span class="iordb"><button type="button" class="ghost sm" data-ordundo="${id}" aria-label="Not ordered after all: ${esc(p.name||"part")}">Not ordered</button><button type="button" class="sm" data-ordgot="${id}">✓ Received</button></span></div>`}
  if(isLow(p))return `<div class="iord"><span class="muted">At or below ${esc(p.reorderAt)}${uw}: time to reorder</span><button type="button" class="sm" data-ordmark="${id}">Mark ordered</button></div>`;
  return ""}
const money=n=>"$"+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const costN=p=>{const n=parseFloat(String(p.cost||"").replace(/[^0-9.]/g,""));return isNaN(n)?0:n};

  let j;try{j=JSON.parse(text)}catch(e){throw new Error("That file isn't a logbook backup. Choose the .json file you saved with Back up logbook.")}
  const list=Array.isArray(j)?j:j&&Array.isArray(j.records)?j.records:null;
  if(!list)throw new Error("That file isn't a logbook backup. Choose the .json file you saved with Back up logbook.");
  const str=v=>v==null?"":String(v).slice(0,2000);
  const recs=list.filter(r=>r&&typeof r==="object"&&(r.name||r.make||r.model||r.number)).slice(0,500).map(r=>{
    const out={};for(const [k,v] of Object.entries(r)){if(["parts","docs","log","torque"].includes(k))continue;if(typeof v==="string"||typeof v==="number")out[k]=str(v);if(typeof v==="boolean")out[k]=v}
    out.id=/^[A-Za-z0-9_-]{1,60}$/.test(String(r.id||""))?String(r.id):uid();
    out.kind=r.kind==="vehicle"?"vehicle":r.kind==="part"?"part":"engine";
    if(out.kind==="part")out.fits=(Array.isArray(r.fits)?r.fits:[]).map(String).filter(x=>/^[A-Za-z0-9_-]{1,60}$/.test(x)).slice(0,50);
    out.parts=(Array.isArray(r.parts)?r.parts:[]).map(p=>({name:str(p&&p.name),brand:str(p&&p.brand),number:str(p&&p.number)}));
    out.docs=(Array.isArray(r.docs)?r.docs:[]).map(d=>({label:str(d&&d.label),url:safeUrl(d&&d.url)})).filter(d=>d.url);
    out.torque=(Array.isArray(r.torque)?r.torque:[]).map(t=>({...tqKeep(t),item:str(t&&t.item),size:str(t&&t.size),value:str(t&&t.value),unit:TQ_UNITS.includes(t&&t.unit)?t.unit:"ft-lb",notes:str(t&&t.notes)}));
    out.log=(Array.isArray(r.log)?r.log:[]).map(l=>({id:/^[A-Za-z0-9_-]{1,60}$/.test(String(l&&l.id||""))?String(l.id):uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(String(l&&l.date))?l.date:"",hours:str(l&&l.hours),cost:str(l&&l.cost),tasks:(Array.isArray(l&&l.tasks)?l.tasks:[]).map(str).slice(0,30),notes:str(l&&l.notes)}));
    return out});
  if(!recs.length)throw new Error("That backup doesn't have any engines, vehicles or parts in it.");
  return recs;
}

/* ---------- printable record ---------- */
function sheetBody(e){
  const log=sortedLog(e);
  const k=K(e);
  const rows=k.spec.filter(([f,,,pt])=>e[f]&&!pt).map(([f,l])=>`<tr><th>${l}</th><td class="m">${esc(e[f])}</td></tr>`).join("")+(nextOil(e)?`<tr><th>Next oil change</th><td class="m">${esc(fmtMi(nextOil(e).at))}</td></tr>`:"");
  const parts=[...k.spec.filter(s=>s[3]&&e[s[0]]).map(([f,l])=>[l.replace(/ part #$/,""),e[f]+(specAlts(e,f).length?" (also "+specAlts(e,f).join(", ")+")":""),e[f+"Brand"]||""]),...(e.parts||[]).map(p=>[p.name,(p.number||"")+(splitAlts(p.alts).length?" (also "+splitAlts(p.alts).join(", ")+")":""),p.brand||""])].filter(p=>p[1]||p[0]);
  const blanks=Array.from({length:Math.max(4,10-log.length)},()=>`<tr class="blank"><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`).join("");
  return `<div class="hd"><div><div class="eyebrow">Service record</div><h1>${esc(dname(e))}</h1>
    <div class="subt">${esc((kindOf(e)==="vehicle"?[e.year,e.make,e.model,e.trim,e.vin&&("VIN "+e.vin)]:[e.equipment,e.make,e.model,e.year,[e.engineMake,e.engineModel].filter(Boolean).join(" ")&&("Engine: "+[e.engineMake,e.engineModel].filter(Boolean).join(" ")),e.engineType]).filter(Boolean).join(" · "))}</div></div>
    <div class="printed">Printed ${fmtDate(today())}</div></div>
  <div class="two"><div><h2>Specifications</h2><table class="kv">${rows||"<tr><td>No specs recorded</td></tr>"}</table></div>
  <div><h2>Part numbers</h2><table><thead><tr><th>Part</th><th>Brand</th><th>Part #</th></tr></thead><tbody>${parts.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[2])}</td><td class="m">${esc(p[1]||"")}</td></tr>`).join("")||"<tr><td colspan=3>None recorded</td></tr>"}</tbody></table></div></div>
  <h2>Service log</h2><table class="log"><thead><tr><th style="width:13%">Date</th><th style="width:10%">${k.meterCol}</th><th style="width:27%">Work done</th><th>Notes / parts used</th><th style="width:10%">Cost</th></tr></thead><tbody>
  ${log.map(l=>`<tr><td class="m">${fmtDate(l.date)}</td><td class="m">${esc(l.hours||"")}</td><td>${esc((l.tasks||[]).join(", "))}</td><td class="lnotes">${esc(l.notes||"")}${usedParts(l,false)}</td><td class="m">${l.cost?"$"+esc(l.cost):""}</td></tr>`).join("")}${blanks}</tbody></table>
  ${(e.torque||[]).length?`<h2>Torque specs &amp; bolt sizes</h2><table><thead><tr><th style="width:30%">Fastener</th><th style="width:16%">Socket / wrench</th><th style="width:15%">Torque</th><th>Notes</th></tr></thead><tbody>${tqSorted(e).map(t=>`<tr><td>${esc(t.item)}</td><td class="m">${esc(t.size||"")}</td><td class="m">${esc(t.value)} ${esc(t.value?t.unit||"ft-lb":"")}${tqChart(t)?" (from chart)":""}</td><td>${esc(tqNote(t))}</td></tr>`).join("")}</tbody></table>${(e.torque||[]).some(tqChart)?`<p style="font-size:9pt">From chart: ${TQ_CHART_TIP}.</p>`:""}`:""}
  ${docsOf(e).length?`<h2>Manuals &amp; links</h2><table><tbody>${docsOf(e).map(d=>`<tr><th style="width:28%">${esc(d.label)}</th><td class="m url">${esc(safeUrl(d.url))}</td></tr>`).join("")}</tbody></table>`:""}
  ${e.notes?`<h2>Notes</h2><p class="notes">${esc(e.notes)}</p>`:""}`;
}
const SHEET_CSS=`td.lnotes{white-space:pre-line}.lpused{margin-top:3px;font-size:11px;white-space:normal}body{font-family:"Helvetica Neue",Arial,sans-serif;color:#111;margin:0;padding:28px;font-size:12px;line-height:1.4}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #111;padding-bottom:8px;margin-bottom:14px;gap:12px}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#555;font-weight:700}
h1{font-size:24px;margin:2px 0;text-transform:uppercase;letter-spacing:.02em}.subt{color:#444}.printed{font-size:10px;color:#555;white-space:nowrap}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin:16px 0 6px;color:#333}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top}
th{background:#eee;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.kv th{width:42%;text-transform:none;letter-spacing:0;font-size:11px;background:#f4f4f4}
.m{font-family:"Courier New",monospace}.blank td{height:22px}.url{word-break:break-all;font-size:10px}.notes{white-space:pre-wrap;border:1px solid #999;padding:8px}
.rcpage{break-before:page;page-break-before:always;padding-top:4px}.rcpage .rcsub{color:#444;margin-bottom:8px}
.rcpage img{display:block;max-width:100%;max-height:8.6in;margin:0 auto;border:1px solid #999}
@media print{body{padding:0}@page{margin:0.5in}tr{break-inside:avoid}}`;
function sheetHTML(e,extra){return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(dname(e))} service record</title><style>${SHEET_CSS}</style></head><body>${sheetBody(e)}${extra||""}</body></html>`}
/** Receipts on this machine's log entries, oldest service first (one per file, even if two entries share it). */
function receiptsOf(e){const seen=new Set(),out=[];
  for(const l of sortedLog(e).slice().reverse())for(const x of l.parts||[])for(const r of x.receipts||[]){if(seen.has(r.id))continue;seen.add(r.id);out.push({r,l,x})}
  return out}
/** Each receipt (each page of a PDF) on its own printed page, after the service records. */
async function receiptPages(e){let html="";
  for(const {r,l,x} of receiptsOf(e)){const imgs=await rcImages(r.id);
    const head=`<div class="eyebrow">Receipt · ${esc(dname(e))}</div><h2 style="margin-top:4px">${esc([x.brand,x.number].filter(Boolean).join(" ")||x.name||"Part")}${x.name&&(x.brand||x.number)?" ("+esc(x.name)+")":""}</h2>
      <div class="rcsub">Used on the ${fmtDate(l.date)} service${x.warranty?" · Warranty: "+esc(x.warranty):""} · ${esc(rcLabel(r))}</div>`;
    if(!imgs.length){html+=`<div class="rcpage">${head}<p>This receipt couldn't be loaded${rcStore()?"":" (sign in to print receipts)"}.</p></div>`;continue}
    imgs.forEach((src,i)=>{html+=`<div class="rcpage">${head}${imgs.length>1?`<div class="rcsub">Page ${i+1} of ${imgs.length}</div>`:""}<img src="${esc(src)}" alt=""></div>`})}
  return html}

async function renderPrint(e){
  const nrc=receiptsOf(e).length;
  $("#panel").innerHTML=`<section class="panel">
    <div class="actions"><button class="primary" id="prOne">Print</button><button id="dlOne">Save printable record</button><button id="dlAll">Save all ${K(e).plural.toLowerCase()}</button><span id="dlMsg" class="muted" style="font-size:.88rem"></span></div>
    <p class="muted" style="margin:0;font-size:.88rem">Print it now, or save a print-ready page to print later (or "Save as PDF"). Blank rows at the bottom let you hand-write services in the shop.</p>
    ${nrc?`<label class="chip" style="width:fit-content;max-width:100%"><input type="checkbox" id="prRc" checked>Add the ${nrc} receipt${nrc>1?"s":""} from parts used, each on its own page</label>`:""}
    <div class="tablewrap" style="border:none"><div class="sheet" id="sheetPrev"></div></div></section>`;
  const prev=$("#sheetPrev");const sh=prev.attachShadow?prev.attachShadow({mode:"open"}):prev;
  const css=SHEET_CSS.replace("body{","div.root{")+`.rcpage{border-top:2px dashed #999;margin-top:28px;padding-top:16px}`;
  sh.innerHTML=`<style>${css}</style><div class="root" style="padding:0">${sheetBody(e)}<div id="rcPrev"></div></div>`;
  const withRc=()=>{const c=$("#prRc");return !!(c&&c.checked)};
  let rcHtml=null;const rcReady=()=>rcHtml||(rcHtml=receiptPages(e));
  const showRc=async()=>{const box=sh.querySelector("#rcPrev");if(!box)return;if(!withRc()){box.innerHTML="";return}
    box.innerHTML=`<p class="rcpage">Loading receipts…</p>`;const h=await rcReady();if(withRc()&&sh.querySelector("#rcPrev"))sh.querySelector("#rcPrev").innerHTML=h};
  if(nrc){showRc();$("#prRc").onchange=showRc}
  const extra=async()=>withRc()?await rcReady():"";
  let dl=null;try{dl=await DL}catch(x){}
  const msg=$("#dlMsg");
  if(!dl){$("#dlOne").disabled=true;$("#dlAll").disabled=true;msg.textContent="Saving files isn't available in this view.";return}
  const save=async(name,html)=>{try{await dl.save({filename:name,data:html});msg.textContent="Saved "+name}catch(err){msg.textContent=err.code==="declined"?"Save cancelled.":"Couldn't save: "+(err.message||err.code)}};
  // the window opens on the tap (so it isn't blocked), then fills in once the receipts are ready
  $("#prOne").onclick=async()=>{const w=window.open("","_blank");if(!w){msg.textContent="Your browser blocked the print window. Use Save printable record instead.";return}
    if(withRc()){w.document.write("<p style='font-family:sans-serif'>Getting the receipts ready…</p>")}
    const html=sheetHTML(e,await extra());w.document.open();w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),500)};
  const slug=s=>(s||"engine").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"engine";
  $("#dlOne").onclick=async()=>{if(withRc())msg.textContent="Getting the receipts ready…";save(slug(dname(e))+"-service-record.html",sheetHTML(e,await extra()))};
  $("#dlAll").onclick=async()=>{const kd=kindOf(e);const all=engines.filter(x=>kindOf(x)===kd).sort(byName);const rc=withRc()||(!nrc&&all.some(x=>receiptsOf(x).length));
    if(rc)msg.textContent="Getting the receipts ready…";const pages=[];for(const x of all)pages.push(`<div class="pg">${sheetBody(x)}${rc?await receiptPages(x):""}</div>`);
    save((kd==="vehicle"?"vehicle":"small-engine")+"-records.html",`<!doctype html><html><head><meta charset="utf-8"><title>${K(e).plural} service records</title><style>${SHEET_CSS}.pg{break-after:page;page-break-after:always;margin-bottom:40px}.pg:last-child{break-after:auto}</style></head><body>${pages.join("")}</body></html>`)};
}

init();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/apps/sw.js",{scope:"/apps/"}).catch(()=>{}));</script>
