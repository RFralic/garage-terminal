async function init(){
  try{FB=await window.fbReady}catch(e){FB=null}

  FB.onAuth(user=>{

async function shrinkPhoto(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);

async function readLabel(file){

  app.appendChild(box);
  const msg=$("#backupMsg");
  $("#backupBtn").onclick=async()=>{
    const data=JSON.stringify({app:"engine-vehicle-logbook",version:1,exported:new Date().toISOString(),records:engines.map(e=>{const c={...e};delete c.example;return e.example?{...c,example:true}:c})},null,1);

      catch(err){if(err.code==="declined"){msg.textContent="Backup cancelled.";return}}}
    const ta=$("#backupText");ta.hidden=false;ta.value=data;ta.select();
    try{await navigator.clipboard.writeText(data);msg.textContent="Saving files isn't available here, so the backup was copied. Paste it into a note or a text file named logbook-backup.json."}
    catch(e){msg.textContent="Saving files isn't available here. Copy the text below into a note or a text file named logbook-backup.json."}
  };

    const rd=new FileReader();rd.onload=()=>{try{const recs=parseBackup(String(rd.result));restoreState={records:recs,name:f.name};render()}
      catch(err){msg.style.color="var(--accent)";msg.textContent=err.message}};rd.onerror=()=>{msg.textContent="Couldn't read that file."};rd.readAsText(f)};
  if(restoreState){$("#restoreNo").onclick=()=>{restoreState=null;render()};

function parseBackup(text){
  let j;try{j=JSON.parse(text)}catch(e){throw new Error("That file isn't a logbook backup. Choose the .json file you saved with Back up logbook.")}
  const list=Array.isArray(j)?j:j&&Array.isArray(j.records)?j.records:null;
  if(!list)throw new Error("That file isn't a logbook backup. Choose the .json file you saved with Back up logbook.");
  const str=v=>v==null?"":String(v).slice(0,2000);
  const recs=list.filter(r=>r&&typeof r==="object"&&(r.name||r.make||r.model||r.number)).slice(0,500).map(r=>{
    const out={};for(const [k,v] of Object.entries(r)){if(["parts","docs","log","torque"].includes(k))continue;if(typeof v==="string"||typeof v==="number")out[k]=str(v);if(typeof v==="boolean")out[k]=v}
    out.id=/^[A-Za-z0-9_-]{1,60}$/.test(String(r.id||""))?String(r.id):uid();
    out.kind=r.kind==="vehicle"?"vehicle":r.kind==="part"?"part":"engine";
    if(out.kind==="part")out.fits=(Array.isArray(r.fits)?r.fits:[]).map(String).filter(x=>/^[A-Za-z0-9_-]{1,60}$/.test(x)).slice(0,50);
    out.parts=(Array.isArray(r.parts)?r.parts:[]).map(p=>({name:str(p&&p.name),brand:str(p&&p.brand),number:str(p&&p.number)}));
    out.docs=(Array.isArray(r.docs)?r.docs:[]).map(d=>({label:str(d&&d.label),url:safeUrl(d&&d.url)})).filter(d=>d.url);
    out.torque=(Array.isArray(r.torque)?r.torque:[]).map(t=>({item:str(t&&t.item),size:str(t&&t.size),value:str(t&&t.value),unit:TQ_UNITS.includes(t&&t.unit)?t.unit:"ft-lb",notes:str(t&&t.notes)}));
    out.log=(Array.isArray(r.log)?r.log:[]).map(l=>({id:/^[A-Za-z0-9_-]{1,60}$/.test(String(l&&l.id||""))?String(l.id):uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(String(l&&l.date))?l.date:"",hours:str(l&&l.hours),cost:str(l&&l.cost),tasks:(Array.isArray(l&&l.tasks)?l.tasks:[]).map(str).slice(0,30),notes:str(l&&l.notes)}));
    return out});
  if(!recs.length)throw new Error("That backup doesn't have any engines, vehicles or parts in it.");
  return recs;
}

async function renderPrint(e){
  $("#panel").innerHTML=`<section class="panel">
    <div class="actions"><button class="primary" id="prOne">Print</button><button id="dlOne">Save printable record</button><button id="dlAll">Save all ${K(e).plural.toLowerCase()}</button><span id="dlMsg" class="muted" style="font-size:.88rem"></span></div>
    <p class="muted" style="margin:0;font-size:.88rem">Print it now, or save a print-ready page to print later (or "Save as PDF"). Blank rows at the bottom let you hand-write services in the shop.</p>
    <div class="tablewrap" style="border:none"><div class="sheet" id="sheetPrev"></div></div></section>`;
  const prev=$("#sheetPrev");const sh=prev.attachShadow?prev.attachShadow({mode:"open"}):prev;
  sh.innerHTML=`<style>${SHEET_CSS.replace("body{","div.root{")}</style><div class="root" style="padding:0">${sheetBody(e)}</div>`;
  let dl=null;try{dl=await DL}catch(x){}
  const msg=$("#dlMsg");
  if(!dl){$("#dlOne").disabled=true;$("#dlAll").disabled=true;msg.textContent="Saving files isn't available in this view.";return}
  const save=async(name,html)=>{try{await dl.save({filename:name,data:html});msg.textContent="Saved "+name}catch(err){msg.textContent=err.code==="declined"?"Save cancelled.":"Couldn't save: "+(err.message||err.code)}};
  $("#prOne").onclick=()=>{const w=window.open("","_blank");if(!w){msg.textContent="Your browser blocked the print window. Use Save printable record instead.";return}w.document.write(sheetHTML(e));w.document.close();w.focus();setTimeout(()=>w.print(),300)};
  const slug=s=>(s||"engine").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")||"engine";
  $("#dlOne").onclick=()=>save(slug(dname(e))+"-service-record.html",sheetHTML(e));
  $("#dlAll").onclick=()=>{const kd=kindOf(e);const all=engines.filter(x=>kindOf(x)===kd).sort(byName);
    save((kd==="vehicle"?"vehicle":"small-engine")+"-records.html",`<!doctype html><html><head><meta charset="utf-8"><title>${K(e).plural} service records</title><style>${SHEET_CSS}.pg{break-after:page;page-break-after:always;margin-bottom:40px}.pg:last-child{break-after:auto}</style></head><body>${all.map(x=>`<div class="pg">${sheetBody(x)}</div>`).join("")}</body></html>`)};
}

init();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/apps/sw.js",{scope:"/apps/"}).catch(()=>{}));</script>

</body></html>
