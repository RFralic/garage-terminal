<style>
/* Layout: single-column phone-first shop app — list, project, task and shopping views; dark by choice to match the Logbook */
:root{
  --bg:#151a17; --surface:#1e2420; --surface-2:#252c27; --line:#343d37;
  --ink:#e7ebe6; --muted:#9aa49c; --steel:#8fb5aa; --tan:#d9b98a;
  --accent:#e2753c; --on-accent:#1a0f08; --ok:#6cc48c; --warn:#e0a640; --danger:#ef7b6b;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:8px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.1;text-transform:uppercase;text-wrap:balance}
h1{font-size:28px}
h2{font-size:16px;letter-spacing:.06em;color:var(--steel)}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--steel)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#151a17}
.btn.ghost{background:transparent;border-color:transparent;color:var(--steel);padding:0 6px}
.btn.dashed{border-style:dashed;background:transparent;color:var(--muted);font-weight:500;width:100%}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
header.app{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--ink)}
input[type=text],input[type=search],input[type=url],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;min-width:0;min-height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
textarea{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-family:var(--f-body);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{min-height:44px;padding:0 10px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:12px;opacity:.75;margin-left:4px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;color:var(--ink);width:100%}
.plate{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#151a17}
.plate.mine{background:var(--steel)}.plate.customer{background:var(--tan)}
.plate b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.plate span{flex:none;font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .foot{border-top:1px solid var(--line);padding:8px 14px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.item{display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{flex:none;width:48px;min-height:56px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.box{width:24px;height:24px;border-radius:5px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:transparent}
.box.on{background:var(--ok);border-color:var(--ok);color:#151a17}
.box.ordered{background:var(--warn);border-color:var(--warn);color:#151a17}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:10px 12px 10px 0;border:0;background:transparent;text-align:left;color:var(--ink)}
.item .main .t{font-weight:500;overflow-wrap:anywhere}
.item .main .t.done{color:var(--muted);text-decoration:line-through}
.item .chev{flex:none;padding-right:12px;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor;white-space:nowrap}
.chip.order{color:var(--accent)}.chip.ordered{color:var(--warn)}.chip.stock{color:var(--ok)}.chip.late{color:var(--danger)}
.check.cap{flex-direction:column;gap:3px;min-height:64px;width:60px;padding-top:12px;justify-content:flex-start}
.check.cap small{font-family:var(--f-display);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
label.exp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;margin-top:2px}
label.exp>span:first-child{font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label.exp input{width:auto;min-height:40px;padding:0 10px}
.price{font-family:var(--f-mono);color:var(--tan)}
button.chip{background:transparent;min-height:32px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#151a17}
.tag.mine{background:var(--steel)}.tag.customer{background:var(--tan)}
.tag.sup{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:#c9d1cb;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);color:#151a17;border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.seg button{min-height:40px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seg button[aria-pressed=true]{background:var(--ink);color:#151a17}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat.hot{border-left:4px solid var(--accent)}
.stat small{display:block;font-family:var(--f-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.sub{background:var(--surface-2)}
section{display:flex;flex-direction:column;gap:8px}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.link{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.link a{flex:1;min-width:0;display:flex;flex-direction:column;color:var(--ink);text-decoration:none}
.link a span{overflow-wrap:anywhere}
.ico{flex:none;width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--surface-2);color:var(--steel);border:1px solid var(--line);font-family:var(--f-mono)}
.ico.vid{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#151a17;padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.saving{font-size:12px;color:var(--muted);min-height:16px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .12s}.card:hover{border-color:var(--muted)}}
/* ---- additions for the live version ---- */
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{cursor:pointer;position:relative}
a.btn{text-decoration:none}
.signin{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gbtn{gap:10px}.gbtn svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:2px}
#print{display:none}
@media print{
  body.printing #app,body.printing .toast{display:none!important}
  body.printing #print{display:block}
  html,body{background:#fff!important}
}
/* print view: plain black on white, letter-size friendly */
#print{color:#111;background:#fff;font-family:Helvetica,Arial,sans-serif;font-size:11pt;line-height:1.35}
#print .ph{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #222;padding-bottom:10px;margin-bottom:16px}
#print .ph h1{font-family:Helvetica,Arial,sans-serif;font-size:18pt;text-transform:none;margin:0}
#print .ph .doc{text-align:right}#print .ph .doc b{font-size:20pt;display:block}
#print .sub{color:#555;font-size:10pt}
#print .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:16px}
#print .lab{font-size:8pt;font-weight:700;color:#777;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
#print table{width:100%;border-collapse:collapse;margin:4px 0 10px}
#print th{font-size:8pt;color:#777;text-align:left;border-bottom:1px solid #999;padding:4px 6px 4px 0;text-transform:uppercase;letter-spacing:.05em}

#print .r{text-align:right}
#print .tot{margin-left:auto;width:260px}#print .tot td{border:0}#print .tot .big td{font-weight:700;font-size:13pt;border-top:1.5px solid #222}
#print ul{list-style:none;padding:0;margin:0}#print li{padding:2px 0 2px 20px;position:relative}

#print .foot{text-align:center;color:#555;margin-top:28px}
@page{size:letter;margin:0.6in}

<body>
<!-- Garage Terminal: back link + who's signed in (src/apps/logbook-backend.js) -->
<div class="gt-bar gt-solo"><a class="gt-back" href="/#apps">&lt; garage_terminal</a><span class="gt-sync" id="gtSync" aria-live="polite"></span></div>
<div class="wrap" id="app"><p class="muted">Loading your projects…</p></div>
<div class="toast" id="toast" hidden></div>
<div id="print" aria-hidden="true"></div>

<script>
(function(){
'use strict';
const STATUSES=['Not started','In progress','Waiting on parts','Ready for pickup','Done'];
const ST_CLASS={'Not started':'st-notstarted','In progress':'st-progress','Waiting on parts':'st-waiting','Ready for pickup':'st-pickup','Done':'st-done'};
const PART_ST=['To order','Ordered','In stock'];
const PART_CLASS={'To order':'order','Ordered':'ordered','In stock':'stock'};
const app=document.getElementById('app');
let db=null, projects={}, ready=false, offline=false;
let FB=null, user=null, signedOut=false, authErr='', unsubs=[];
let machines=[]; /* Logbook engines and vehicles: [{id,name}] */
let shop={name:'',phone:'',email:'',address:'',footer:'',rate:''};
let counterLast=0, counterLoaded=false, projectsLoaded=false, backfilled=false;
const JOB_PREFIX='J-';
const fmtJob=n=>JOB_PREFIX+String(n).padStart(3,'0');
const jobLabel=p=>p&&p.kind==='customer'&&p.jobNo?fmtJob(p.jobNo):'';
function nextJobNo(){
  const maxE=Math.max(0,counterLast,...Object.values(projects).map(p=>Number(p.jobNo)||0));
  const n=maxE+1;counterLast=n;
  if(db)db.doc('settings/counter').set({lastJobNo:n}).catch(()=>{});
  return n;
}
function backfillJobNos(){
  if(backfilled||!counterLoaded||!projectsLoaded)return;backfilled=true;
  Object.entries(projects).filter(([,p])=>p.kind==='customer'&&!p.jobNo).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0))
    .forEach(([id,p])=>{p.jobNo=nextJobNo();save(id)});
}
let view={name:'list',tab:'all',q:'',pid:null,tid:null,shopJob:'all',shopStatus:'order',shopSup:'all',editing:null,confirm:null};
const timers={};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,'').slice(0,36);
const safeUrl=u=>{try{const x=new URL(u);return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return ''}};
const isVideo=u=>/youtube\.com|youtu\.be|vimeo\.com/i.test(u||'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const hasPrice=x=>x&&x.price!==undefined&&x.price!==null&&x.price!==''&&isFinite(+x.price);
/* units: '' = each (whole count), 'qt' quarts, 'gal' gallons (decimals allowed) */
const UNITS=[['','Each'],['qt','Quarts'],['gal','Gallons']];
const isFluid=x=>x&&(x.unit==='qt'||x.unit==='gal');
const numStr=n=>{const v=Number(n)||1;return String(Math.round(v*100)/100)};
const qtyText=x=>isFluid(x)?`${numStr(x.qty)} ${x.unit}`:`qty ${numStr(x.qty)}`;
const qtyShort=x=>isFluid(x)?`${numStr(x.qty)} ${x.unit}`:`× ${numStr(x.qty)}`;
const perText=x=>isFluid(x)?`per ${x.unit}`:'each';
const idText=x=>[x.brand,x.num].filter(Boolean).join(' · ');
function parseQty(v,unit){const n=parseFloat(v);if(unit==='qt'||unit==='gal')return isFinite(n)&&n>0?Math.min(9999,Math.round(n*100)/100):1;return Math.max(1,Math.min(999,Math.round(isFinite(n)?n:1)))}
const money=n=>(Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
/* ---------- time clock (customer jobs) ---------- */
const timeLog=p=>(p&&p.time&&Array.isArray(p.time.log))?p.time.log:[];
const entryStart=e=>e.manual?new Date((e.date||today())+'T12:00:00').getTime():e.start;
const tMs=e=>e.manual?(Number(e.minutes)||0)*60000:Math.max(0,(e.end||Date.now())-e.start);
const running=p=>timeLog(p).find(e=>!e.manual&&!e.end);
const doneMs=p=>timeLog(p).filter(e=>e.manual||e.end).reduce((n,e)=>n+tMs(e),0);
const totalMs=p=>timeLog(p).reduce((n,e)=>n+tMs(e),0);
const fmtDur=ms=>{const m=Math.floor(ms/60000);return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`};
const fmtClock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const hrsQ=ms=>Math.round(ms/3600000*4)/4;
const clockT=ms=>new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const dayOf=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const atLocal=(date,hm)=>new Date(date+'T'+(hm||'00:00')+':00').getTime();
const runningJob=()=>Object.entries(projects).find(([,p])=>p.kind==='customer'&&running(p));
setInterval(()=>{document.querySelectorAll('[data-tick]').forEach(el=>{const v=Date.now()-(+el.dataset.tick)+(+el.dataset.base||0);el.textContent=el.dataset.fmt==='dur'?fmtDur(v):fmtClock(v)})},1000);
function renderClock(id,p){
  const r=running(p),log=timeLog(p).slice().sort((a,b)=>entryStart(b)-entryStart(a)),base=doneMs(p);
  let h=`<section><div class="between"><h2>Time on this job</h2><span class="mono" style="font-size:18px">${r?`<span data-tick="${r.start}" data-base="${base}" data-fmt="dur">${fmtDur(totalMs(p))}</span>`:fmtDur(base)}</span></div>`;
  h+=r?`<div class="panel" style="gap:10px;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))">

/* ---------- Logbook inventory (live: users/{uid}/records where kind == "part") ---------- */
let inv=null; /* {parts:[{id,name,brand,number,qty,location}]} */
/* Part-number matching: copied exactly from the Logbook (index.html) */
const normPN=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");;
function pnMatch(a,b){const x=normPN(a),y=normPN(b);if(!x||!y)return false;if(x===y)return true;
  const [sh,lo]=x.length<=y.length?[x,y]:[y,x];return sh.length>=5&&/\d/.test(sh)&&lo.includes(sh)}
const partHits=(p,num)=>pnMatch(p.number,num)||(p.brand&&pnMatch((p.brand||"")+(p.number||""),num));;
function invLookup(x){if(!inv||!x||!x.num)return null;const hits=inv.parts.filter(ip=>partHits(ip,x.num)||(x.brand&&partHits(ip,x.brand+x.num)));
  if(!hits.length)return{found:false,hits:[]};const qty=hits.reduce((n,h)=>n+(parseFloat(h.qty)||0),0);const locs=[...new Set(hits.map(h=>(h.location||'').trim()).filter(Boolean))];return{found:true,qty:Math.round(qty*100)/100,locs,hits}}
function invChip(p,x){if(!p||p.kind!=='mine'||!inv)return '';const r=invLookup(x);if(!r)return x.num?'':`<span class="small muted">Add a part # to check inventory</span>`;
  return r.found?`<span class="small" style="color:var(--ok);font-weight:600">In inventory: ${esc(numStr(r.qty))}${r.locs.length?' · '+esc(r.locs.join(', ')):''}</span>`:`<span class="small muted">Not in inventory</span>`}
/* Logbook machine names and record ids: copied from the Logbook (index.html) */
const kindOf=e=>e&&e.kind==="vehicle"?"vehicle":e&&e.kind==="part"?"part":"engine";;
const K=e=>({engine:{one:'engine'},vehicle:{one:'vehicle'},part:{one:'part'}})[kindOf(e)];
const dname=e=>{if(!e)return"";if((e.name||"").trim())return e.name.trim();
  const mm=(kindOf(e)==="vehicle"?[e.year,e.make,e.model]:[e.make,e.model]).map(x=>(x||"").trim()).filter(Boolean).join(" ");
  return mm||(e.equipment&&kindOf(e)!=="vehicle"?e.equipment:"")||"Unnamed "+(K(e)?K(e).one:"item")};
const uid_lb=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
/* "Logbook entry": the linked Logbook engine/vehicle (live name), or the old free text */
function lbName(p){const m=p&&p.logbookId&&machines.find(x=>x.id===p.logbookId);return m?m.name:(p&&p.logbook)||''}
function logbookSelect(p){p=p||{};const id=p.logbookId||'';const linked=id&&machines.some(m=>m.id===id);
  const keep=(p.logbook&&!linked)?`<option value="__keep" selected>${esc(p.logbook)} (not linked)</option>`:'';
  return `<label class="f">Logbook entry${p.title===undefined?' (optional)':''}<select name="logbookSel">${keep}<option value="" ${!id&&!keep?'selected':''}>(none)</option>${machines.map(m=>`<option value="${esc(m.id)}" ${m.id===id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
  ${machines.length?'':'<span class="note">Your Logbook engines and vehicles show up here.</span>'}`}
function applyLogbook(p,v){if(v==='__keep')return;if(!v){p.logbookId='';p.logbook='';return}const m=machines.find(x=>x.id===v);if(!m)return;p.logbookId=v;p.logbook=m.name}
/* "Add to inventory" (My equipment, parts marked Received) */
function invAddUI(pid,tid,x){
  if(!inv||!x||!(x.name||x.num))return '';const key='inv:'+pid+':'+x.id;
  if(view.confirm===key){const r=invLookup(x);const n=Math.max(1,Math.ceil(Number(x.qty)||1));
    return `<form class="panel sub" data-form="invadd" data-pid="${pid}" data-tid="${tid}" data-xid="${x.id}" style="gap:8px;padding:10px">
      <span class="small">${r&&r.found?`You have <b>${esc(numStr(r.qty))}</b> in your Logbook inventory${r.locs.length?' ('+esc(r.locs.join(', '))+')':''}. Add to it:`:`Adds <b>${esc(x.name||x.num)}</b> to your Logbook inventory${x.num?'':' (no part #, so it can\'t be matched later)'}:`}</span>
      <div class="row"><label class="f" style="flex:1">How many<input type="number" name="n" min="1" max="9999" step="1" inputmode="numeric" value="${n}"></label></div>
      <div class="grid2"><button class="btn primary" type="submit">Add to inventory</button><button class="btn" type="button" data-act="cancel">Cancel</button></div></form>`}
  return `<span class="row" style="gap:8px;flex-wrap:wrap">${x.invAddedOn?`<span class="small" style="color:var(--ok)">Added to inventory ${esc(fmtDate(x.invAddedOn))}</span>`:''}<button class="btn sm" data-act="invadd" data-key="${key}">${x.invAddedOn?'Add again':'Add to inventory'}</button></span>`}
function addToInventory(pid,tid,xid,n){
  const {p,x}=findPart(pid,tid,xid);if(!p||!x||!db)return;const now=new Date().toISOString();const r=invLookup(x);let msg;
  if(r&&r.found){const hit=r.hits[0];const cur=Math.max(0,parseInt(hit.qty,10)||0);
    db.records.merge(hit.id,{qty:String(cur+n),updatedAt:now}).catch(()=>toast('Could not update your inventory'));
    msg=`Inventory: ${hit.name||hit.number} now ${cur+n}`}
  else{/* same record shape as the Logbook's Add part form (openPart in index.html) */
    db.records.set(uid_lb(),{kind:"part",name:x.name||'',brand:x.brand||'',number:x.num||'',category:"",qty:String(n),reorderAt:"",location:"",cost:"",source:"",fits:[],notes:"",createdAt:now,updatedAt:now}).catch(()=>toast('Could not add to your inventory'));
    msg=`Added ${x.name||x.num} to your inventory`}
  x.invAddedOn=today();save(pid);view.confirm=null;toast(msg);render()}

function laborCost(p){const l=p.labor||{};const h=+l.hours,r=+l.rate;const ok=isFinite(h)&&isFinite(r)&&h>0&&r>0;return{hours:ok?h:(isFinite(h)&&h>0?h:0),rate:isFinite(r)&&r>0?r:0,total:ok?Math.round(h*r*100)/100:0,has:ok,desc:(l.desc||'').trim()}}
function partsCost(p){let total=0,missing=0,count=0;(p.tasks||[]).forEach(t=>(t.parts||[]).forEach(x=>{if(hasPrice(x)){total+=x.price*(x.qty||1);count++}else missing++}));return{total:Math.round(total*100)/100,missing,count}}
function setPartStatus(x,s){x.status=s;if(s==='Ordered'){if(!x.orderedOn)x.orderedOn=today();delete x.receivedOn}else if(s==='In stock'){if(!x.receivedOn)x.receivedOn=today()}else{delete x.orderedOn;delete x.receivedOn;delete x.expected}}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(timers.toast);timers.toast=setTimeout(()=>{t.hidden=true},2200)}

function blankProject(kind){return{title:'',kind:kind||'mine',status:'Not started',logbook:'',machine:'',customer:{name:'',phone:'',dropOff:'',promised:'',complaint:''},notes:'',tasks:[],createdAt:Date.now(),updatedAt:Date.now()}}
function progress(p){const t=p.tasks||[];const d=t.filter(x=>x.done).length;return{d,n:t.length,pct:t.length?Math.round(d/t.length*100):0}}
function allParts(p){const out=[];(p.tasks||[]).forEach(t=>(t.parts||[]).forEach(x=>out.push({...x,taskId:t.id,taskTitle:t.title})));return out}
function brands(){const s=new Set();Object.values(projects).forEach(p=>allParts(p).forEach(x=>{if(x.brand&&x.brand.trim())s.add(x.brand.trim())}));return [...s].sort((a,b)=>a.localeCompare(b))}
function partFields(x,sups,isNew){

    <div class="grid2"><label class="f">Amount<input type="number" name="qty" min="${fl?'0.1':'1'}" max="9999" step="${fl?'0.1':'1'}" value="${esc(numStr(x.qty))}" inputmode="decimal" data-qtyfor="1"></label>
    <label class="f">Measured in<select name="unit" data-unitsel="1">${UNITS.map(([v,l])=>`<option value="${v}" ${(x.unit||'')===v?'selected':''}>${l}</option>`).join('')}</select></label></div>

function suppliers(){const s=new Set();Object.values(projects).forEach(p=>allParts(p).forEach(x=>{if(x.supplier&&x.supplier.trim())s.add(x.supplier.trim())}));return [...s].sort((a,b)=>a.localeCompare(b))}

/* ---------- saving ---------- */
function save(pid){
  const p=projects[pid];if(!p)return;p.updatedAt=Date.now();
  if(!db){return}
  clearTimeout(timers['s'+pid]);
  timers['s'+pid]=setTimeout(async()=>{
    try{const cur=projects[pid];if(cur)await db.doc('projects/'+pid).set(JSON.parse(JSON.stringify(cur)));timers['s'+pid]=null}
    catch(e){ if(e&&e.code==='unavailable'){setTimeout(()=>save(pid),1500)} else toast(e&&e.code==='quota_exceeded'?'Storage is full: delete an old project.':'Could not save. Check your connection.') }
  },350);
}
async function removeProject(pid){delete projects[pid];if(db){try{await db.doc('projects/'+pid).delete()}catch(e){toast('Could not delete. Try again.')}}}

/* Import a project-tracker-backup.json from the test version:
   {app:"project-tracker", version:1, projects:[{id,...}], settings:{counter, shop}} */
async function importBackup(text){
  if(!db||!projectsLoaded){toast('Still loading your projects. Try again in a moment.');return}
  let j;try{j=JSON.parse(text)}catch(e){toast("That isn't a Project Tracker backup file.");return}
  if(!j||j.app!=='project-tracker'||!Array.isArray(j.projects)){toast("That file doesn't look like a Project Tracker backup.");return}
  let added=0,skipped=0,bad=0;const writes=[];
  for(const raw of j.projects){
    const id=raw&&String(raw.id||'');if(!/^[A-Za-z0-9_-]{1,100}$/.test(id)||(raw.kind!=='mine'&&raw.kind!=='customer')){bad++;continue}
    if(projects[id]){skipped++;continue}
    const {id:_,...data}=raw;const clean=JSON.parse(JSON.stringify(data));projects[id]=clean;added++;
    writes.push(db.doc('projects/'+id).set(clean));
  }
  const s=j.settings||{};
  const cn=typeof s.counter==='number'?s.counter:Number(s.counter&&s.counter.lastJobNo)||0;
  const maxJob=Math.max(cn,...j.projects.map(p=>Number(p&&p.jobNo)||0));
  if(maxJob>counterLast){counterLast=maxJob;writes.push(db.doc('settings/counter').set({lastJobNo:maxJob}))}
  let shopNote='';
  if(s.shop&&typeof s.shop==='object'){
    if(!shop.name){shop={name:String(s.shop.name||''),phone:String(s.shop.phone||''),email:String(s.shop.email||''),address:String(s.shop.address||''),footer:String(s.shop.footer||''),rate:s.shop.rate||''};writes.push(db.doc('settings/shop').set({...shop}));shopNote=' and your shop info'}
    else shopNote=' (kept your current shop info)'}
  render();
  toast(`Imported ${added} project${added===1?'':'s'}${shopNote}${skipped?` · ${skipped} already here`:''}${bad?` · ${bad} unreadable`:''}`);
  Promise.all(writes).catch(()=>toast('Some imported items could not be saved. Check your connection.'));
}

/* ---------- PDFs (jsPDF) ---------- */
const pdfText=s=>String(s??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'');
function longDate(s){const d=s?new Date(s+'T00:00:00'):new Date();return isNaN(d)?String(s):d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function buildPdf(p,kind){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,M=54,R=W-M;let y=M;const c=p.customer||{};const job=jobLabel(p);
  const ensure=h=>{if(y+h>792-M){doc.addPage();y=M}};
  const line=(x1,y1,x2,y2,w=0.75,g=180)=>{doc.setDrawColor(g);doc.setLineWidth(w);doc.line(x1,y1,x2,y2)};
  const txt=(s,x,yy,o)=>doc.text(pdfText(s),x,yy,o);
  // header: shop
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(20);txt(shop.name||'Your shop name',M,y+4);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  const sub=[shop.phone,shop.email].filter(Boolean).join('   ');let hy=y+20;
  if(shop.address){txt(shop.address,M,hy);hy+=13}
  if(sub){txt(sub,M,hy);hy+=13}
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(20);txt(kind==='invoice'?'INVOICE':'WORK REPORT',R,y+4,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  txt((kind==='invoice'?'Invoice ':'Job ')+(job||'-'),R,y+20,{align:'right'});txt('Date: '+longDate(),R,y+33,{align:'right'});
  y=Math.max(hy,y+40)+10;line(M,y,R,y,1.5,40);y+=24;
  // customer block
  doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt('CUSTOMER',M,y);txt('MACHINE',M+270,y);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
  let cy=y+15;txt(c.name||'-',M,cy);if(c.phone){cy+=14;txt(c.phone,M,cy)}
  let my=y+15;const mach=doc.splitTextToSize(pdfText(p.machine||p.title||'-'),R-(M+270));doc.text(mach,M+270,my);my+=14*mach.length;
  doc.setFontSize(10);doc.setTextColor(90);
  if(c.dropOff){txt('Dropped off: '+longDate(c.dropOff),M+270,my);my+=13}
  y=Math.max(cy,my)+22;
  if(kind==='report'){
    doc.setFontSize(11);doc.setTextColor(20);doc.setFont('helvetica','bold');txt(p.title||'Work report',M,y);y+=18;doc.setFont('helvetica','normal');
    if(c.complaint){doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt("CUSTOMER'S COMPLAINT",M,y);y+=14;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
      const L=doc.splitTextToSize(pdfText(c.complaint),R-M);ensure(L.length*14);doc.text(L,M,y);y+=L.length*14+14}
    const doneT=(p.tasks||[]).filter(t=>t.done),open=(p.tasks||[]).filter(t=>!t.done);
    doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');ensure(30);txt('WORK PERFORMED',M,y);y+=16;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
    if(!doneT.length){txt('No completed work recorded yet.',M,y);y+=16}
    doneT.forEach(t=>{const L=doc.splitTextToSize(pdfText(t.title),R-M-18);ensure(L.length*14+4);doc.setDrawColor(40);doc.setLineWidth(1);doc.rect(M,y-8,8,8);doc.line(M+1.5,y-4,M+3.5,y-1.5);doc.line(M+3.5,y-1.5,M+7,y-7);doc.text(L,M+18,y);y+=L.length*14+4});
    if(open.length){y+=8;doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');ensure(30);txt('NOT DONE / RECOMMENDED',M,y);y+=16;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(60);
      open.forEach(t=>{const L=doc.splitTextToSize(pdfText(t.title),R-M-18);ensure(L.length*14+4);doc.setDrawColor(120);doc.rect(M,y-8,8,8);doc.text(L,M+18,y);y+=L.length*14+4})}

async function savePdf(p,kind){
  if(!window.jspdf){toast('PDF maker is still loading. Try again in a moment.');return}
  const who=((p.customer&&p.customer.name)||p.title||'customer').replace(/[\\/:*?"<>|]+/g,'').slice(0,40);
  const name=`${kind==='invoice'?'Invoice':'Work report'} ${jobLabel(p)||''} ${who}.pdf`.replace(/\s+/g,' ').trim();
  try{const data=buildPdf(p,kind);const url=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PDF saved')}
  catch(e){toast('Could not create the PDF.')}
}

function buildPrintHtml(p,kind){
  const c=p.customer||{};const job=jobLabel(p);const parts=allParts(p);
  let h=`<div class="ph"><div><h1>${esc(shop.name||'Your shop name')}</h1>${shop.address?`<div class="sub">${esc(shop.address)}</div>`:''}${[shop.phone,shop.email].filter(Boolean).length?`<div class="sub">${esc([shop.phone,shop.email].filter(Boolean).join('   '))}</div>`:''}</div>
    <div class="doc"><b>${kind==='invoice'?'INVOICE':'WORK REPORT'}</b><div class="sub">${kind==='invoice'?'Invoice ':'Job '}${esc(job||'-')}</div><div class="sub">Date: ${esc(longDate())}</div></div></div>
  <div class="two"><div><div class="lab">Customer</div><div>${esc(c.name||'-')}</div>${c.phone?`<div>${esc(c.phone)}</div>`:''}</div>
    <div><div class="lab">Machine</div><div>${esc(p.machine||p.title||'-')}</div>${c.dropOff?`<div class="sub">Dropped off: ${esc(longDate(c.dropOff))}</div>`:''}</div></div>`;
  if(kind==='report'){
    h+=`<div style="font-weight:700;font-size:12pt">${esc(p.title||'Work report')}</div>`;
    if(c.complaint)h+=`<div class="lab">Customer's complaint</div><div>${esc(c.complaint)}</div>`;
    const doneT=(p.tasks||[]).filter(t=>t.done),open=(p.tasks||[]).filter(t=>!t.done);
    h+=`<div class="lab">Work performed</div>${doneT.length?`<ul>${doneT.map(t=>`<li class="done">${esc(t.title)}</li>`).join('')}</ul>`:'<div>No completed work recorded yet.</div>'}`;
    if(open.length)h+=`<div class="lab">Not done / recommended</div><ul>${open.map(t=>`<li>${esc(t.title)}</li>`).join('')}</ul>`;
    if(parts.length)h+=`<div class="lab">Parts</div><table><tr><th>Part</th><th>Brand / part #</th><th class="r">Qty</th></tr>${parts.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(idText(x)||'-')}</td><td class="r">${esc(isFluid(x)?qtyText(x):numStr(x.qty))}</td></tr>`).join('')}</table>`;
  }else{
    const pc=partsCost(p),lc=laborCost(p);
    h+=`<table><tr><th>Part</th><th>Brand / part #</th><th class="r">Qty</th><th class="r">Price each</th><th class="r">Amount</th></tr>
      ${parts.length?parts.map(x=>{const q=x.qty||1;return `<tr><td>${esc(x.name)}</td><td>${esc(idText(x)||'-')}</td><td class="r">${esc(isFluid(x)?qtyText(x):numStr(q))}</td><td class="r">${hasPrice(x)?esc(money(x.price)+(isFluid(x)?'/'+x.unit:'')):'-'}</td><td class="r">${hasPrice(x)?esc(money(x.price*q)):'-'}</td></tr>`}).join(''):'<tr><td colspan="5">No parts on this job.</td></tr>'}</table>`;
    if(lc.has)h+=`<table><tr><th>Labor</th><th class="r">Hours</th><th class="r">Rate</th><th class="r">Amount</th></tr><tr><td>${esc(lc.desc||'Labor')}</td><td class="r">${esc(numStr(lc.hours))}</td><td class="r">${esc(money(lc.rate))}/hr</td><td class="r">${esc(money(lc.total))}</td></tr></table>`;
    h+=`<table class="tot"><tr><td class="r">Parts</td><td class="r">${esc(money(pc.total))}</td></tr>${lc.has?`<tr><td class="r">Labor</td><td class="r">${esc(money(lc.total))}</td></tr>`:''}<tr class="big"><td class="r">TOTAL</td><td class="r">${esc(money(pc.total+lc.total))}</td></tr></table>`;
    if(pc.missing)h+=`<div class="sub" style="text-align:right">${pc.missing} part${pc.missing>1?'s have':' has'} no price and ${pc.missing>1?'are':'is'} not included.</div>`;
  }
  h+=`<div class="foot">${esc(kind==='invoice'?(shop.footer||'Thank you for your business.'):'Thank you for your business.')}</div>`;
  return h;
}
function printDoc(p,kind){

  else if(a==='clockin'){clockIn(b.dataset.pid)}
  else if(a==='clockout'){clockOut(b.dataset.pid)}
  else if(a==='addtime'){view.editing=view.editing==='addtime'?null:'addtime';view.editTime=null;render();const el=document.getElementById('at-date');if(el&&view.editing)el.scrollIntoView({block:'center'})}
  else if(a==='edittime'){view.editTime=b.dataset.tid||null;view.confirm=null;if(view.editing==='addtime')view.editing=null;render()}
  else if(a==='deltime'){view.confirm='deltime';render()}
  else if(a==='deltime-yes'){p.time={log:timeLog(p).filter(e=>e.id!==b.dataset.tid)};view.editTime=null;view.confirm=null;save(view.pid);toast('Time entry deleted');render()}
  else if(a==='usetime'){p.labor={...(p.labor||{}),hours:hrsQ(totalMs(p))};if(p.labor.rate===undefined&&shop.rate)p.labor.rate=+shop.rate;save(view.pid);toast('Labor hours updated');render()}
  else if(a==='shopinfo'){go({name:'shopinfo'});const el=document.getElementById('s-name');if(el)el.focus()}
  else if(a==='editshop'){view.editing=view.editing==='shop'?null:'shop';render();const el=document.getElementById('s-name');if(el&&view.editing==='shop')el.focus()}
  else if(a==='pdf'){b.disabled=true;await savePdf(p,b.dataset.kind);b.disabled=false}
  else if(a==='copyjob'){const j=jobLabel(p);try{await navigator.clipboard.writeText(j);toast(j+' copied')}catch(err){toast('Press and hold the number to copy it')}}
  else if(a==='copyphone'){const ph=(p.customer&&p.customer.phone)||'';try{await navigator.clipboard.writeText(ph);toast('Number copied')}catch(err){toast('Press and hold the number to copy it')}}
  else if(a==='delp'||a==='delt'){view.confirm=a;render()}
  else if(a==='cancel'){view.confirm=null;render()}
  else if(a==='delp-yes'){await removeProject(view.pid);toast('Project deleted');go({name:'list'})}
  else if(a==='delt-yes'){p.tasks=p.tasks.filter(t=>t.id!==view.tid);save(view.pid);toast('Task deleted');go({name:'project'})}
  else if(a==='toggle'){const t=p.tasks.find(x=>x.id===b.dataset.tid);t.done=!t.done;
    const pr=progress(p);if(pr.n&&pr.d===pr.n&&p.status==='In progress')toast('All tasks done. Update the status?');else if(t.done&&p.status==='Not started')p.status='In progress';
    save(view.pid);render()}
  else if(a==='cyclepart'){const t=p.tasks.find(x=>x.id===view.tid);const x=t.parts.find(y=>y.id===b.dataset.xid);setPartStatus(x,PART_ST[(PART_ST.indexOf(x.status)+1)%3]);save(view.pid);render()}
  else if(a==='editpart'){view.editPart=b.dataset.xid||null;render();const el=document.getElementById('ep-name');if(el&&view.editPart)el.focus()}
  else if(a==='delpart'){const t=p.tasks.find(x=>x.id===view.tid);t.parts=t.parts.filter(y=>y.id!==b.dataset.xid);save(view.pid);render()}
  else if(a==='dellink'){const t=p.tasks.find(x=>x.id===view.tid);t.links=t.links.filter(y=>y.id!==b.dataset.lid);save(view.pid);render()}
  else if(a==='sjob'){view.shopJob=b.dataset.v;render()}
  else if(a==='sst'){view.shopStatus=b.dataset.v;render()}
  else if(a==='ssup'){view.shopSup=b.dataset.v;render()}
  else if(a==='shoptick'){const {x}=findPart(b.dataset.pid,b.dataset.tid,b.dataset.xid);if(x){
    if(x.status==='To order'){x.status='Ordered';x.orderedOn=today();toast('Moved to Ordered: set its expected date there')}
    else if(x.status==='Ordered'){x.status='In stock';x.receivedOn=today();toast(projects[b.dataset.pid]&&projects[b.dataset.pid].kind==='mine'?'Received. Add it to your inventory under All, or on its task':'Received')}
    else {x.status='Ordered';delete x.receivedOn}
    save(b.dataset.pid);render()}}
  else if(a==='shopcycle'){const {x}=findPart(b.dataset.pid,b.dataset.tid,b.dataset.xid);if(x){setPartStatus(x,PART_ST[(PART_ST.indexOf(x.status)+1)%3]);save(b.dataset.pid);render()}}
  else if(a==='copy'){const txt=[...app.querySelectorAll('.list .item')].map(el=>{const m=el.querySelector('.main');const name=m.querySelector('.t').textContent;const qty=m.querySelector('.mono.small').textContent;const num=m.querySelectorAll('.mono')[1]?.textContent||'';const tags=[...m.querySelectorAll('.tag')].map(t=>t.textContent).join(' · ');return `${name} ${qty} — ${num}${tags?' ('+tags+')':''}`}).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('List copied')}catch(err){const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('aria-label','Shopping list');ta.style.minHeight='160px';b.closest('.top').after(ta);ta.select();toast('Select all and copy')}}
});
app.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(f));const k=f.dataset.form;const p=projects[view.pid];
  if(k==='new'){if(!d.title.trim())return;const id=uid();const np=blankProject(view.kind||'mine');np.title=d.title.trim();np.machine=(d.machine||'').trim();if(np.kind==='mine')applyLogbook(np,d.logbookSel||'');
    if(np.kind==='customer'){np.customer={name:(d.cname||'').trim(),phone:(d.cphone||'').trim(),dropOff:d.drop||'',promised:d.promised||'',complaint:(d.complaint||'').trim()};np.jobNo=nextJobNo();toast('Job '+fmtJob(np.jobNo)+' created')}
    projects[id]=np;save(id);go({name:'project',pid:id})}
  else if(k==='editp'){const was=p.kind;p.title=d.title.trim()||p.title;p.machine=(d.machine||'').trim();p.customer=p.customer||{name:'',phone:'',dropOff:'',promised:'',complaint:''};
    if(was==='mine')applyLogbook(p,d.logbookSel||'');else p.customer={...p.customer,dropOff:d.drop||'',promised:d.promised||'',complaint:(d.complaint||'').trim()};
    if(d.kind==='mine'||d.kind==='customer')p.kind=d.kind;
    if(p.kind==='customer'&&!p.jobNo)p.jobNo=nextJobNo();
    save(view.pid);view.editing=null;toast(p.kind!==was?(p.kind==='customer'?'Now a customer job: add their info':'Now in My equipment'):'Saved');render()}
  else if(k==='invadd'){addToInventory(f.dataset.pid,f.dataset.tid,f.dataset.xid,Math.max(1,Math.min(9999,parseInt(d.n,10)||1)));return}
  else if(k==='addtime'){const mins=(Math.max(0,parseInt(d.h,10)||0))*60+Math.min(59,Math.max(0,parseInt(d.m,10)||0));if(!mins){toast('Enter hours or minutes');return}
    p.time={log:[...timeLog(p),{id:uid(),manual:true,date:d.date||today(),minutes:mins,...(d.note&&d.note.trim()?{note:d.note.trim()}:{})}]};view.editing=null;save(view.pid);toast('Added '+fmtDur(mins*60000));render()}
  else if(k==='edittime'){const e=timeLog(p).find(x=>x.id===f.dataset.tid);if(!e)return;
    if(e.manual){const mins=(Math.max(0,parseInt(d.h,10)||0))*60+Math.min(59,Math.max(0,parseInt(d.m,10)||0));if(!mins){toast('Enter hours or minutes');return}e.minutes=mins;e.date=d.date||e.date}
    else{const st=atLocal(d.date,d.start);if(!isFinite(st)){toast('Check the date and time');return}if(st>Date.now()){toast("Clock-in time can't be in the future");return}e.start=st;
      if(e.end){let en=atLocal(d.date,d.end);if(en<=st)en+=86400000;e.end=en}}
    if(d.note&&d.note.trim())e.note=d.note.trim();else delete e.note;
    p.time={log:[...timeLog(p)]};view.editTime=null;save(view.pid);toast('Time saved');render()}
  else if(k==='shop'){shop={name:(d.name||'').trim(),phone:(d.phone||'').trim(),email:(d.email||'').trim(),address:(d.address||'').trim(),footer:(d.footer||'').trim(),rate:d.rate!==''&&isFinite(+d.rate)&&+d.rate>0?Math.round(+d.rate*100)/100:''};
    if(db)db.doc('settings/shop').set({...shop}).catch(()=>toast('Could not save shop info'));view.editing=null;toast('Shop info saved');if(view.name==='shopinfo')go({name:'list'});else render()}
  else if(k==='editc'){p.customer={...(p.customer||{}),name:(d.cname||'').trim(),phone:(d.cphone||'').trim()};save(view.pid);view.editing=null;toast('Customer info saved');render()}
  else if(k==='addtask'){const t=(d.title||'').trim();if(!t)return;p.tasks.push({id:uid(),title:t,done:false,notes:'',parts:[],links:[]});save(view.pid);render();const el=document.getElementById('newtask');if(el)el.focus()}
  else if(k==='edittask'){const t=p.tasks.find(x=>x.id===view.tid);t.title=d.title.trim()||t.title;save(view.pid);view.editing=null;render()}
  else if(k==='editpart'){const t=p.tasks.find(x=>x.id===view.tid);const x=t&&(t.parts||[]).find(y=>y.id===f.dataset.xid);if(!x||!d.name.trim())return;
    const unit=['qt','gal'].includes(d.unit)?d.unit:'';Object.assign(x,{name:d.name.trim(),brand:(d.brand||'').trim(),num:(d.num||'').trim(),unit,qty:parseQty(d.qty,unit),supplier:(d.supplier||'').trim()});
    if(!x.unit)delete x.unit;if(!x.brand)delete x.brand;save(view.pid);view.editPart=null;toast('Part saved');render()}
  else if(k==='addpart'){const t=p.tasks.find(x=>x.id===view.tid);if(!d.name.trim())return;const unit=['qt','gal'].includes(d.unit)?d.unit:'';(t.parts=t.parts||[]).push({id:uid(),name:d.name.trim(),...(d.brand&&d.brand.trim()?{brand:d.brand.trim()}:{}),...(unit?{unit}:{}),num:(d.num||'').trim(),qty:parseQty(d.qty,unit),supplier:(d.supplier||'').trim(),status:PART_ST.includes(d.status)?d.status:'To order',...(p.kind==='customer'&&d.price!==undefined&&d.price!==''&&isFinite(+d.price)&&+d.price>=0?{price:Math.round(+d.price*100)/100}:{})});
    save(view.pid);toast('Part added');render()}
  else if(k==='addlink'){const t=p.tasks.find(x=>x.id===view.tid);const u=safeUrl((d.url||'').trim());if(!u){toast('Enter a full link starting with https://');return}(t.links=t.links||[]).push({id:uid(),url:u,title:(d.title||'').trim()});save(view.pid);render()}
});
app.addEventListener('input',e=>{
  const el=e.target;const k=el.dataset.input;if(!k)return;const p=projects[view.pid];
  if(k==='q'){view.q=el.value;render()}
  else if(k==='pnotes'){p.notes=el.value;save(view.pid)}
  else if(k==='tnotes'){const t=p.tasks.find(x=>x.id===view.tid);t.notes=el.value;save(view.pid)}
});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset.input==='status'){projects[view.pid].status=el.value;save(view.pid);render()}
  else if(el.dataset.price){const t=projects[view.pid].tasks.find(x=>x.id===view.tid);const x=t&&t.parts.find(y=>y.id===el.dataset.xid);if(x){const v=el.value.trim();if(v===''||!isFinite(+v)||+v<0)delete x.price;else x.price=Math.round(+v*100)/100;save(view.pid);el.blur();render()}}
  else if(el.dataset.exp){const {x}=findPart(el.dataset.pid,el.dataset.tid,el.dataset.xid);if(x){if(el.value)x.expected=el.value;else delete x.expected;save(el.dataset.pid);el.blur();render()}}});

app.addEventListener('change',e=>{const fi=e.target.closest('[data-importfile]');if(fi){const file=fi.files&&fi.files[0];if(!file)return;if(file.size>20e6){toast('That file is too big to be a Project Tracker backup');return}file.text().then(importBackup).catch(()=>toast('Could not read that file'));fi.value='';return}
  const lb=e.target.closest('[data-labor]');if(lb){const p=projects[view.pid];if(!p)return;const k=lb.dataset.labor;p.labor={...(p.labor||{})};
    if(k==='desc')p.labor.desc=lb.value.trim();else{const v=parseFloat(lb.value);if(isFinite(v)&&v>0)p.labor[k]=Math.round(v*100)/100;else delete p.labor[k]}
    if(k==='hours'&&p.labor.hours&&p.labor.rate===undefined&&shop.rate)p.labor.rate=+shop.rate;
    save(view.pid);lb.blur();render();return}
  const s=e.target.closest('[data-unitsel]');if(!s)return;const f=s.form;const fl=s.value==='qt'||s.value==='gal';
  const q=f.querySelector('[data-qtyfor]');if(q){q.step=fl?'0.1':'1';q.min=fl?'0.1':'1';if(!fl&&q.value)q.value=String(Math.max(1,Math.round(+q.value||1)))}
  const pl=f.querySelector('[data-pricelabel]');if(pl)pl.textContent=`Price ${fl?'per '+s.value:'each'} ($)`});

/* ---------- start ---------- */
render();
function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function connect(u){
  stopAll();user=u;signedOut=false;db=FB.forUser(u.uid);
  projects={};ready=false;inv=null;machines=[];counterLast=0;counterLoaded=false;projectsLoaded=false;backfilled=false;render();
  unsubs.push(db.doc('settings/shop').onSnapshot(s=>{if(s.exists){const v=s.data()||{};shop={name:v.name||'',phone:v.phone||'',email:v.email||'',address:v.address||'',footer:v.footer||'',rate:v.rate||''};if(view.editing!=='shop'&&view.name!=='shopinfo')render()}},()=>{}));
  unsubs.push(db.doc('settings/counter').onSnapshot(s=>{const v=s.exists?Number((s.data()||{}).lastJobNo)||0:0;counterLast=Math.max(counterLast,v);counterLoaded=true;backfillJobNos()},()=>{counterLoaded=true;backfillJobNos()}));
  /* The Logbook's records: parts for the inventory check, engines/vehicles for "Logbook entry" */
  unsubs.push(db.records.onSnapshot(rs=>{
    const live=rs.filter(r=>r&&!r.example);
    inv={parts:live.filter(r=>r.kind==='part').map(r=>({id:r.id,name:String(r.name||''),brand:String(r.brand||''),number:String(r.number||''),qty:r.qty??'',location:String(r.location||'')}))};
    machines=live.filter(r=>kindOf(r)!=='part').map(r=>({id:r.id,name:dname(r)})).sort((a,b)=>a.name.localeCompare(b.name));
    const ae=document.activeElement;const editing=ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||(ae.tagName==='INPUT'&&ae.type!=='search'));if(!editing&&ready)render()},()=>{}));
  unsubs.push(db.collection('projects').onSnapshot(snap=>{
    const editing=document.activeElement&&(document.activeElement.tagName==='TEXTAREA'||(document.activeElement.tagName==='INPUT'&&document.activeElement.type!=='search'));
    const next={};snap.docs.forEach(d=>{if(d.exists){const local=projects[d.id];next[d.id]=(timers['s'+d.id]&&local)?local:JSON.parse(JSON.stringify(d.data()))}});
    Object.keys(projects).forEach(id=>{if(!next[id]&&timers['s'+id]&&projects[id])next[id]=projects[id]});
    projects=next;ready=true;projectsLoaded=true;offline=false;backfillJobNos();if(!editing)render();
  },err=>{offline=true;ready=true;render()}));
}
(async()=>{
  try{FB=await window.fbReady}catch(e){offline=true;ready=true;app.innerHTML='<p class="muted">Couldn\'t load the Project Tracker. Check your connection and reload.</p>';return}
  FB.onAuth(u=>{
    if(!u){stopAll();user=null;db=null;projects={};signedOut=true;ready=true;go({name:'list'});return}
    if(user&&user.uid===u.uid)return;
    connect(u);
  });
})();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/apps/sw.js",{scope:"/apps/"}).catch(()=>{}));</script>
