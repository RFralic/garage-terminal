const T_ST=["To do","In progress","Done"];
const T_CLS={"To do":"plan","In progress":"prog","Done":"done"};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{if(!s)return"—";const d=new Date(String(s).slice(0,10)+"T00:00:00");return isNaN(d)?s:d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};
const money=n=>(Number(n)||0).toLocaleString("en-US",{style:"currency",currency:"USD"});
const safeUrl=u=>{u=String(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return""}};
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return""}};
const isVideo=u=>/youtube\.com|youtu\.be|vimeo\.com|tiktok\.com/i.test(u||"");
const cost=s=>(Number(s.price)||0)*(Number(s.qty)||1);
const num=(v,d)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

let db=null,col=null,assets=null,items=[],offline=false,loaded=false,deferRender=false;
let listTab=(()=>{const v=lsGet("hp-tab");return v==="project"||v==="shop"||v==="upkeep"?v:"room"})();
let view={pid:null,tid:null,ptab:"tasks",ttab:"todo",edit:false,confirm:null,newKind:null,editShop:null,shopStore:"all",showGot:false,shopP:"all",shopT:"all"};
let lb=null; // {idx, confirm}
const timers={},writing={},again={};

/* ---------- storage ---------- */
function lsLoad(){try{return JSON.parse(localStorage.getItem("hp-local")||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem("hp-local",JSON.stringify(items))}catch(e){}}
const getP=id=>items.find(p=>p.id===id);
const getT=(p,id)=>p&&(p.tasks||[]).find(t=>t.id===id);
function setSaving(t){$("#saving").textContent=t}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3200)}
function showBanner(t){const b=$("#banner");b.textContent=t;b.hidden=!t}

function save(p,now){
  p.updatedAt=new Date().toISOString();
  if(offline){lsSave();setSaving("Saved in this browser");return}
  clearTimeout(timers[p.id]);timers[p.id]=setTimeout(()=>flush(p.id),now?0:700);
}
async function flush(id){
  delete timers[id];
  if(writing[id]){again[id]=true;return}
  const p=getP(id);if(!p||!col)return;
  writing[id]=true;setSaving("Saving…");
  try{const {id:_x,...data}=p;await col.doc(id).set(JSON.parse(JSON.stringify(data)));setSaving("Saved")}
  catch(e){setSaving("");toast("Couldn't save ("+(e&&e.code||"error")+"). Your change is still here; edit again to retry.")}
  writing[id]=false;
  if(again[id]){delete again[id];flush(id)}
}
async function removeP(id){
  const p=getP(id);
  const ids=[];if(p){(p.photos||[]).forEach(x=>ids.push(x.id));(p.tasks||[]).forEach(t=>(t.photos||[]).forEach(x=>ids.push(x.id)))}
  items=items.filter(x=>x.id!==id);clearTimeout(timers[id]);delete timers[id];
  if(assets)ids.forEach(a=>assets.delete(a).catch(()=>{}));
  if(offline){lsSave();return}
  try{await col.doc(id).delete()}catch(e){toast("Couldn't delete it. Try again.")}
}

async function init(){
  const fb=setTimeout(()=>{if(!loaded)goOffline("Couldn't reach your saved projects, so changes are kept in this browser only for now.")},10000);
  try{db=window.claude?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){clearTimeout(fb);goOffline("Sign in to save projects to your account. For now, changes are kept in this browser only.");return}
  let me=null;try{const u=await window.claude.use("user");me=u?await u.id():null}catch(e){}
  if(!me){clearTimeout(fb);goOffline("Sign in to keep your own project list. For now, changes are kept in this browser only.");return}
  try{assets=await window.claude.use("assets")}catch(e){assets=null}
  col=db.collection("data/users/"+me);
  col.onSnapshot(snap=>{
    clearTimeout(fb);loaded=true;offline=false;showBanner("");
    const inc=snap.docs.map(d=>Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()||{}))));
    const busy=id=>timers[id]||writing[id];
    const next=inc.map(x=>busy(x.id)?(getP(x.id)||x):x);
    items.forEach(l=>{if(busy(l.id)&&!next.find(x=>x.id===l.id))next.push(l)});
    items=next;
    if(view.pid&&!getP(view.pid)){view.pid=null;view.tid=null}
    if(view.rid&&!getP(view.rid))view.rid=null;
    softRender();
  },err=>{clearTimeout(fb);goOffline("Saved projects couldn't load ("+(err&&err.message||"error")+"). Changes are kept in this browser only.")});
}
function goOffline(msg){if(offline)return;offline=true;loaded=true;items=lsLoad();showBanner(msg);render()}
const typing=()=>{const a=document.activeElement;return a&&(app.contains(a)||$("#lb").contains(a))&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function softRender(){if(typing()){deferRender=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(deferRender&&!typing()){deferRender=false;render()}},60));

/* ---------- helpers ---------- */
function stats(p){
  const ts=p.tasks||[];const s={tasks:ts.length,done:0,todoOpen:0,shopLeft:0,est:0,spent:0,media:(p.photos||[]).length+(p.links||[]).length};
  ts.forEach(t=>{if(t.status==="Done")s.done++;(t.todos||[]).forEach(x=>{if(!x.done)s.todoOpen++});
    (t.shop||[]).forEach(x=>{if(x.got)s.spent+=cost(x);else{s.shopLeft++;s.est+=cost(x)}});
    s.media+=(t.photos||[]).length+(t.links||[]).length});
  return s;
}
const isLate=p=>p.target&&p.status!=="Done"&&p.target<today();
/* A project can be moved into a room (field `room` = the room's id). It then shows inside that room instead of on the Projects tab, and keeps all its own tasks, notes and photos. */
const roomOf=p=>{if(!p||p.kind!=="project"||!p.room)return null;const r=getP(p.room);return r&&r.kind==="room"?r:null};
const projectsIn=r=>items.filter(x=>x.kind==="project"&&x.room===r.id).sort((a,b)=>((a.status==="Done")-(b.status==="Done"))||(a.name||"").localeCompare(b.name||""));
const rooms=()=>items.filter(x=>x.kind==="room").sort((a,b)=>(a.name||"").localeCompare(b.name||""));
const kindWord=(k,pl)=>k==="room"?(pl?"rooms":"room"):(pl?"projects":"project");
const allStores=()=>{const set=new Set();items.forEach(p=>{if((p.kind==="upkeep")&&(p.store||"").trim())set.add(p.store.trim());(p.tasks||[]).forEach(t=>(t.shop||[]).forEach(s=>{if((s.store||"").trim())set.add(s.store.trim())}))});return [...set].sort()};
const storeList=()=>`<datalist id="stores">${allStores().map(s=>`<option value="${esc(s)}"></option>`).join("")}</datalist>`;
const checkBox=(on,act,attrs,label)=>`<button class="check" data-act="${act}" ${attrs} role="checkbox" aria-checked="${!!on}" aria-label="${esc(label)}"><span class="box ${on?"on":""}">✓</span></button>`;

/* ---------- render ---------- */
function render(){
  const top=$("#topActions");
  if(!loaded){return}
  if(view.rid){const r=getP(view.rid);if(r){top.innerHTML=`<button class="ghost" data-act="u-back">← ${view.uFrom&&getP(view.uFrom)?esc(getP(view.uFrom).name):"Upkeep"}</button>`;renderUpkeep(r);return}view.rid=null}
  if(!view.pid){
    top.innerHTML=listTab==="shop"?"":listTab==="upkeep"?`<button class="primary" data-act="u-new">+ Add reminder</button>`:`<button class="primary" data-act="new" data-kind="${listTab}">+ Add ${kindWord(listTab)}</button>`;
    renderList();return;
  }
  const p=getP(view.pid);if(!p){view.pid=null;view.tid=null;return render()}
  if(view.tid){
    const t=getT(p,view.tid);if(!t){view.tid=null;return render()}
    top.innerHTML=`<button class="ghost" data-act="back-p">← ${esc(p.name||"Project")}</button>`;
    renderTask(p,t);
  }else{
    const r=roomOf(p);
    top.innerHTML=r?`<button class="ghost" data-act="open-p" data-id="${esc(r.id)}">← ${esc(r.name||"Room")}</button>`:`<button class="ghost" data-act="back-list">← All ${kindWord(p.kind,1)}</button>`;
    renderProject(p);
  }
  renderLb();
}

function renderList(){
  const count=k=>k==="shop"?items.reduce((n,p)=>n+stats(p).shopLeft,0):k==="upkeep"?upkeepDue():items.filter(p=>p.kind===k&&!roomOf(p)).length;
  const tabs=`<nav class="tabs kindtabs" role="tablist">${[["room","Rooms"],["project","Projects"],["upkeep","Upkeep"],["shop","Shopping"]].map(([k,l])=>`<button role="tab" data-act="ltab" data-v="${k}" aria-selected="${k===listTab}">${l} <span class="cnt ${k==="upkeep"&&count(k)?"hot":""}" ${k==="upkeep"?'title="Due soon or overdue"':""}>${count(k)}</span></button>`).join("")}</nav>`;
  if(listTab==="shop"){app.innerHTML=tabs+renderShopAll();return}
  if(listTab==="upkeep"){app.innerHTML=tabs+renderUpkeepList();if(view.newKind==="upkeep")setTimeout(()=>{const i=$("#nu-name");i&&!i.value&&i.focus()},0);return}
  const k=listTab;
  const newForm=view.newKind===k?`<section class="panel" style="margin-bottom:16px"><form data-form="new-p" class="vsec">
      <h3>New ${kindWord(k)}</h3>
      <div class="fields">
        <label>Name<input id="np-name" name="name" required maxlength="80" placeholder="${k==="room"?"Master bath":"Build a garden shed"}"></label>
        <label>${k==="room"?"Floor / area":"Where"}<input id="np-area" name="area" maxlength="60" placeholder="${k==="room"?"Upstairs":"Back yard"}"></label>
        <label>Status<select id="np-status" name="status">${P_ST.map(s=>`<option>${s}</option>`).join("")}</select></label>
      </div>
      <div class="actions"><button class="primary" type="submit">Create ${kindWord(k)}</button><button type="button" class="ghost" data-act="new-cancel">Cancel</button></div>
    </form></section>`:"";
  const list=items.filter(p=>p.kind===k&&!roomOf(p)).sort((a,b)=>((a.status==="Done")-(b.status==="Done"))||(a.name||"").localeCompare(b.name||""));
  if(!list.length){
    const moved=k==="project"?items.filter(x=>roomOf(x)).length:0;
    app.innerHTML=tabs+newForm+(view.newKind===k?"":`<div class="empty"><h2>No ${moved?"projects outside a room":kindWord(k,1)+" yet"}</h2>${moved?`<p class="muted desc">${moved===1?"Your project is":"All "+moved+" of your projects are"} inside a room. Open the room on the Rooms tab to find ${moved===1?"it":"them"}.</p>`:""}
      <p class="muted desc">${k==="room"?"Add a room like the kitchen or garage, then break it into tasks, each with its own to-dos, shopping list, notes, links and photos.":"Add a project like a deck rebuild or a shed, then break it into tasks, each with its own to-dos, shopping list, notes, links and photos."}</p>
      <div class="actions"><button class="primary" data-act="new" data-kind="${k}">+ Add ${kindWord(k)}</button><button data-act="example" data-kind="${k}">Load an example</button></div></div>`);
    return;
  }
  app.innerHTML=tabs+newForm+`<div class="grid">${list.map(card).join("")}</div>`;
  if(view.newKind===k)setTimeout(()=>{const i=$("#np-name");i&&i.focus()},0);
}
function card(p){
  const s=stats(p);const pct=s.tasks?Math.round(s.done/s.tasks*100):0;
  return `<div class="card"><button class="cardmain" data-act="open-p" data-id="${esc(p.id)}" aria-label="Open ${esc(p.name)}">
    <div class="plate ${p.kind==="room"?"room":"project"}"><b>${esc(p.name||"Untitled")}</b><span>${esc(p.area||"")}</span></div>
    <div class="cbody">
      <div class="between"><span class="st ${P_CLS[p.status]||"plan"}">${esc(p.status||"Planning")}</span><span class="mono small muted">${s.done} of ${s.tasks} tasks done</span></div>
      <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
      <dl><dt>Open to-dos</dt><dd>${s.todoOpen}</dd><dt>Still to buy</dt><dd>${s.shopLeft?`${s.shopLeft} · ${money(s.est)}`:"—"}</dd>
      <dt>Target</dt><dd>${p.target?fmtDate(p.target)+(isLate(p)?" (past due)":""):"—"}</dd>${p.kind==="room"&&projectsIn(p).length?`<dt>Projects</dt><dd>${projectsIn(p).length}</dd>`:""}</dl>
    </div>
    <div class="foot"><span>Updated <span class="mono">${fmtDate(p.updatedAt||p.createdAt)}</span></span>${p.example?'<span class="tag ex">Example</span>':`<span>${s.media} links &amp; pics</span>`}</div>
  </button></div>`;
}

function renderShopAll(){
  const all=[];items.forEach(p=>(p.tasks||[]).forEach(t=>(t.shop||[]).forEach(s=>all.push({p,t,s}))));
  if(!all.length)return `<div class="empty"><h2>Nothing on the list</h2><p class="muted desc">Items you add to any task's shopping list show up here, grouped by store, so you can check them off in the aisle.</p></div>`;
  /* filters: one room or project, then one of its tasks (only ones with items to buy are offered) */
  const withItems=items.filter(p=>(p.tasks||[]).some(t=>(t.shop||[]).length)).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(view.shopP!=="all"&&!withItems.some(p=>p.id===view.shopP)){view.shopP="all";view.shopT="all"}
  const fp=view.shopP==="all"?null:getP(view.shopP);
  const taskOpts=fp?(fp.tasks||[]).filter(t=>(t.shop||[]).length):[];
  if(view.shopT!=="all"&&!taskOpts.some(t=>t.id===view.shopT))view.shopT="all";
  const rows=all.filter(r=>(!fp||r.p.id===fp.id)&&(view.shopT==="all"||r.t.id===view.shopT));
  const optGroup=(k,label)=>{const ps=withItems.filter(p=>(p.kind==="room")===(k==="room"));return ps.length?`<optgroup label="${label}">${ps.map(p=>`<option value="${esc(p.id)}" ${view.shopP===p.id?"selected":""}>${esc(p.name||"Untitled")}</option>`).join("")}</optgroup>`:""};
  const filters=`<div class="shopfilters">
    <label>Room or project<select id="sf-p" data-shopf="p"><option value="all">All rooms &amp; projects</option>${optGroup("room","Rooms")}${optGroup("project","Projects")}</select></label>
    <label>Task<select id="sf-t" data-shopf="t" ${fp?"":"disabled"}><option value="all">${fp?"All tasks":"Pick a room or project first"}</option>${taskOpts.map(t=>`<option value="${esc(t.id)}" ${view.shopT===t.id?"selected":""}>${esc(t.title)}</option>`).join("")}</select></label></div>`;
  const left=rows.filter(r=>!r.s.got);
  const stores=[...new Set(left.map(r=>(r.s.store||"").trim()||"Any store"))].sort((a,b)=>(a==="Any store")-(b==="Any store")||a.localeCompare(b));
  if(view.shopStore!=="all"&&!stores.includes(view.shopStore))view.shopStore="all";
  const shown=rows.filter(r=>(view.showGot||!r.s.got)&&(view.shopStore==="all"||((r.s.store||"").trim()||"Any store")===view.shopStore));
  const groups={};shown.forEach(r=>{const k=(r.s.store||"").trim()||"Any store";(groups[k]=groups[k]||[]).push(r)});
  const gk=Object.keys(groups).sort((a,b)=>(a==="Any store")-(b==="Any store")||a.localeCompare(b));
  const est=left.reduce((n,r)=>n+cost(r.s),0);
  return `<div class="status"><div class="stat hot"><small>Items to buy</small><b>${left.length}</b></div><div class="stat"><small>Estimated cost</small><b>${money(est)}</b></div><div class="stat"><small>Stores</small><b>${stores.length}</b></div></div>
  <div class="vsec" style="margin-bottom:14px">${filters}<div class="pills" role="group" aria-label="Store">${["all",...stores].map(s=>`<button class="pill" data-act="shop-store" data-v="${esc(s)}" aria-pressed="${view.shopStore===s}">${s==="all"?"All stores":esc(s)}</button>`).join("")}
    <button class="pill" data-act="shop-got" aria-pressed="${view.showGot}">Show bought</button></div></div>
  ${gk.length?gk.map(k=>{const g=groups[k];const sub=g.filter(r=>!r.s.got).reduce((n,r)=>n+cost(r.s),0);
    return `<div class="vsec" style="margin-bottom:16px"><div class="storehead"><h3>${esc(k)}</h3><span class="mono small muted">${money(sub)}</span></div><div class="list">${g.map(({p,t,s})=>`<div class="item">
      ${checkBox(s.got,"shop-toggle",`data-pid="${esc(p.id)}" data-tid="${esc(t.id)}" data-id="${esc(s.id)}"`,(s.got?"Mark not bought: ":"Mark bought: ")+s.name)}
      <button class="main" data-act="shop-go" data-pid="${esc(p.id)}" data-tid="${esc(t.id)}"><span class="t ${s.got?"done":""}">${esc(s.name)}</span>
      <span class="m"><span>${esc(p.name)} › ${esc(t.title)}</span><span>qty ${esc(s.qty||1)}</span></span></button>
      <div class="side"><span class="price">${s.price!==""&&s.price!=null?money(cost(s)):""}</span></div></div>`).join("")}</div></div>`}).join("")
  :`<div class="empty"><p class="muted">Everything here is bought. Turn on "Show bought" to see it.</p></div>`}`;
}

function renderProject(p){
  const s=stats(p);
  const planned=s.est+s.spent;const budget=num(p.budget,0);
  const statBoxes=`<div class="status">
    <div class="stat ${s.tasks&&s.done===s.tasks?"ok":""}"><small>Tasks done</small><b>${s.done} of ${s.tasks}</b></div>
    <div class="stat ${s.todoOpen?"warn":""}"><small>Open to-dos</small><b>${s.todoOpen}</b></div>
    <div class="stat ${s.shopLeft?"hot":""}"><small>Still to buy</small><b>${money(s.est)}</b></div>
    <div class="stat ${budget&&planned>budget?"hot":budget?"ok":""}"><small>${budget?"Planned of budget":"Bought so far"}</small><b>${budget?`${money(planned)} / ${money(budget)}`:money(s.spent)}</b></div></div>`;
  const tabs=[["tasks","Tasks",s.tasks],["media","Inspiration",(p.photos||[]).length+(p.links||[]).length],["notes","Notes",null]];
  app.innerHTML=`<div class="head"><div class="t">
      <span class="eyebrow">${p.kind==="room"?"Room":"Project"}${roomOf(p)?` · in <button type="button" class="linkbtn" data-act="open-p" data-id="${esc(roomOf(p).id)}">${esc(roomOf(p).name||"a room")}</button>`:""}${p.area?" · "+esc(p.area):""}</span>
      <h2>${esc(p.name||"Untitled")}</h2>
      <div class="meta"><span class="st ${P_CLS[p.status]||"plan"}">${esc(p.status||"Planning")}</span>${p.target?`<span>Target <span class="mono">${fmtDate(p.target)}</span></span>`:""}${isLate(p)?'<span class="st late">Past due</span>':""}${p.example?'<span class="tag ex">Example</span>':""}</div>
      ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}
    </div>${view.edit||view.move?"":`<div class="actions">${p.kind==="project"?`<button data-act="move">${roomOf(p)?"Move…":"Move to a room"}</button>`:""}<button data-act="edit">Edit details</button></div>`}</div>
    ${view.move&&p.kind==="project"?moveForm(p):""}${view.edit?editProject(p):statBoxes+`<nav class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button role="tab" data-act="ptab" data-v="${k}" aria-selected="${view.ptab===k}">${l}${n!=null?` <span class="cnt">${n}</span>`:""}</button>`).join("")}</nav>
    ${view.ptab==="tasks"?taskList(p):view.ptab==="media"?`<section class="panel">${media(p)}</section>`:notesPanel(p.notes,"Project notes","Measurements, paint colors, contractor quotes, what's behind the wall…")}`}`;
}
function moveForm(p){
  const rs=rooms(),cur=roomOf(p);
  if(!rs.length)return `<section class="panel" style="margin-bottom:16px"><h3>Move to a room</h3><p class="muted">You don't have any rooms yet. Add one on the Rooms tab (like Kitchen or Garage), then come back and move this project into it.</p><div class="actions"><button type="button" class="ghost" data-act="move-cancel">OK</button></div></section>`;
  return `<section class="panel" style="margin-bottom:16px"><form data-form="move-p" class="vsec"><h3>${cur?"Move this project":"Move to a room"}</h3>
    <p class="muted">It keeps all its tasks, to-dos, shopping list, notes and photos, and shows up inside the room you pick.</p>
    <div class="fields"><label>Room<select id="mv-room" name="room">${rs.map(r=>`<option value="${esc(r.id)}" ${cur&&cur.id===r.id?"selected":""}>${esc(r.name||"Untitled")}${r.area?" · "+esc(r.area):""}</option>`).join("")}${cur?`<option value="">Not in a room (back to the Projects tab)</option>`:""}</select></label></div>
    <div class="actions"><button class="primary" type="submit">Move</button><button type="button" class="ghost" data-act="move-cancel">Cancel</button></div>
  </form></section>`;
}
function editProject(p){
  return `<section class="panel"><form data-form="edit-p" class="vsec"><h3>Details</h3>
    <div class="fields">
      <label>Name<input id="ep-name" name="name" required maxlength="80" value="${esc(p.name)}"></label>
      <label>Type<select id="ep-kind" name="kind"><option value="room" ${p.kind==="room"?"selected":""}>Room</option><option value="project" ${p.kind!=="room"?"selected":""}>Project</option></select></label>
      <label>Floor / area<input id="ep-area" name="area" maxlength="60" value="${esc(p.area)}"></label>
      <label>Status<select id="ep-status" name="status">${P_ST.map(s=>`<option ${p.status===s?"selected":""}>${s}</option>`).join("")}</select></label>
      <label>Target date<input id="ep-target" name="target" type="date" value="${esc(p.target)}"></label>
      <label>Budget ($)<input id="ep-budget" name="budget" type="number" inputmode="decimal" min="0" step="1" value="${esc(p.budget)}" placeholder="Optional"></label>

async function shrink(file){
  try{
    const url=URL.createObjectURL(file);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const M=1800;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,M/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.84));return b||file;
  }catch(e){return file}
}
async function upload(files){
  if(!assets||!files.length)return;
  const pid=view.pid,tid=view.tid;
  let ok=0;
  for(let i=0;i<files.length;i++){
    const n=$("#upnote");if(n)n.textContent=`Uploading ${i+1} of ${files.length}…`;
    try{
      const blob=await shrink(files[i]);
      const r=await assets.upload(blob);
      const p=getP(pid);const o=tid?getT(p,tid):p;if(!o)break;
      (o.photos=o.photos||[]).push({id:r.id,caption:"",at:new Date().toISOString()});
      save(p,true);ok++;
    }catch(e){toast(e&&e.code==="unsupported_type"?"That file type can't be stored. Try a JPEG or PNG.":e&&e.code==="quota_exceeded"?"Photo storage is full. Delete a few photos first.":"A photo didn't upload ("+(e&&e.code||"error")+"). Try again.")}
  }
  if(ok)toast(ok===1?"Photo added":ok+" photos added");
  render();
}

const UNITS=[["days","day"],["weeks","week"],["months","month"],["years","year"]];
const UDAYS={days:1,weeks:7,months:30.4,years:365};
const PRESETS=[["Furnace filter",3,"months","16x25x1"],["Fridge water filter",6,"months",""],["Test smoke & CO alarms",1,"months",""],["Smoke alarm batteries",1,"years","9V"],["Water softener salt",1,"months",""],["Whole-house water filter",6,"months",""],["Range hood filter",3,"months",""],["Dryer vent cleaning",1,"years",""],["Gutter cleaning",6,"months",""],["HVAC service",1,"years",""]];
const ups=()=>items.filter(x=>x.kind==="upkeep");
const dOf=s=>new Date(String(s).slice(0,10)+"T00:00:00");
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function addInt(s,n,u){const d=dOf(s);n=Math.max(1,Math.round(Number(n)||1));
  if(u==="days"||u==="weeks"){d.setDate(d.getDate()+n*(u==="weeks"?7:1));return ymd(d)}
  const m=n*(u==="years"?12:1),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);
  d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ymd(d)}
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const everyText=r=>{const n=Math.max(1,Math.round(Number(r.every)||1));const w=(UNITS.find(u=>u[0]===r.unit)||UNITS[2])[1];return n===1?"Every "+w:"Every "+n+" "+w+"s"};
function syncLast(r){const h=(r.history||[]).map(x=>x.date).filter(Boolean).sort();r.last=h.length?h[h.length-1]:""}
function ustate(r){
  if(!r.last)return {cls:"plan",label:"Not logged yet",ord:-.5,due:null,need:false};
  const due=addInt(r.last,r.every,r.unit);const days=Math.round((dOf(due)-dOf(today()))/864e5);
  const w=Math.min(14,Math.max(3,Math.round((Number(r.every)||1)*(UDAYS[r.unit]||30)*.2)));
  if(days<0)return {cls:"late",label:"Overdue "+plural(-days,"day"),ord:days,due,need:true,over:true};
  if(days===0)return {cls:"prog",label:"Due today",ord:0,due,need:true};
  if(days<=w)return {cls:"prog",label:"Due in "+plural(days,"day"),ord:days,due,need:true};
  return {cls:"done",label:"Due "+fmtDate(due),ord:days,due,need:false};
}

const roomNames=()=>items.filter(p=>p.kind==="room").map(p=>p.name).filter(Boolean).sort();

  const showNew=view.newKind==="upkeep"||!list.length;
  if(!list.length)return (showNew?newUpkeepForm():"")+`<p class="muted desc">Set up recurring chores like filters and batteries. Each one shows when it's next due, and the tab badge counts what's due soon or overdue.</p>`;
  const st=list.map(ustate);const over=st.filter(s=>s.over).length,soon=st.filter(s=>s.need&&!s.over).length;
  const need=list.filter(r=>{const s=ustate(r);return s.need||!r.last}),later=list.filter(r=>!need.includes(r));
  return (showNew?newUpkeepForm():"")+`<div class="status">
      <div class="stat ${over?"hot":"ok"}"><small>Overdue</small><b>${over}</b></div>
      <div class="stat ${soon?"warn":""}"><small>Due soon</small><b>${soon}</b></div>
      <div class="stat"><small>Reminders</small><b>${list.length}</b></div></div>
    ${need.length?`<div class="vsec" style="margin-bottom:16px"><h3>Needs attention</h3><div class="list">${need.map(urow).join("")}</div></div>`:""}
    ${later.length?`<div class="vsec"><h3>Coming up</h3><div class="list">${later.map(urow).join("")}</div></div>`:""}`;
}
function roomUpkeep(p){
  if(p.kind!=="room")return "";
  const nm=(p.name||"").trim().toLowerCase();
  const list=sortUps(ups().filter(r=>(r.location||"").trim().toLowerCase()===nm&&nm));
  return `<section class="panel" style="margin-top:16px"><div class="secthead"><h3>Upkeep in this room</h3><button class="btn sm" data-act="u-new-here">+ Reminder</button></div>
    ${list.length?`<div class="list">${list.map(urow).join("")}</div>`:`<p class="muted">No reminders here yet. Add one, like a filter or alarm battery, with this room as its location.</p>`}</section>`;
}
function renderUpkeep(r){
  const s=ustate(r);const hist=[...(r.history||[])].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const u=safeUrl(r.url);
  app.innerHTML=`<div class="head"><div class="t">
      <span class="eyebrow">Upkeep reminder${r.location?" · "+esc(r.location):""}</span>
      <h2>${esc(r.name||"Untitled")}</h2>
      <div class="meta"><span class="st ${s.cls}">${s.label}</span><span>${everyText(r)}</span></div>
    </div>${view.edit?"":`<button data-act="edit">Edit</button>`}</div>
    ${view.edit?`<section class="panel"><form data-form="u-edit" class="vsec"><h3>Details</h3>
      <div class="fields">
        <label class="span2">What needs doing<input id="eu-name" name="name" required maxlength="80" value="${esc(r.name)}"></label>
        <label>Every<input id="eu-every" name="every" type="number" inputmode="numeric" min="1" max="999" step="1" value="${esc(r.every)}" required></label>
        <label>Unit<select id="eu-unit" name="unit">${UNITS.map(([x])=>`<option value="${x}" ${r.unit===x?"selected":""}>${x[0].toUpperCase()+x.slice(1)}</option>`).join("")}</select></label>
        <label>Location<input id="eu-loc" name="location" list="roomlist" maxlength="60" value="${esc(r.location)}"></label>
        <label>Part / size<input id="eu-part" name="part" maxlength="80" value="${esc(r.part)}"></label>
        <label>Where to buy<input id="eu-store" name="store" list="stores" maxlength="60" value="${esc(r.store)}" placeholder="Home Depot"></label>
        <label>Product link<input id="eu-url" name="url" inputmode="url" maxlength="500" value="${esc(r.url)}" placeholder="https://"></label>
        <label class="span2">Notes<textarea id="eu-notes" name="notes" style="min-height:90px" maxlength="1000" placeholder="Arrow on filter points toward the furnace">${esc(r.notes)}</textarea></label>
      </div><datalist id="roomlist">${roomNames().map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>${storeList()}
      <div class="between"><div class="actions"><button class="primary" type="submit">Save</button><button type="button" class="ghost" data-act="edit-cancel">Cancel</button></div>
      ${view.confirm==="u"?`<div class="confirm"><span>Delete this reminder and its log?</span><button type="button" class="danger" data-act="u-del-yes">Delete</button><button type="button" data-act="confirm-no">Keep</button></div>`:`<button type="button" class="danger" data-act="u-del">Delete reminder</button>`}</div>
    </form></section>`
    :`<div class="status">
      <div class="stat ${s.over?"hot":s.need?"warn":r.last?"ok":""}"><small>Next due</small><b>${s.due?fmtDate(s.due):"—"}</b></div>
      <div class="stat"><small>Last done</small><b>${r.last?fmtDate(r.last):"—"}</b></div>
      <div class="stat"><small>Times logged</small><b>${hist.length}</b></div></div>
    <section class="panel">
      <form data-form="u-log" class="logform">
        <label>Done on<input id="ul-date" name="date" type="date" max="${today()}" value="${today()}" required></label>
        <label>Note<input id="ul-note" name="note" maxlength="140" placeholder="Optional, e.g. Filtrete MPR 1500"></label>
        <button class="primary" type="submit">Log as done</button>
      </form>
      ${r.part||r.store||u||r.notes?`<dl class="kv">${r.part?`<dt>Part / size</dt><dd class="mono">${esc(r.part)}</dd>`:""}${r.store?`<dt>Where to buy</dt><dd>${esc(r.store)}</dd>`:""}${u?`<dt>Link</dt><dd><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(u)||u)} ↗</a></dd>`:""}${r.notes?`<dt>Notes</dt><dd>${esc(r.notes)}</dd>`:""}</dl>`
        :`<p class="muted small">Tap Edit to add the part size, where to buy it and notes.</p>`}
      <div class="vsec"><h3>Log</h3>${hist.length?`<div class="list hist">${hist.map(h=>`<div class="item"><span class="d">${fmtDate(h.date)}</span><div class="main static"><span class="small ${h.note?"":"muted"}">${h.note?esc(h.note):"Done"}</span></div><div class="side"><button class="x" data-act="u-hist-del" data-id="${esc(h.id)}" aria-label="Remove log entry from ${fmtDate(h.date)}">×</button></div></div>`).join("")}</div>`:`<p class="muted">Nothing logged yet.</p>`}</div>
    </section>`}`;
}
function logDone(r,date,note){
  const prev=JSON.parse(JSON.stringify(r.history||[]));
  (r.history=r.history||[]).push({id:uid(),date,note:note||""});syncLast(r);save(r,true);render();
  const s=ustate(r);
  const el=$("#toast");el.innerHTML="";el.append(document.createTextNode("Logged. "+(s.due?"Next due "+fmtDate(s.due)+".":"")));
  const b=document.createElement("button");b.textContent="Undo";b.onclick=()=>{r.history=prev;syncLast(r);save(r,true);el.hidden=true;render()};el.append(b);
  el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,6000);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||!/^u-/.test(b.dataset.act))return;
  const a=b.dataset.act,d=b.dataset;const r=view.rid?getP(view.rid):null;
  switch(a){
    case"u-new":listTab="upkeep";lsSet("hp-tab","upkeep");view.uPrefill=null;go({pid:null,tid:null,newKind:"upkeep"});break;
    case"u-new-here":{const p=getP(view.pid);listTab="upkeep";lsSet("hp-tab","upkeep");view.uPrefill={location:p?p.name:""};go({pid:null,tid:null,newKind:"upkeep"});break}
    case"u-new-cancel":view.newKind=null;view.uPrefill=null;render();break;
    case"u-preset":{const x=PRESETS[+d.i];const f=(id,v)=>{const el=$(id);if(el)el.value=v};f("#nu-name",x[0]);f("#nu-every",x[1]);f("#nu-unit",x[2]);const pt=$("#nu-part");if(pt){pt.placeholder=x[3]?"e.g. "+x[3]:"Filter size, battery type, model #"}const l=$("#nu-last");l&&l.focus();break}
    case"u-open":view.uFrom=view.pid&&!view.tid?view.pid:null;go({rid:d.id,pid:null,tid:null});break;
    case"u-back":{const from=view.uFrom&&getP(view.uFrom)?view.uFrom:null;view.uFrom=null;if(!from){listTab="upkeep"}go({rid:null,pid:from,tid:null,ptab:"tasks"});break}
    case"u-done":{const x=getP(d.id);if(x)logDone(x,today(),"");break}
    case"u-del":view.confirm="u";render();break;
    case"u-del-yes":if(r){removeP(r.id);listTab="upkeep";toast("Reminder deleted");view.uFrom=null;go({rid:null,pid:null,tid:null})}break;
    case"u-hist-del":if(r){r.history=(r.history||[]).filter(h=>h.id!==d.id);syncLast(r);save(r,true);render()}break;
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f||!/^u-/.test(f.dataset.form))return;
  const v=Object.fromEntries(new FormData(f).entries());Object.keys(v).forEach(k=>v[k]=String(v[k]).trim());
  const every=Math.max(1,Math.min(999,Math.round(num(v.every,1))||1)),unit=UNITS.some(u=>u[0]===v.unit)?v.unit:"months";
  const r=view.rid?getP(view.rid):null;
  switch(f.dataset.form){
    case"u-new":{if(!v.name)return;const x={id:uid(),kind:"upkeep",name:v.name,every,unit,location:v.location,part:v.part,store:"",url:"",notes:"",history:[],createdAt:new Date().toISOString()};
      if(v.last)x.history.push({id:uid(),date:v.last,note:""});syncLast(x);items.push(x);save(x,true);view.uPrefill=null;view.newKind=null;render();toast("Reminder added");break}
    case"u-edit":if(!r||!v.name)return;Object.assign(r,{name:v.name,every,unit,location:v.location,part:v.part,store:v.store,url:v.url?safeUrl(v.url):"",notes:v.notes});save(r,true);view.edit=false;view.confirm=null;render();toast("Saved");break;
    case"u-log":if(!r||!v.date)return;logDone(r,v.date,v.note);break;
  }
});

/* ---------- events ---------- */
function go(v){Object.assign(view,{edit:false,move:false,confirm:null,editShop:null,rid:null},v);lb=null;render();window.scrollTo(0,0)}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="LABEL")return;
  const a=b.dataset.act,d=b.dataset;const p=getP(view.pid);const t=p&&view.tid?getT(p,view.tid):null;
  switch(a){
    case"ltab":listTab=d.v;lsSet("hp-tab",d.v);view.newKind=null;render();break;
    case"new":listTab=d.kind;go({pid:null,tid:null,newKind:d.kind});break;
    case"new-cancel":view.newKind=null;render();break;
    case"example":{const x=example(d.kind);items.push(x);save(x,true);go({pid:x.id,tid:null,ptab:"tasks"});break}
    case"open-p":go({pid:d.id,tid:null,ptab:"tasks",newKind:null});break;
    case"back-list":listTab=p?p.kind:listTab;go({pid:null,tid:null});break;
    case"back-p":go({tid:null});break;
    case"ptab":view.ptab=d.v;render();break;
    case"ttab":view.ttab=d.v;view.editShop=null;render();break;
    case"move":view.move=true;view.edit=false;render();setTimeout(()=>{const i=$("#mv-room");i&&i.focus()},0);break;
    case"move-cancel":view.move=false;render();break;
    case"edit":view.move=false;view.edit=true;view.confirm=null;render();setTimeout(()=>{const i=$("#ep-name")||$("#et-title");i&&i.focus()},0);break;
    case"edit-cancel":view.edit=false;view.confirm=null;render();break;
    case"confirm-no":view.confirm=null;render();break;
    case"del-p":view.confirm="p";render();break;
    case"del-p-yes":{const k=p.kind;if(k==="room")projectsIn(p).forEach(x=>{delete x.room;save(x,true)});await removeP(p.id);listTab=k;toast("Deleted");go({pid:null,tid:null});break}
    case"del-t":view.confirm="t";render();break;
    case"del-t-yes":{const ids=(t.photos||[]).map(x=>x.id);p.tasks=p.tasks.filter(x=>x.id!==t.id);save(p,true);if(assets)ids.forEach(i=>assets.delete(i).catch(()=>{}));toast("Task deleted");go({tid:null});break}
    case"open-t":go({tid:d.id,ttab:"todo"});break;
    case"task-toggle":{const x=getT(p,d.id);x.status=x.status==="Done"?"To do":"Done";save(p);render();break}
    case"t-status":t.status=d.v;save(p);render();break;
    case"todo-toggle":{const x=t.todos.find(y=>y.id===d.id);x.done=!x.done;save(p);render();break}
    case"todo-del":t.todos=t.todos.filter(y=>y.id!==d.id);save(p);render();break;
    case"shop-toggle":{const pp=getP(d.pid),tt=getT(pp,d.tid);const x=tt&&(tt.shop||[]).find(y=>y.id===d.id);if(!x)break;x.got=!x.got;save(pp);render();break}
    case"shop-edit":view.editShop=d.id;render();setTimeout(()=>{const i=$("#es-name");i&&i.focus()},0);break;
    case"shop-cancel":view.editShop=null;render();break;
    case"shop-del":t.shop=t.shop.filter(y=>y.id!==d.id);view.editShop=null;save(p);render();break;
    case"shop-go":go({pid:d.pid,tid:d.tid,ttab:"shop"});break;
    case"shop-store":view.shopStore=d.v;render();break;
    case"shop-got":view.showGot=!view.showGot;render();break;
    case"link-del":{const o=mediaTarget();o.links=(o.links||[]).filter(y=>y.id!==d.id);save(p);render();break}
    case"photo":lb={idx:+d.i,confirm:false};renderLb();setTimeout(()=>{const c=$("[data-act=lb-close]");c&&c.focus()},0);break;
    case"lb-close":lb=null;renderLb();break;
    case"lb-prev":case"lb-next":{const n=(mediaTarget().photos||[]).length;lb.idx=(lb.idx+(a==="lb-next"?1:-1)+n)%n;lb.confirm=false;renderLb();break}
    case"lb-del":lb.confirm=true;renderLb();break;
    case"lb-keep":lb.confirm=false;renderLb();break;
    case"lb-del-yes":{const o=mediaTarget();const x=o.photos[lb.idx];o.photos.splice(lb.idx,1);save(p,true);if(assets&&x)assets.delete(x.id).catch(()=>{});lb=null;toast("Photo deleted");render();break}
  }
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f).entries());Object.keys(v).forEach(k=>v[k]=String(v[k]).trim());
  const p=getP(view.pid);const t=p&&view.tid?getT(p,view.tid):null;
  switch(f.dataset.form){
    case"new-p":{if(!v.name)return;const x={id:uid(),kind:view.newKind,name:v.name,area:v.area,status:v.status||"Planning",target:"",budget:"",desc:"",notes:"",tasks:[],links:[],photos:[],createdAt:new Date().toISOString()};
      items.push(x);save(x,true);go({pid:x.id,tid:null,newKind:null,ptab:"tasks"});setTimeout(()=>{const i=$("#nt-title");i&&i.focus()},0);break}
    case"edit-p":{const wasRoom=p.kind==="room",inside=wasRoom?projectsIn(p):[];
      Object.assign(p,{name:v.name||p.name,kind:v.kind==="room"?"room":"project",area:v.area,status:v.status,target:v.target,budget:v.budget,desc:v.desc});
      if(p.kind==="room")delete p.room; /* a room can't sit inside another room */
      if(wasRoom&&p.kind!=="room")inside.forEach(x=>{delete x.room;save(x,true)});}
      save(p,true);view.edit=false;view.confirm=null;render();toast("Details saved");break;
    case"move-p":{const r=v.room?getP(v.room):null;
      if(r&&r.kind==="room"){p.room=r.id;save(p,true);view.move=false;render();toast("Moved to "+(r.name||"the room"))}
      else{delete p.room;save(p,true);view.move=false;listTab="project";render();toast("Moved back to the Projects tab")}break}
    case"add-task":if(!v.title)return;(p.tasks=p.tasks||[]).push({id:uid(),title:v.title,status:"To do",notes:"",todos:[],shop:[],links:[],photos:[]});save(p);render();refocus("#nt-title");break;
    case"edit-t":if(!v.title)return;t.title=v.title;save(p);view.edit=false;view.confirm=null;render();break;
    case"add-todo":if(!v.text)return;(t.todos=t.todos||[]).push({id:uid(),text:v.text,done:false});save(p);render();refocus("#nd-text");break;
    case"add-shop":if(!v.name)return;(t.shop=t.shop||[]).push({id:uid(),name:v.name,qty:num(v.qty,1)||1,price:v.price===""?"":num(v.price,""),store:v.store,got:false,url:""});save(p);render();refocus("#ns-name");break;
    case"edit-shop":{const x=t.shop.find(y=>y.id===f.dataset.id);if(!x)break;Object.assign(x,{name:v.name||x.name,qty:num(v.qty,1)||1,price:v.price===""?"":num(v.price,""),store:v.store,url:v.url});view.editShop=null;save(p);render();break}
    case"add-link":{const u=safeUrl(v.url);if(!u){toast("That link doesn't look right. Paste a full web address.");return}const o=mediaTarget();(o.links=o.links||[]).push({id:uid(),label:v.label,url:u});save(p);render();refocus("#nl-url");break}
  }
});
function refocus(sel){setTimeout(()=>{const i=$(sel);i&&i.focus()},0)}
document.addEventListener("input",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.live)return;
  const p=getP(view.pid);if(!p)return;
  if(el.dataset.live==="notes"){const o=view.tid?getT(p,view.tid):p;o.notes=el.value;save(p)}
  if(el.dataset.live==="caption"&&lb){const o=mediaTarget();const x=o.photos[lb.idx];if(x){x.caption=el.value;save(p)}}
});
document.addEventListener("change",e=>{if(e.target.id==="up"){const fs=[...e.target.files];e.target.value="";upload(fs)}
  else if(e.target.dataset&&e.target.dataset.shopf){if(e.target.dataset.shopf==="p"){view.shopP=e.target.value;view.shopT="all"}else view.shopT=e.target.value;render();const s=$("#sf-"+e.target.dataset.shopf);s&&s.focus()}});
document.addEventListener("keydown",e=>{if(!lb)return;if(e.key==="Escape"){lb=null;renderLb()}else if(e.target.tagName!=="INPUT"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const n=(mediaTarget().photos||[]).length;lb.idx=(lb.idx+(e.key==="ArrowRight"?1:-1)+n)%n;renderLb()}});

init();
})();
</script>
