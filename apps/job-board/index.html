function buildReceiptHtml(p,kind){
  const c=p.customer||{};const job=jobLabel(p);const parts=allParts(p);const hr='<div class="rc-hr"></div>';
  const row=(l,r,cls='')=>`<div class="rc-row ${cls}"><span class="rc-w">${l}</span><span>${r}</span></div>`;
  let h=`<div class="rc-c rc-big rc-w">${esc(shop.name||'Your shop name')}</div>`;
  if(kind==='invoice'){if(shop.address)h+=`<div class="rc-c rc-w">${esc(shop.address)}</div>`;if(shop.email)h+=`<div class="rc-c rc-w">${esc(shop.email)}</div>`}
  if(shop.phone)h+=`<div class="rc-c">${esc(shop.phone)}</div>`;
  h+=hr+`<div class="rc-c rc-b">${kind==='invoice'?'INVOICE':'WORK REPORT'}</div>`+row('Job',esc(job||'-'))+row('Date',esc(new Date().toLocaleDateString('en-US')));
  h+=row('Customer',esc(c.name||'-'));if(c.phone)h+=row('Phone',esc(c.phone));
  h+=`<div class="rc-w">Machine: ${esc(p.machine||p.title||'-')}</div>`+hr;
  if(kind==='report'){
    if(c.complaint)h+=`<div class="rc-b">Complaint</div><div class="rc-w">${esc(c.complaint)}</div>`+hr;
    const doneT=(p.tasks||[]).filter(t=>t.done),open=(p.tasks||[]).filter(t=>!t.done);
    h+=`<div class="rc-b">Work performed</div>${doneT.length?doneT.map(t=>`<div class="rc-w">[x] ${esc(t.title)}</div>`).join(''):'<div>No completed work recorded yet.</div>'}`;
    if(open.length)h+=hr+`<div class="rc-b">Not done / recommended</div>${open.map(t=>`<div class="rc-w">[ ] ${esc(t.title)}</div>`).join('')}`;
    if(parts.length)h+=hr+`<div class="rc-b">Parts used</div>${parts.map(x=>row(esc(x.name)+(idText(x)?`<div class="rc-ind">${esc(idText(x))}</div>`:''),esc(isFluid(x)?qtyText(x):'x'+numStr(x.qty||1)))).join('')}`;
    h+=`${custNotes(p)?hr+`<div class="rc-b">Notes</div><div class="rc-w" style="white-space:pre-wrap">${esc(custNotes(p))}</div>`:''}`+hr+`<div class="rc-c">Thank you for your business.</div>`;
  }else{
    const pc=partsCost(p),lc=laborCost(p);
    h+=parts.length?parts.map(x=>{const q=x.qty||1;const each=hasPrice(x)?money(x.price)+(isFluid(x)?'/'+x.unit:''):'no price';
      return `<div class="rc-w">${esc(x.name)}</div>${idText(x)?`<div class="rc-ind rc-w">${esc(idText(x))}</div>`:''}${row(`<span class="rc-ind">${esc(isFluid(x)?qtyText(x):numStr(q))} x ${esc(each)}</span>`,hasPrice(x)?esc(money(x.price*q)):'-')}`}).join(''):'<div>No parts on this job.</div>';
    if(lc.has)h+=hr+`<div class="rc-w">Labor${lc.desc?': '+esc(lc.desc):''}</div>`+row(`<span class="rc-ind">${esc(numStr(lc.hours))} hr x ${esc(money(lc.rate))}</span>`,esc(money(lc.total)));
    const df=deliveryFee(p);if(df.has)h+=hr+`<div class="rc-w">${esc(df.desc)}</div>`+row('',esc(money(df.total)));
    h+=hr+row('Parts',esc(money(pc.total)))+(lc.has?row('Labor',esc(money(lc.total))):'')+(df.has?row(df.trips===2?'Pickup + delivery':delivers(p)?'Delivery':'Pickup',esc(money(df.total))):'')+row('TOTAL',esc(money(pc.total+lc.total+df.total)),'rc-big');
    if(pc.missing)h+=`<div class="rc-w">${pc.missing} part${pc.missing>1?'s have':' has'} no price and ${pc.missing>1?'are':'is'} not included.</div>`;
    h+=`${custNotes(p)?hr+`<div class="rc-b">Notes</div><div class="rc-w" style="white-space:pre-wrap">${esc(custNotes(p))}</div>`:''}`+hr+`<div class="rc-c rc-w">${esc(shop.footer||'Thank you for your business.')}</div>`;
  }
  return h+'<div class="rc-tail"></div>';
}
// Standard receipt paper widths. print = the printable width (the printer's head leaves a margin on each side); fs = font size in pt.
var RCPT={'58':{label:'58 mm (2 1/4 in) · small and handheld printers',print:48,fs:8.5},'76':{label:'76 mm (3 in) · kitchen and impact printers',print:66,fs:9},'80':{label:'80 mm (3 1/8 in) · most common',print:72,fs:9.5},'112':{label:'112 mm (4 3/8 in) · wide printers',print:104,fs:10.5}};
function rcptW(){return RCPT[shop.receiptWidth]?shop.receiptWidth:'80'}
function printReceipt(p,kind){
  const el=document.getElementById('print');const w=rcptW(),r=RCPT[w];
  el.className='receipt';el.style.width=r.print+'mm';el.style.fontSize=r.fs+'pt';el.innerHTML=buildReceiptHtml(p,kind);
  const pg=document.createElement('style');pg.id='receiptPage';pg.textContent=`@page{size:${w}mm auto;margin:0}`;document.head.appendChild(pg);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');el.innerHTML='';el.className='';el.style.width='';el.style.fontSize='';pg.remove();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);window.print();
}
function printDoc(p,kind){
  const el=document.getElementById('print');el.innerHTML=buildPrintHtml(p,kind);document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');el.innerHTML='';window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);window.print();
}

  const q=f.querySelector('[data-qtyfor]');if(q){q.step=fl?'0.1':'1';q.min=fl?'0.1':'1';if(!fl&&q.value)q.value=String(Math.max(1,Math.round(+q.value||1)))}
  const pl=f.querySelector('[data-pricelabel]');if(pl)pl.textContent=`Price ${fl?'per '+s.value:'each'} ($)`});

/* ---------- start ---------- */
render();
function stopAll(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function connect(u){
  stopAll();user=u;signedOut=false;db=FB.forUser(u.uid);
  projects={};ready=false;inv=null;machines=[];machinesLoaded=false;machineRecs={};counterLast=0;counterLoaded=false;projectsLoaded=false;backfilled=false;render();
  unsubs.push(db.doc('settings/shop').onSnapshot(s=>{if(s.exists){const v=s.data()||{};shop={name:v.name||'',phone:v.phone||'',email:v.email||'',address:v.address||'',footer:v.footer||'',rate:v.rate||'',receiptWidth:RCPT[v.receiptWidth]?v.receiptWidth:'80',dayLimit:+v.dayLimit>0?Math.round(+v.dayLimit):'',delivery:v.delivery===true,delivFees:v.delivFees===true,delRate:+v.delRate>0?+v.delRate:'',delMin:+v.delMin>0?+v.delMin:'',delFree:+v.delFree>0?+v.delFree:'',delRound:v.delRound!==false};if(view.editing!=='shop'&&view.name!=='shopinfo')render()}},()=>{}));
  unsubs.push(db.doc('settings/customers').onSnapshot(s=>{const v=s.exists?(s.data()||{}):null;customers=v&&Array.isArray(v.list)?v.list.filter(c=>c&&c.id):[];customersBuilt=customersBuilt||!!(v&&v.built);customersLoaded=true;buildCustomers();handleDeep();if(ready)render()},()=>{customersLoaded=true}));
  try{unsubs.push(db.doc('shop/info').onSnapshot(s=>{const v=s.exists?(s.data()||{}):{};shopTeam={on:v.on===true,people:Array.isArray(v.people)?v.people.filter(x=>x&&x.id&&x.name):[],options:v.options&&typeof v.options==='object'?v.options:{}};if(ready)render()},()=>{}))}catch(e){/* this page's own backend has no shop doc: employees stay off */}
  unsubs.push(db.doc('settings/counter').onSnapshot(s=>{const v=s.exists?Number((s.data()||{}).lastJobNo)||0:0;counterLast=Math.max(counterLast,v);counterLoaded=true;backfillJobNos()},()=>{counterLoaded=true;backfillJobNos()}));
  /* The Logbook's records: parts for the inventory check, engines/vehicles for "Logbook entry" */
  unsubs.push(db.records.onSnapshot(rs=>{
    const live=rs.filter(r=>r&&!r.example);
    inv={parts:live.filter(r=>r.kind==='part').map(r=>({id:r.id,name:String(r.name||''),brand:String(r.brand||''),number:String(r.number||''),qty:r.qty??'',location:String(r.location||''),alts:Array.isArray(r.alts)?r.alts.map(String):[],unit:r.category==='Fluids'&&(r.unit==='qt'||r.unit==='gal')?r.unit:''}))};
    machines=live.filter(r=>kindOf(r)!=='part').map(r=>({id:r.id,name:dname(r),kind:kindOf(r),equipment:String(r.equipment||''),owner:r.owner&&(r.owner.id||r.owner.name)?{id:String(r.owner.id||''),name:String(r.owner.name||'')}:null})).sort((a,b)=>a.name.localeCompare(b.name));machinesLoaded=true;handleDeep();
    machineRecs=Object.fromEntries(live.filter(r=>kindOf(r)!=='part').map(r=>[r.id,r]));
    const ae=document.activeElement;const editing=ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'||(ae.tagName==='INPUT'&&ae.type!=='search'));if(!editing&&ready)render()},()=>{}));
  unsubs.push(db.collection('projects').onSnapshot(snap=>{
    const editing=document.activeElement&&(document.activeElement.tagName==='TEXTAREA'||(document.activeElement.tagName==='INPUT'&&document.activeElement.type!=='search'));
    const next={};snap.docs.forEach(d=>{if(d.exists){const local=projects[d.id];next[d.id]=(timers['s'+d.id]&&local)?local:JSON.parse(JSON.stringify(d.data()))}});
    Object.keys(projects).forEach(id=>{if(!next[id]&&timers['s'+id]&&projects[id])next[id]=projects[id]});
    projects=next;ready=true;projectsLoaded=true;offline=false;backfillJobNos();buildCustomers();if(handleDeep())return;if(!editing)render();
  },err=>{offline=true;ready=true;render()}));
}
(async()=>{
  try{FB=await window.fbReady}catch(e){offline=true;ready=true;app.innerHTML='<p class="muted">Couldn\'t load Job_Board. Check your connection and reload.</p>';return}
  FB.onAuth(u=>{
    if(!u){stopAll();user=null;db=null;projects={};signedOut=true;ready=true;go({name:'list'});return}
    if(user&&user.uid===u.uid)return;
    connect(u);
  });
})();
})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/apps/sw.js",{scope:"/apps/"}).catch(()=>{}));</script>
