<style>
/* Layout: single-column phone-first shop app — list, project, task and shopping views; dark by choice to match the Logbook */
:root{
  --bg:#151a17; --surface:#1e2420; --surface-2:#252c27; --line:#343d37;
  --ink:#e7ebe6; --muted:#9aa49c; --steel:#8fb5aa; --tan:#d9b98a;
  --accent:#e2753c; --on-accent:#1a0f08; --ok:#6cc48c; --warn:#e0a640; --danger:#ef7b6b;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:8px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.1;text-transform:uppercase;text-wrap:balance}
h1{font-size:28px}
h2{font-size:16px;letter-spacing:.06em;color:var(--steel)}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--steel)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cartbtn{position:relative;gap:7px}.cartbtn svg{width:20px;height:20px;flex:none}
.cbadge{background:var(--accent);color:var(--on-accent);font:600 .72rem var(--f-mono);border-radius:10px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
@media (max-width:440px){.cartbtn .cartlbl{display:none}.cartbtn{padding-left:12px;padding-right:12px}.cartbtn .cbadge{position:absolute;top:-8px;right:-8px;border:2px solid var(--bg)}}
.orderbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;cursor:pointer;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:8px;padding:11px 14px;color:var(--ink);font:inherit;min-height:44px}
.orderbar b{color:var(--accent)}.orderbar .go{color:var(--accent);white-space:nowrap;font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#151a17}
.btn.ghost{background:transparent;border-color:transparent;color:var(--steel);padding:0 6px}
.btn.dashed{border-style:dashed;background:transparent;color:var(--muted);font-weight:500;width:100%}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px}
header.app{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;border-bottom:3px solid var(--ink)}
input[type=text],input[type=search],input[type=url],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-width:0;min-height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
textarea{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.45}
label.f{display:flex;flex-direction:column;gap:4px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-family:var(--f-body);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{min-height:44px;padding:0 10px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{font-family:var(--f-mono);font-size:12px;opacity:.75;margin-left:4px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;color:var(--ink);width:100%}
.plate{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#151a17}
.plate.mine{background:var(--steel)}.plate.customer{background:var(--tan)}
.plate b{font-family:var(--f-display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;min-width:0;overflow-wrap:anywhere}

.bar i{display:block;height:100%;background:var(--accent)}
.bar.big{height:8px}
.delset:not(:has(input[name=delivery]:checked)) .delopt,.delset:not(:has(input[name=delivery]:checked)) .delfee,.delset:not(:has(input[name=delivFees]:checked)) .delfee{display:none!important}
.st-progress{color:var(--warn)}.st-waiting{color:var(--accent)}.st-done{color:var(--ok)}.st-notstarted{color:var(--muted)}.st-pickup{color:var(--ok)}
.list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.item{display:flex;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{flex:none;width:48px;min-height:56px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.box{width:24px;height:24px;border-radius:5px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:transparent}
.box.on{background:var(--ok);border-color:var(--ok);color:#151a17}
.box.ordered{background:var(--warn);border-color:var(--warn);color:#151a17}
.item .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:10px 12px 10px 0;border:0;background:transparent;text-align:left;color:var(--ink)}
.item .main .t{font-weight:500;overflow-wrap:anywhere}
.item .main .t.done{color:var(--muted);text-decoration:line-through}
.item .chev{flex:none;padding-right:12px;color:var(--muted)}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border:1px solid currentColor;white-space:nowrap}
.chip.order{color:var(--accent)}.chip.ordered{color:var(--warn)}.chip.stock{color:var(--ok)}.chip.late{color:var(--danger)}
.check.cap{flex-direction:column;gap:3px;min-height:64px;width:60px;padding-top:12px;justify-content:flex-start}
.check.cap small{font-family:var(--f-display);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
label.exp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;margin-top:2px}
label.exp>span:first-child{font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label.exp input{width:auto;min-height:40px;padding:0 10px}
.price{font-family:var(--f-mono);color:var(--tan)}
.switch{flex:none;width:52px;height:30px;border-radius:15px;border:2px solid var(--line);background:var(--bg);position:relative;cursor:pointer;padding:0}.switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}.switch.on{background:var(--ok);border-color:var(--ok)}.switch.on span{left:25px;background:#fff}.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.chip{background:transparent;min-height:32px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-family:var(--f-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#151a17}
.tag.mine{background:var(--steel)}.tag.customer{background:var(--tan)}
.tag.sup{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.tag.task{background:transparent;color:var(--steel);border:1px solid var(--steel);cursor:pointer;text-transform:none;letter-spacing:0;font-family:var(--f-body);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:#c9d1cb;font-size:14px}
.pill[aria-pressed=true]{background:var(--ink);color:#151a17;border-color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.seg button{min-height:40px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-family:var(--f-display);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.seg button[aria-pressed=true]{background:var(--ink);color:#151a17}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.stat.hot{border-left:4px solid var(--accent)}
.stat small{display:block;font-family:var(--f-display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel.sub{background:var(--surface-2)}
section{display:flex;flex-direction:column;gap:8px}
dl.kv{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;overflow-wrap:anywhere}
.link{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.link a{flex:1;min-width:0;display:flex;flex-direction:column;color:var(--ink);text-decoration:none}
.link a span{overflow-wrap:anywhere}
.ico{flex:none;width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--surface-2);color:var(--steel);border:1px solid var(--line);font-family:var(--f-mono)}
.ico.vid{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.empty{padding:28px 16px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.note{font-size:12px;color:var(--muted)}
.toast a{color:var(--accent);margin-left:6px;white-space:nowrap}
/* "Add to maintenance log": the prompt on the project and the preview sheet */
.lsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lshint{border-color:var(--ok)}.lshint b{font-size:16px}
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--steel);color:var(--bg);font:700 10px var(--f-body);letter-spacing:0;vertical-align:middle;margin-right:2px}
.av.own{background:var(--tan)}.av.big{width:36px;height:36px;font-size:13px}
.item .av{margin:0 4px}
.whochips{display:flex;gap:6px;flex-wrap:wrap}.whochips .chip{min-height:36px;padding:0 12px;cursor:pointer;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:13px}
.whochips .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.nopr{display:none!important}
.schedbar{display:flex;align-items:center;gap:6px}.schedbar b{font:700 16px var(--f-display);letter-spacing:.04em}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.week button{min-height:64px;padding:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font:600 11px var(--f-body);cursor:pointer}
.week button b{font:700 19px var(--f-display);color:var(--ink)}.week button i{font-style:normal;color:var(--accent);font-size:12px;line-height:1;min-height:12px;letter-spacing:1px}
.week button.today{border-color:var(--steel)}.week button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#1a0f08)}.week button[aria-pressed="true"] b,.week button[aria-pressed="true"] i{color:inherit}
.schedrow{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:0;border-bottom:1px solid var(--line);color:var(--ink);cursor:pointer;font:inherit}
.schedrow .time{flex:none;width:48px;color:var(--steel);font-size:13px}.schedrow.pick{box-shadow:inset 3px 0 0 var(--ok)}.schedrow.prom{box-shadow:inset 3px 0 0 var(--warn)}
.warnchip{color:var(--warn);border-color:var(--warn)}
.chkrow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.chkrow input{width:22px;height:22px;margin-top:2px;flex:none}.chkrow b{font-size:15px}
.lasttime{border-color:var(--steel);gap:4px}.lasttime .lt-h{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.linkrow{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--line)}.linkrow select{width:100%}
a.card{text-decoration:none;color:inherit}
body.sheet-open{overflow:hidden}
.sheetwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.sheetwrap{align-items:center}.sheet{border-radius:14px;border:1px solid var(--line)}}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.sheethead h2{font-size:22px;color:var(--ink);margin-top:2px}
.sheetx{width:44px;height:44px;flex:none;border:1px solid var(--line);color:var(--ink);font-size:18px}
.lsset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}

.lscheck{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);overflow-wrap:anywhere}
.lscheck input,.lschip input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.lscheck.sent{color:var(--muted);background:transparent;border-style:dashed}
.lschips{display:flex;flex-wrap:wrap;gap:6px}
.lschip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:14px;background:var(--surface-2)}
.lschip:has(input:checked){border-color:var(--accent)}
.lsmsg{margin:0;color:var(--danger)}.lsmsg:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#151a17;padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.saving{font-size:12px;color:var(--muted);min-height:16px}

/* ---- additions for the live version ---- */
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{cursor:pointer;position:relative}
a.btn{text-decoration:none}
.signin{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gbtn{gap:10px}.gbtn svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:2px}
#print{display:none}

  body.printing #app,body.printing .toast,body.printing .sheetwrap{display:none!important}

}
/* print view: plain black on white, letter-size friendly */
#print{color:#111;background:#fff;font-family:Helvetica,Arial,sans-serif;font-size:11pt;line-height:1.35}
#print .ph{display:flex;justify-content:space-between;gap:24px;border-bottom:2px solid #222;padding-bottom:10px;margin-bottom:16px}
#print .ph h1{font-family:Helvetica,Arial,sans-serif;font-size:18pt;text-transform:none;margin:0}
#print .ph .doc{text-align:right}#print .ph .doc b{font-size:20pt;display:block}
#print .sub{color:#555;font-size:10pt}
#print .two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:16px}
#print .lab{font-size:8pt;font-weight:700;color:#777;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
#print table{width:100%;border-collapse:collapse;margin:4px 0 10px}
#print th{font-size:8pt;color:#777;text-align:left;border-bottom:1px solid #999;padding:4px 6px 4px 0;text-transform:uppercase;letter-spacing:.05em}
#print td{padding:5px 6px 5px 0;border-bottom:1px solid #ddd;vertical-align:top}
#print .r{text-align:right}
#print .tot{margin-left:auto;width:260px}#print .tot td{border:0}#print .tot .big td{font-weight:700;font-size:13pt;border-top:1.5px solid #222}
#print ul{list-style:none;padding:0;margin:0}#print li{padding:2px 0 2px 20px;position:relative}
#print li::before{content:"";position:absolute;left:0;top:5px;width:10px;height:10px;border:1px solid #333}
#print li.done::after{content:"✓";position:absolute;left:1px;top:-1px;font-size:11pt}
#print .foot{text-align:center;color:#555;margin-top:28px}
@page{size:letter;margin:0.6in}
/* receipt (thermal printer): one narrow black-on-white column. Width and font size set from Shop info (RCPT: 58, 76, 80 or 112 mm paper).
   Own rc- class names so the app's .row / .wrap styles don't leak in. */

<script>
(function(){
'use strict';
const STATUSES=['Not started','In progress','Waiting on parts','Ready for pickup','Done'];
const ST_CLASS={'Not started':'st-notstarted','In progress':'st-progress','Waiting on parts':'st-waiting','Ready for pickup':'st-pickup','Done':'st-done'};
const PART_ST=['To order','Ordered','In stock'];
const PART_CLASS={'To order':'order','Ordered':'ordered','In stock':'stock'};
const app=document.getElementById('app');
let db=null, projects={}, ready=false, offline=false;
let FB=null, user=null, signedOut=false, authErr='', unsubs=[];
let machines=[], machinesLoaded=false; /* Logbook engines and vehicles: [{id,name,owner,equipment,kind}]; owner {id,name} = a customer's machine */
let shop={name:'',phone:'',email:'',address:'',footer:'',rate:''};
let counterLast=0, counterLoaded=false, projectsLoaded=false, backfilled=false;
const JOB_PREFIX='J-';
const fmtJob=n=>JOB_PREFIX+String(n).padStart(3,'0');
const jobLabel=p=>p&&p.kind==='customer'&&p.jobNo?fmtJob(p.jobNo):'';
/* A customer job's name is optional: with none typed, it goes by its job number and the customer's name
   (J-005 · Cory Lindell) */
const custNameOf=p=>p&&p.kind==='customer'?String((p.customer&&p.customer.name)||'').trim():'';
const projName=p=>(p&&String(p.title||'').trim())||[jobLabel(p),custNameOf(p)].filter(Boolean).join(' · ')||'Untitled project';
const labelName=p=>[jobLabel(p),String((p&&p.title)||'').trim()||custNameOf(p)].filter(Boolean).join(' · ')||'Untitled';
function nextJobNo(){
  const maxE=Math.max(0,counterLast,...Object.values(projects).map(p=>Number(p.jobNo)||0));
  const n=maxE+1;counterLast=n;
  if(db)db.doc('settings/counter').set({lastJobNo:n}).catch(()=>{});
  return n;
}
function backfillJobNos(){
  if(backfilled||!counterLoaded||!projectsLoaded)return;backfilled=true;
  Object.entries(projects).filter(([,p])=>p.kind==='customer'&&!p.jobNo).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0))
    .forEach(([id,p])=>{p.jobNo=nextJobNo();save(id)});
}
let view={name:'list',tab:'all',q:'',pid:null,tid:null,shopJob:'all',shopStatus:'order',shopSup:'all',editing:null,confirm:null};
const timers={};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^a-zA-Z0-9-]/g,'').slice(0,36);
const safeUrl=u=>{try{const x=new URL(u);return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return ''}};
const isVideo=u=>/youtube\.com|youtu\.be|vimeo\.com/i.test(u||'');
const today=(at)=>{const d=at||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtDate=s=>{const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const hasPrice=x=>x&&x.price!==undefined&&x.price!==null&&x.price!==''&&isFinite(+x.price);
/* units: '' = each (whole count), 'qt' quarts, 'gal' gallons (decimals allowed) */
const UNITS=[['','Each'],['qt','Quarts'],['gal','Gallons']];
const isFluid=x=>x&&(x.unit==='qt'||x.unit==='gal');
const numStr=n=>{const v=Number(n)||1;return String(Math.round(v*100)/100)};
const qtyText=x=>isFluid(x)?`${numStr(x.qty)} ${x.unit}`:`qty ${numStr(x.qty)}`;
const qtyShort=x=>isFluid(x)?`${numStr(x.qty)} ${x.unit}`:`× ${numStr(x.qty)}`;
const perText=x=>isFluid(x)?`per ${x.unit}`:'each';
const idText=x=>[x.brand,x.num].filter(Boolean).join(' · ');
function parseQty(v,unit){const n=parseFloat(v);if(unit==='qt'||unit==='gal')return isFinite(n)&&n>0?Math.min(9999,Math.round(n*100)/100):1;return Math.max(1,Math.min(999,Math.round(isFinite(n)?n:1)))}
/* ---------- Working in someone else's shop (Garage Terminal shop app, employees) ----------
   The shop app saves {member, owner, role, perms} in localStorage gt-shop-of; inside the shop app (?shop=1)
   this page then opens the owner's data (logbook-backend.js) and hides what the member's role may not see:
   perms.prices (prices, totals, labor, invoices), perms.phones (customer phone, email, address),
   perms.inventory (Add to inventory), perms.settings (shop info), perms.deleteJobs (Delete project).
   firestore.rules enforce the changes; prices and phones inside a job can only be hidden on screen. */
const SHOP_OF=(()=>{try{if(new URLSearchParams(location.search).get('shop')!=='1')return null;const v=JSON.parse(localStorage.getItem('gt-shop-of')||'null');return v&&v.owner&&v.member?v:null}catch(e){return null}})();
const can=k=>!SHOP_OF||!SHOP_OF.perms||SHOP_OF.perms[k]===true;
const hideMine=!!(SHOP_OF&&SHOP_OF.hideMine); // the owner hides My equipment from employees: customer jobs only
const pricesOk=can('prices'),phonesOk=can('phones'),invOk=can('inventory'),settingsOk=can('settings'),deleteOk=!SHOP_OF||(SHOP_OF.perms&&'deleteJobs' in SHOP_OF.perms?SHOP_OF.perms.deleteJobs===true:SHOP_OF.role==='manager');
/* Employees (Garage Terminal shop app): the shop doc (shops/{owner}, read through db.doc('shop/info'))
   lists the team, people = [{id, name, role}] (id 'owner' = the owner, else the person's memberId), and
   the owner's options. With Employees on: options.assign -> Assigned to on jobs (p.assignee = a person id),
   options.doneBy -> ticking a task records who did it (t.doneBy, t.doneAt). Off: nothing shows. */
let shopTeam={on:false,people:[],options:{}};
const myPid=SHOP_OF?String(SHOP_OF.memberId||''):'owner';
const assignOn=()=>shopTeam.on&&shopTeam.options.assign!==false&&shopTeam.people.length>1;
const doneByOn=()=>shopTeam.on&&shopTeam.options.doneBy!==false&&shopTeam.people.length>1;
const personOf=id=>id?shopTeam.people.find(x=>x.id===id):null;
const initialsOf=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const avatar=(id,big)=>{const pp=personOf(id);if(!pp)return'';return `<span class="av${big?' big':''}${id==='owner'?' own':''}" title="${esc(pp.name)}" aria-label="${esc(pp.name)}">${esc(initialsOf(pp.name))}</span>`};
const money=n=>pricesOk?(Number(n)||0).toLocaleString('en-US',{style:'currency',currency:'USD'}):'';
/* ---------- time clock (customer jobs) ---------- */
const timeLog=p=>(p&&p.time&&Array.isArray(p.time.log))?p.time.log:[];
const entryStart=e=>e.manual?new Date((e.date||today())+'T12:00:00').getTime():e.start;
const tMs=e=>e.manual?(Number(e.minutes)||0)*60000:Math.max(0,(e.end||Date.now())-e.start);
/* Employees step 4 (shop app, Employees on): options.ownTime -> each entry says who (e.by = person id,
   missing = the owner) and each person's clock runs on its own; options.approveTime -> entries by people who
   can't approve start as e.ok === false ("Needs OK") until the owner or someone with perms.approveTime
   approves (e.ok = true, okBy, okAt) or rejects (e.rejected). Only approved time counts toward
   "Use clocked time" on the labor. Entries made before approval was on, or by approvers, just count. */
const ownTimeOn=()=>shopTeam.on&&shopTeam.options.ownTime!==false&&shopTeam.people.length>1;
const approveOn=()=>shopTeam.on&&shopTeam.options.approveTime!==false&&shopTeam.people.length>1;
const canApprove=()=>!SHOP_OF||(SHOP_OF.perms&&SHOP_OF.perms.approveTime===true);
const byOf=e=>e.by||'owner';
const mineT=e=>!ownTimeOn()||byOf(e)===myPid;
const needsOk=e=>approveOn()&&e.ok===false&&!e.rejected;
const countsT=e=>!e.rejected&&!(approveOn()&&e.ok===false);
const okMs=p=>timeLog(p).filter(e=>(e.manual||e.end)&&countsT(e)).reduce((n,e)=>n+tMs(e),0);
const waitMs=p=>timeLog(p).filter(e=>(e.manual||e.end)&&needsOk(e)).reduce((n,e)=>n+tMs(e),0);
const newEntry=o=>({id:uid(),...o,...(ownTimeOn()?{by:myPid}:{}),...(approveOn()&&!canApprove()?{ok:false}:{})});
const running=p=>timeLog(p).find(e=>!e.manual&&!e.end&&mineT(e));
/* Clocks (shop app Settings → Clocks, saved in the shop doc's options): jobClocks false hides job clocks
   (labor hours are typed by hand). Shop clock with "Job clocks need clock-in first": inside the shop app
   the shop app writes localStorage gt-on-clock {uid, owner, need, on}; while need && !on, Clock in on a
   job sends people to clock in for the day first. */
/* Spark plug part numbers link to the Spark Plug Finder (Garage Terminal only) */
const plugLink=(num,name)=>location.pathname.startsWith('/apps/')&&/spark\s*plugs?/i.test(String(name||''))&&String(num||'').replace(/[^A-Za-z0-9]/g,'').length>=2?` · <a href="/apps/spark-plugs?q=${encodeURIComponent(String(num).trim())}${SHOP?'&shop=1':''}" style="white-space:nowrap;font-family:var(--sans,inherit)">Cross-reference ↗</a>`:'';
const jobClocksOn=()=>shopTeam.options.jobClocks!==false;
const clockLocked=()=>{if(!SHOP)return false;try{const v=JSON.parse(localStorage.getItem('gt-on-clock')||'null');return!!(v&&v.need&&!v.on)}catch(e){return false}};
window.addEventListener('storage',ev=>{if(ev.key==='gt-on-clock'&&typeof render==='function')render()});
const doneMs=p=>timeLog(p).filter(e=>e.manual||e.end).reduce((n,e)=>n+tMs(e),0);
const totalMs=p=>timeLog(p).reduce((n,e)=>n+tMs(e),0);
const fmtDur=ms=>{const m=Math.floor(ms/60000);return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`};
const fmtClock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const hrsQ=ms=>Math.round(ms/3600000*4)/4;
const clockT=ms=>new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const dayOf=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hhmm=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const atLocal=(date,hm)=>new Date(date+'T'+(hm||'00:00')+':00').getTime();
/* Customer jobs can be switched off in Settings (saved on this device only; on by default). Off hides customer jobs
   and everything that goes with them (job numbers, time clock, labor, invoices, Shop info); nothing is deleted. */
/* Shop mode: inside the Garage Terminal shop app (garageterminal.com/shop) as ?shop=1. The app's tab bar replaces
   the Logbook link and the page title; everything else works the same. */
const SHOP=(()=>{try{return new URLSearchParams(location.search).get("shop")==="1"}catch(e){return false}})();
if(SHOP)document.documentElement.classList.add('shop');
// employees always work in shop mode (it's the owner's shop)
let custOn=SHOP_OF?true:(()=>{try{return localStorage.getItem('jb-customers')!=='off'}catch(e){return true}})();
function setCustOn(on){if(SHOP_OF)return;custOn=!!on;try{localStorage.setItem('jb-customers',custOn?'on':'off')}catch(e){}}
const visible=([,p])=>custOn||p.kind!=='customer';
const runningJob=()=>custOn?Object.entries(projects).find(([,p])=>p.kind==='customer'&&running(p)):null;
setInterval(()=>{document.querySelectorAll('[data-tick]').forEach(el=>{const v=Date.now()-(+el.dataset.tick)+(+el.dataset.base||0);el.textContent=el.dataset.fmt==='dur'?fmtDur(v):fmtClock(v)})},1000);
function renderClock(id,p){
  const r=running(p),log=timeLog(p).slice().sort((a,b)=>entryStart(b)-entryStart(a)),base=doneMs(p);
  let h=`<section><div class="between"><h2>Time on this job</h2><span class="mono" style="font-size:18px">${r?`<span data-tick="${r.start}" data-base="${base}" data-fmt="dur">${fmtDur(totalMs(p))}</span>`:fmtDur(base)}</span></div>`;
  h+=r?`<div class="panel" style="gap:10px;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))">
      <div class="between" style="align-items:center"><div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow" style="color:var(--ok)">● On the clock</span><span class="mono" style="font-size:34px;line-height:1.1" data-tick="${r.start}">${fmtClock(Date.now()-r.start)}</span><span class="small muted">since ${esc(clockT(r.start))}${dayOf(r.start)!==today()?' on '+esc(fmtDate(dayOf(r.start))):''}</span></div></div>
      <button class="btn primary" data-act="clockout" data-pid="${id}" style="min-height:52px;font-size:17px">■ Clock out</button></div>`
    :clockLocked()?`<button class="btn" data-act="clockfirst" style="min-height:56px;font-size:16px">Clock in for the day first (Home)</button><span class="small muted">The shop clock is on: job clocks unlock once you clock in for the day.</span>`
    :`<button class="btn" data-act="clockin" data-pid="${id}" style="min-height:56px;font-size:17px;background:var(--ok);border-color:var(--ok);color:#151a17;font-weight:700">▶ Clock in</button>`;
  if(log.length){h+=`<div class="list">${log.map(e=>view.editTime===e.id?editTimeForm(e):`<div class="item" style="padding:10px 12px;gap:10px;align-items:center">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-weight:500">${esc(fmtDate(e.manual?e.date:dayOf(e.start)))}</span>
      <span class="small muted">${ownTimeOn()&&personOf(byOf(e))?esc(personOf(byOf(e)).name)+' · ':''}${e.manual?'Added by hand':`${esc(clockT(e.start))} – ${e.end?esc(clockT(e.end)):'now'}`}${e.note?' · '+esc(e.note):''}</span>
      ${needsOk(e)?`<span class="row" style="gap:6px;flex-wrap:wrap"><span class="chip warnchip">Needs OK</span>${canApprove()?`<button class="btn sm" data-act="okt" data-tid="${e.id}">Approve</button><button class="btn ghost sm" data-act="rejt" data-tid="${e.id}" style="color:var(--danger)">Reject</button>`:''}</span>`:e.rejected?`<span class="row" style="gap:6px"><span class="chip" style="color:var(--danger);border-color:var(--danger)">Rejected</span>${canApprove()?`<button class="btn ghost sm" data-act="okt" data-tid="${e.id}">Approve after all</button>`:''}</span>`:approveOn()&&e.okBy&&personOf(e.okBy)?`<span class="small" style="color:var(--ok)">OK'd by ${esc(personOf(e.okBy).name)}</span>`:''}</div>
      <span class="mono" style="${e.rejected?'text-decoration:line-through;opacity:.6':''}">${!e.manual&&!e.end?`<span data-tick="${e.start}" data-fmt="dur">${fmtDur(tMs(e))}</span>`:fmtDur(tMs(e))}</span>
      ${mineT(e)||canApprove()?`<button class="btn ghost sm" data-act="edittime" data-tid="${e.id}" aria-label="Edit this time">Edit</button>`:''}</div>`).join('')}</div>`}
  if(ownTimeOn()&&log.length){const by={};log.filter(e=>!e.rejected).forEach(e=>{by[byOf(e)]=(by[byOf(e)]||0)+tMs(e)});const keys=Object.keys(by);if(keys.length>1||!keys.includes(myPid))h+=`<span class="small muted">${keys.map(k=>esc((personOf(k)||{name:'Someone'}).name)+' '+fmtDur(by[k])).join(' · ')}</span>`}
  if(approveOn()&&waitMs(p)){const n=log.filter(needsOk).length;h+=`<div class="panel" style="gap:8px;border-color:var(--warn)"><b>${fmtDur(waitMs(p))} waiting for a manager's OK</b><span class="small muted">It doesn't count toward Use clocked time on the invoice until it's approved.</span>${canApprove()&&n>1?`<button class="btn" data-act="okall">Approve all ${n}</button>`:''}</div>`}
  h+=view.editing==='addtime'?`<form class="panel sub" data-form="addtime">
      <label class="f">Date<input id="at-date" type="date" name="date" value="${today()}" required></label>
      <div class="grid2"><label class="f">Hours<input type="number" name="h" min="0" max="99" step="1" inputmode="numeric" placeholder="0"></label><label class="f">Minutes<input type="number" name="m" min="0" max="59" step="1" inputmode="numeric" placeholder="0"></label></div>
      <label class="f">Note (optional)<input type="text" name="note" maxlength="120" placeholder="e.g. Forgot to clock in"></label>
      <div class="grid2"><button class="btn primary" type="submit">Add time</button><button class="btn" type="button" data-act="addtime">Cancel</button></div></form>`
    :`<button class="btn ghost" data-act="addtime" style="border:1px dashed var(--line)">+ Add time by hand</button>`;
  return h+`<span class="note">${approveOn()&&!canApprove()?'Tap Edit to fix your times; a change needs a manager\'s OK again.':'Tap Edit on any entry to fix the times. The total feeds the Labor box below.'}</span></section>`;
}
function editTimeForm(e){
  return `<form class="panel sub" data-form="edittime" data-tid="${e.id}" style="border-radius:0;border:0;border-bottom:1px solid var(--line)">
    <label class="f">Date<input type="date" name="date" required value="${esc(e.manual?e.date:dayOf(e.start))}"></label>
    ${e.manual?`<div class="grid2"><label class="f">Hours<input type="number" name="h" min="0" max="99" step="1" value="${Math.floor((e.minutes||0)/60)}"></label><label class="f">Minutes<input type="number" name="m" min="0" max="59" step="1" value="${(e.minutes||0)%60}"></label></div>`
      :`<div class="grid2"><label class="f">Clocked in<input type="time" name="start" required value="${hhmm(e.start)}"></label>${e.end?`<label class="f">Clocked out<input type="time" name="end" required value="${hhmm(e.end)}"></label>`:'<span class="small muted" style="align-self:end">Still on the clock</span>'}</div>`}
    <label class="f">Note (optional)<input type="text" name="note" maxlength="120" value="${esc(e.note||'')}"></label>
    <div class="grid2"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-act="edittime" data-tid="">Cancel</button></div>
    ${view.confirm==='deltime'?`<div class="confirm"><span>Delete this time entry?</span><button type="button" class="btn danger sm" data-act="deltime-yes" data-tid="${e.id}">Delete</button><button type="button" class="btn sm" data-act="cancel">Keep</button></div>`:`<button type="button" class="btn danger sm" data-act="deltime">Delete entry</button>`}
  </form>`;
}
function clockIn(pid){
  const rj=runningJob();let msg='Clocked in';
  if(rj&&rj[0]!==pid){running(rj[1]).end=Date.now();save(rj[0]);msg=`Clocked out of ${jobLabel(rj[1])||rj[1].title} and into ${jobLabel(projects[pid])||projects[pid].title}`}
  const p=projects[pid];if(running(p))return;p.time={log:[...timeLog(p),newEntry({start:Date.now()})]};save(pid);toast(msg);render();
}
function clockOut(pid){const p=projects[pid];const r=p&&running(p);if(!r)return;r.end=Date.now();p.time={log:[...timeLog(p)]};save(pid);toast('Clocked out: '+fmtDur(tMs(r)));render()}


/* ---------- Logbook inventory (live: users/{uid}/records where kind == "part") ---------- */
let inv=null; /* {parts:[{id,name,brand,number,qty,location}]} */
/* Part-number matching: copied exactly from the Logbook (index.html) */
const normPN=v=>String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");;
function pnMatch(a,b){const x=normPN(a),y=normPN(b);if(!x||!y)return false;if(x===y)return true;
  const [sh,lo]=x.length<=y.length?[x,y]:[y,x];return sh.length>=5&&/\d/.test(sh)&&lo.includes(sh)}
const partHits=(p,num)=>pnMatch(p.number,num)||(p.brand&&pnMatch((p.brand||"")+(p.number||""),num))||(p.alts||[]).some(a=>{const x=String(a||'').trim(),r=x.replace(/^\S+\s+/,'');return pnMatch(x,num)||(r!==x&&pnMatch(r,num))});; /* alts: the Logbook's "Also sold as" cross-reference */
function invLookup(x){if(!inv||!x||!x.num)return null;const hits=inv.parts.filter(ip=>partHits(ip,x.num)||(x.brand&&partHits(ip,x.brand+x.num)));
  if(!hits.length)return{found:false,hits:[]};const qty=hits.reduce((n,h)=>n+(parseFloat(h.qty)||0),0);const locs=[...new Set(hits.map(h=>(h.location||'').trim()).filter(Boolean))];const us=[...new Set(hits.map(h=>h.unit||''))];return{found:true,qty:Math.round(qty*100)/100,unit:us.length===1?us[0]:'',locs,hits}}
/* inventory check: always on your own projects; on customer jobs too in the shop app (?shop=1) with Customer jobs on */

  'Fuel stabilizer':{any:[['stabilizer'],['stabil']]},'Blade sharpened':{any:[['blade']]},'Carb cleaned':{any:[['carb'],['carburetor']]},
  'Belt':{any:[['belt']]},'Grease / lube':{any:[['grease'],['lube'],['lubricate']]},'Winterized':{any:[['winterize'],['winterized']]},

function sendToLogbook(){const p=projects[lsheet.pid],r=machineRecs[lsheet.mid],msg=document.getElementById('ls-msg');

  /* tasks: the ticked "Counts as" names, plus the title of any ticked work item that matched none */
  const tasks=[...names.filter(n=>lsheet.counts.has(n)),...picked.filter(t=>!matchNames(t.title,names).length).map(t=>t.title.trim()).filter(Boolean)];
  const uniq=[...new Set(tasks)];const notes=(document.getElementById('ls-notes').value||'').trim();
  if(!uniq.length&&!notes){msg.textContent='Tick some work or a "Counts as" name, or add a note.';return}
  const date=document.getElementById('ls-date').value||today();
  const hours=document.getElementById('ls-hours').value.trim();
  if(hours&&!isFinite(parseFloat(hours.replace(/,/g,'')))){msg.textContent=`${meterLabel(r)} should be a number.`;return}
  const entry={id:uid_lb(),date,hours,cost:document.getElementById('ls-cost').value.replace(/^\$/,'').trim(),tasks:uniq,notes,source:{app:'tracker',projectId:lsheet.pid}};
  /* same as the Logbook's form: a higher (or first) reading raises the machine's meter; logging a service wakes its snooze */
  const num=v=>parseFloat(String(v||'').replace(/,/g,''));
  const out={log:[...(Array.isArray(r.log)?r.log:[]),entry],updatedAt:new Date().toISOString()};
  if(entry.hours&&(!r.hours||num(entry.hours)>=num(r.hours))){out.hours=entry.hours;out.hoursAt=entry.date}
  if(Array.isArray(r.schedule))out.schedule=r.schedule.map(x=>{if(!uniq.includes(x.task)||!x.snooze)return x;const {snooze,...y}=x;return y});
  const mid=lsheet.mid,mname=dname(r);

}
/** A toast with a link, shown a little longer so it can be tapped. */
function toastLink(msg,href,label){const t=document.getElementById('toast');t.innerHTML=`<span>${esc(msg)}</span> <a href="${esc(href)}">${esc(label)}</a>`;t.hidden=false;clearTimeout(timers.toast);timers.toast=setTimeout(()=>{t.hidden=true},8000)}
/* "Add to inventory" (My equipment, parts marked Received) */
/* ---------- Parts used come off the shelf ----------
   An In stock part that matches the Logbook inventory can be taken off the shelf: its amount comes off
   the inventory part's On hand (never below 0) and the part remembers it, x.taken = {partId, n, unit, date},
   so it's never taken twice and Put back can return it. When a job is marked Done, a panel offers to

const qStr=v=>String(Math.round((Number(v)||0)*100)/100); // like numStr, but 0 stays 0
const isTakeable=(p,x)=>invFor(p)&&!!inv&&x.status==='In stock'&&!x.taken&&(()=>{const h=takeHit(x);return!!h&&(parseFloat(h.qty)||0)>0})();
const toTake=p=>invFor(p)&&inv?allParts(p).filter(x=>isTakeable(p,x)):[];
function takeHit(x){const r=invLookup(x);if(!r||!r.found)return null;return [...r.hits].sort((a,b)=>(parseFloat(b.qty)||0)-(parseFloat(a.qty)||0))[0]}
function takeAmount(x,hit){let n=Number(x.qty)||1;const xu=x.unit||'',hu=hit.unit||'';if(xu==='qt'&&hu==='gal')n=n/4;else if(xu==='gal'&&hu==='qt')n=n*4;return Math.round(n*100)/100}
function takeOff(pid,list){if(!db)return;const now=new Date().toISOString();let done=0;
  list.forEach(({tid,xid})=>{const {x}=findPart(pid,tid,xid);if(!x||x.taken)return;const hit=takeHit(x);if(!hit)return;
    const cur=Math.max(0,parseFloat(hit.qty)||0),n=takeAmount(x,hit),next=Math.max(0,Math.round((cur-n)*100)/100);

    db.records.merge(hit.id,{qty:String(next),updatedAt:now}).catch(()=>toast('Could not update your inventory'));
    x.taken={partId:hit.id,n,unit:hit.unit||'',date:today()};done++});
  if(done){save(pid);toast(`Took ${done} part${done===1?'':'s'} off your shelf`)}render()}

  if(hit){const cur=Math.max(0,parseFloat(hit.qty)||0),next=Math.round((cur+(Number(t.n)||0))*100)/100;hit.qty=String(next);
    db.records.merge(hit.id,{qty:String(next),updatedAt:new Date().toISOString()}).catch(()=>toast('Could not update your inventory'))}
  delete x.taken;save(pid);toast(hit?'Put back on your shelf':"That inventory part is gone, so nothing was added back");render()}

  return `<span class="row" style="gap:8px;flex-wrap:wrap">${x.invAddedOn?`<span class="small" style="color:var(--ok)">Added to inventory ${esc(fmtDate(x.invAddedOn))}</span>`:''}<button class="btn sm" data-act="invadd" data-key="${key}">${x.invAddedOn?'Add again':'Add to inventory'}</button></span>`}
function addToInventory(pid,tid,xid,n){
  const {p,x}=findPart(pid,tid,xid);if(!p||!x||!db)return;const now=new Date().toISOString();const r=invLookup(x);let msg;
  if(r&&r.found){const hit=r.hits[0];const cur=Math.max(0,Math.round((parseFloat(hit.qty)||0)*100)/100);
    db.records.merge(hit.id,{qty:String(cur+n),updatedAt:now}).catch(()=>toast('Could not update your inventory'));
    msg=`Inventory: ${hit.name||hit.number} now ${cur+n}`}
  else{/* same record shape as the Logbook's Add part form (openPart in index.html) */
    db.records.set(uid_lb(),{kind:"part",name:x.name||'',brand:x.brand||'',number:x.num||'',category:"",qty:String(n),reorderAt:"",location:"",cost:"",source:"",fits:[],notes:"",createdAt:now,updatedAt:now}).catch(()=>toast('Could not add to your inventory'));
    msg=`Added ${x.name||x.num} to your inventory`}
  x.invAddedOn=today();save(pid);view.confirm=null;toast(msg);render()}

function laborCost(p){const l=p.labor||{};const h=+l.hours,r=+l.rate;const ok=isFinite(h)&&isFinite(r)&&h>0&&r>0;return{hours:ok?h:(isFinite(h)&&h>0?h:0),rate:isFinite(r)&&r>0?r:0,total:ok?Math.round(h*r*100)/100:0,has:ok,desc:(l.desc||'').trim()}}
function partsCost(p){let total=0,missing=0,count=0;allParts(p).forEach(x=>{if(hasPrice(x)){total+=x.price*(x.qty||1);count++}else missing++});return{total:Math.round(total*100)/100,missing,count}}
function setPartStatus(x,s){x.status=s;if(s==='Ordered'){if(!x.orderedOn)x.orderedOn=today();delete x.receivedOn}else if(s==='In stock'){if(!x.receivedOn)x.receivedOn=today()}else{delete x.orderedOn;delete x.receivedOn;delete x.expected}}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(timers.toast);timers.toast=setTimeout(()=>{t.hidden=true},2200)}

/* ---------- Customers (customer jobs only) ----------
   One list on the account: settings/customers = {list:[{id,name,phone,email,address,notes,createdAt}], built}.
   A job links to its customer with customer.id and keeps its own copy of the name and phone, so invoices
   and work reports print what was true for that job. The first time, the list is built from existing jobs. */
let customers=[],customersLoaded=false,customersBuilt=false;
const normName=v=>String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
const digitsOf=v=>String(v||'').replace(/\D/g,'');
const custById=id=>id?customers.find(c=>c.id===id):null;
const custOfJob=p=>p&&p.kind==='customer'&&p.customer?custById(p.customer.id):null;
const jobsOf=cu=>Object.entries(projects).filter(([,p])=>p.kind==='customer'&&p.customer&&p.customer.id===cu.id).sort((a,b)=>(b[1].createdAt||0)>(a[1].createdAt||0)?1:-1);
function findCustomer(name,phone){const n=normName(name),d=digitsOf(phone);if(!n&&!d)return null;
  return (d&&customers.find(c=>digitsOf(c.phone)===d))||(n&&customers.find(c=>normName(c.name)===n&&(!d||!digitsOf(c.phone))))||null}
function newCustomer(name,phone){const c={id:uid(),name:String(name||'').trim(),phone:String(phone||'').trim(),email:'',address:'',notes:'',createdAt:today()};customers.push(c);return c}
function saveCustomers(){if(db)db.doc('settings/customers').set({list:JSON.parse(JSON.stringify(customers)),built:true}).catch(()=>toast('Could not save the customer list'))}
/* Make sure a customer job points at a customer (finding or adding one by name / phone). Returns true if anything changed. */
function linkJob(p){if(!p||p.kind!=='customer')return false;const c=p.customer||(p.customer={name:'',phone:'',dropOff:'',promised:'',complaint:''});
  const have=custById(c.id);if(have){let ch=false;if(!have.phone&&c.phone){have.phone=c.phone;ch=true}return ch}
  if(!String(c.name||'').trim()&&!digitsOf(c.phone))return false;
  const cu=findCustomer(c.name,c.phone)||newCustomer(c.name,c.phone);if(!cu.phone&&c.phone)cu.phone=c.phone;c.id=cu.id;return true}
function buildCustomers(){if(customersBuilt||!customersLoaded||!projectsLoaded||!db)return;customersBuilt=true;
  Object.entries(projects).forEach(([id,p])=>{if(p.kind==='customer'&&!custById(p.customer&&p.customer.id)&&linkJob(p))save(id)});saveCustomers()}
const jobTotal=p=>partsCost(p).total+laborCost(p).total+deliveryFee(p).total;

/* ---------- Schedule (customer jobs) ----------
   On each job's customer: dropOff (day) + dropTime ("HH:MM"), pickup (day) + pickupTime, promised (day).
   Customers → Schedule shows a week strip (a dot per booking) and the picked day's drop-offs, pickups and
   promised jobs. + Book opens the new customer job form with the day filled in. shop.dayLimit (optional)
   warns when a day is full; it never blocks. ?sched=YYYY-MM-DD opens the Schedule on that day. */
const ymdOf=(y,m,d)=>today(new Date(y,m-1,d));
const addDay=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return ymdOf(y,m,d+n)};
const weekOf=k=>{const [y,m,d]=k.split('-').map(Number);const off=new Date(y,m-1,d).getDay();/* weeks start on Sunday */return ymdOf(y,m,d-off)};
const dayDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const fmtTime=t=>{if(!t||!/^\d{1,2}:\d{2}/.test(t))return'';const [h,mi]=t.split(':').map(Number);return `${(h%12)||12}:${String(mi).padStart(2,'0')}${h<12?'a':'p'}`};
const custJobList=()=>Object.entries(projects).filter(([,p])=>p.kind==='customer');
const dropsOn=k=>custJobList().filter(([,p])=>(p.customer||{}).dropOff===k).length;
/* promised and not finished: 'over' (past the date), 'risk' (parts not in by then), or '' */
/* How a customer job comes in and goes back. customer.inBy: 'drop' (they bring it, the default) or 'collect'
   (we pick it up from them); customer.ret: 'pickup' (they pick it up, the default) or 'deliver' (we take it back).
   The day and time fields are the same either way (dropOff/dropTime, pickup/pickupTime). */
/* Settings → Pickup and delivery (shop.delivery, off by default) shows these choices; Delivery fees
   (shop.delivFees) charges per mile: shop.delRate $/mile, delMin minimum per trip, delFree free within
   (miles), delRound true = charge there and back. The job keeps customer.miles (one way) and, if typed,
   customer.delFee (a charge set by hand). */
const deliveryOn=()=>custOn&&shop.delivery===true;
const feesOn=()=>deliveryOn()&&shop.delivFees===true;
const collects=p=>deliveryOn()&&((p&&p.customer)||{}).inBy==='collect';
const delivers=p=>deliveryOn()&&((p&&p.customer)||{}).ret==='deliver';
const tripsOf=p=>(collects(p)?1:0)+(delivers(p)?1:0);
function deliveryFee(p){const c=(p&&p.customer)||{},trips=tripsOf(p);
  if(!feesOn()||!trips)return{has:false,total:0,trips:0};
  const what=trips===2?'Pickup and delivery':delivers(p)?'Delivery':'Pickup';
  const mi=+c.miles>0?+c.miles:0,rt=shop.delRound!==false;
  if(c.delFee!==undefined&&c.delFee!==''&&isFinite(+c.delFee))return{has:+c.delFee>0,total:Math.round(+c.delFee*100)/100,trips,miles:mi,manual:true,desc:what+(mi?` · ${numStr(mi)} mi`:'')};
  if(!mi)return{has:false,total:0,trips,miles:0,desc:what};
  const free=+shop.delFree>0?+shop.delFree:0,rate=+shop.delRate>0?+shop.delRate:0,min=+shop.delMin>0?+shop.delMin:0;
  const billable=Math.max(0,mi-free);let per=billable*(rt?2:1)*rate,minHit=false;if(billable>0&&per<min){per=min;minHit=true}
  const total=Math.round(per*trips*100)/100;
  return{has:total>0,total,trips,miles:mi,rate,rt,free,billable,minHit,desc:`${what} · ${numStr(mi)} mi${rt?' each way':''}`}}
const mapsHref=p=>{const c=custOfJob(p);const to=(c&&c.address)||'';return 'https://www.google.com/maps/dir/?api=1'+(shop.address?'&origin='+encodeURIComponent(shop.address):'')+(to?'&destination='+encodeURIComponent(to):'')+'&travelmode=driving'};
const statusLabel=p=>p.status==='Ready for pickup'&&delivers(p)?'Ready for delivery':p.status;
const custAddr=p=>{const c=typeof custOfJob==='function'&&custOfJob(p);return phonesOk&&c&&c.address?c.address:''};
/* Day labels that follow the choices (updated live by the change handler: data-daylbl) */
const inDayLbl=v=>deliveryOn()&&v==='collect'?'Day we pick it up':'Drop-off day';
const backDayLbl=v=>deliveryOn()&&v==='deliver'?'Delivery day':'Pickup day';
const inSelect=v=>!deliveryOn()?'':`<label class="f">How it comes in<select name="inBy" data-daysel="in"><option value="drop" ${v!=='collect'?'selected':''}>Customer drops it off</option><option value="collect" ${v==='collect'?'selected':''}>We pick it up</option></select></label>`;
const retSelect=v=>!deliveryOn()?'':`<label class="f">How it goes back<select name="ret" data-daysel="back"><option value="pickup" ${v!=='deliver'?'selected':''}>Customer picks it up</option><option value="deliver" ${v==='deliver'?'selected':''}>We deliver it</option></select></label>`;
function promiseState(p){const c=p.customer||{};if(!c.promised||p.status==='Done'||p.status==='Ready for pickup')return'';if(c.promised<today())return'over';
  return allParts(p).some(x=>x.status==='To order'||(x.status==='Ordered'&&(!x.expected||x.expected>=c.promised)))?'risk':''}
function dayItems(k){const out=[];custJobList().forEach(([id,p])=>{const c=p.customer||{};
    if(c.dropOff===k)out.push({t:'drop',id,p,time:c.dropTime||''});
    if(c.pickup===k&&p.status!=='Done')out.push({t:'pick',id,p,time:c.pickupTime||''});
    if(c.promised===k&&p.status!=='Done'&&p.status!=='Ready for pickup')out.push({t:'prom',id,p,time:''})});
  const key=x=>(x.time||'99:99')+(x.t==='prom'?'1':'0');return out.sort((a,b)=>key(a).localeCompare(key(b)))}
function limitNote(k){const n=dropsOn(k),L=+shop.dayLimit||0;if(!L)return n?`${n} drop-off${n===1?'':'s'} booked that day`:'';
  if(n<L)return `${n} of ${L} drop-offs booked that day`;let free='';for(let i=1;i<=7;i++){const d=addDay(k,i);if(dropsOn(d)<L){free=` ${dayDate(d).toLocaleDateString(undefined,{weekday:'long'})} has room for ${L-dropsOn(d)}.`;break}}
  return `<b style="color:var(--warn)">That day already has ${n} of ${L} drop-offs.</b>${free}`}
function renderSchedule(){const td=today(),day=view.day||td,ws=weekOf(day),days=[0,1,2,3,4,5,6].map(i=>addDay(ws,i));
  const mon=dayDate(ws),sun=dayDate(days[6]);const lab=mon.getMonth()===sun.getMonth()?mon.toLocaleDateString(undefined,{month:'long',year:'numeric'}):`${mon.toLocaleDateString(undefined,{month:'short'})} – ${sun.toLocaleDateString(undefined,{month:'short',year:'numeric'})}`;
  let h=`<div class="schedbar"><button class="btn ghost sm" data-act="wk" data-n="-7" aria-label="Previous week">‹</button><b>${esc(lab)}</b><button class="btn ghost sm" data-act="wk" data-n="7" aria-label="Next week">›</button>${day!==td?`<button class="btn ghost sm" data-act="pickday" data-day="${td}">Today</button>`:''}<span style="flex:1"></span><button class="btn primary sm" data-act="book">+ Book</button></div>
  <div class="week" role="group" aria-label="Pick a day">${days.map(d=>{const n=dayItems(d).length,dt=dayDate(d);
    return `<button data-act="pickday" data-day="${d}" aria-pressed="${d===day}" class="${d===td?'today':''}" aria-label="${esc(dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))}, ${n} booking${n===1?'':'s'}"><span>${esc(dt.toLocaleDateString(undefined,{weekday:'short'}))}</span><b>${dt.getDate()}</b><i aria-hidden="true">${n?'•'.repeat(Math.min(n,4))+(n>4?'+':''):''}</i></button>`}).join('')}</div>`;
  const items=dayItems(day),L=+shop.dayLimit||0,drops=dropsOn(day);
  h+=`<section><div class="between"><h2>${esc(dayDate(day).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}))}</h2><span class="small muted">${L?`${drops} of ${L} drop-offs`:`${drops} drop-off${drops===1?'':'s'}`}</span></div>`;
  const row=({t,id,p,time})=>{const c=p.customer||{},who=c.name||'Customer',ps=promiseState(p);
    const head=t==='drop'?(collects(p)?`Pick up from ${esc(who)}`:`Drop-off · ${esc(who)}`):t==='pick'?(delivers(p)?`Deliver to ${esc(who)}`:`Pickup · ${esc(who)}`):`Promised · ${esc(jobLabel(p)||'')} ${esc(p.title||'')}`;
    const sub=t==='prom'?esc([who,p.status].filter(Boolean).join(' · ')):esc([jobLabel(p),p.machine||p.title,(t==='drop'&&collects(p))||(t==='pick'&&delivers(p))?custAddr(p):'',t==='drop'?c.complaint:(jobTotal(p)?money(jobTotal(p)):'')].filter(Boolean).join(' · '));
    const pill=t==='drop'?(p.status==='Not started'?'<span class="chip">Expected</span>':'<span class="chip st-progress">In</span>'):t==='pick'?(delivers(p)?'<span class="chip st-pickup">Delivery</span>':'<span class="chip st-pickup">Out</span>'):ps==='over'?'<span class="chip warnchip">Overdue</span>':ps==='risk'?'<span class="chip warnchip">At risk</span>':'<span class="chip">Due</span>';
    return `<button class="item schedrow ${t}" data-act="open" data-pid="${id}"><span class="time mono">${t==='prom'?'due':esc(fmtTime(time)||'—')}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left"><b>${head}</b><span class="small muted">${sub}</span></span>${pill}</button>`};
  h+=items.length?`<div class="list">${items.map(row).join('')}</div>`:`<div class="empty">Nothing booked${day===td?' today':''}. <button class="btn sm" data-act="book" style="margin-top:6px">+ Book a drop-off</button></div>`;
  h+='</section>';
  if(day===td){const over=custJobList().filter(([,p])=>promiseState(p)==='over'),ready=custJobList().filter(([,p])=>p.status==='Ready for pickup'&&!(p.customer||{}).pickup);
    if(over.length)h+=`<section><h2>Overdue</h2><div class="list">${over.map(([id,p])=>row({t:'prom',id,p,time:''})).join('')}</div></section>`;
    if(ready.length)h+=`<section><h2>Ready, no pickup or delivery day set</h2><div class="list">${ready.map(([id,p])=>`<button class="item schedrow" data-act="open" data-pid="${id}"><span class="time mono">—</span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left"><b>${esc((p.customer||{}).name||'Customer')} · ${esc(jobLabel(p))}</b><span class="small muted">${esc(p.machine||p.title||'')}</span></span><span class="chip st-pickup">Ready</span></button>`).join('')}</div></section>`}
  return h}

/* ---------- Customer machines ----------
   A customer's machine is a Logbook engine/vehicle with owner {id, name} (id = the customer's id above).
   Its specs, part numbers and service log live in the Logbook; a job links to it with logbookId (like
   My equipment projects). Only used while Customer jobs (Shop mode) is on. */
const LB_EQUIP=["Push mower","Riding mower","Zero-turn mower","Generator","Pressure washer","Snow blower","Tiller","Chainsaw","String trimmer","Leaf blower","Outboard","Go-kart / mini bike","Four-wheeler","Other"];
const LB_VTYPES=["Car","Truck","SUV","Van","Tractor","Motorcycle","ATV / UTV","Trailer"];
const custMachines=cid=>cid?machines.filter(m=>m.owner&&m.owner.id===cid):[];
const machineById=id=>id?machines.find(m=>m.id===id):null;
const jobsOnMachine=mid=>Object.entries(projects).filter(([,p])=>mid&&p.logbookId===mid).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
const lbMachineHref=mid=>`${LOGBOOK_HREF}?m=${encodeURIComponent(mid)}${SHOP?'&shop=1':''}`;
const jobDay=p=>(p.customer&&p.customer.dropOff)||(p.createdAt?today(new Date(p.createdAt)):'');
/* The last job on the same machine before this one (pid null = the newest) */
function lastTimeOn(mid,pid,before){return jobsOnMachine(mid).find(([id,q])=>id!==pid&&q.kind==='customer'&&(before==null||(q.createdAt||0)<before))||null}
function lastTimeBox(mid,pid,before){const hit=lastTimeOn(mid,pid,before);if(!hit)return'';const [,q]=hit;
  const done=(q.tasks||[]).filter(t=>t.done).map(t=>t.title).filter(Boolean),note=String(q.custNotes||'').trim();
  return `<div class="panel lasttime"><span class="lt-h">Last time · ${esc([jobLabel(q),jobDay(q)].filter(Boolean).join(' · '))}</span>
    <b>${esc(q.title||'Untitled job')}</b>${done.length?`<span class="small">Done: ${esc(done.slice(0,5).join(', '))}${done.length>5?'…':''}</span>`:''}
    ${note?`<span class="small muted" style="white-space:pre-wrap">Note to customer: ${esc(note)}</span>`:''}</div>`}
/* the customer's machine whose name matches typed machine text (for linking older jobs), or '' */
function nameMatch(cid,text){const t=normName(text);if(!t)return'';const m=custMachines(cid).find(x=>{const n=normName(x.name);return n&&(n===t||n.includes(t)||t.includes(n))});return m?m.id:''}
function cmOptions(cid,sel){return custMachines(cid).map(m=>`<option value="${esc(m.id)}" ${m.id===sel?'selected':''}>${esc(m.name)}</option>`).join('')}
/* Make a new customer machine in the Logbook; returns its id */
function newCustMachine(cu,name,type){const isV=LB_VTYPES.includes(type);const id=uid_lb(),now=new Date().toISOString();
  const rec={kind:isV?'vehicle':'engine',name:String(name||'').trim(),equipment:type||'Other',owner:{id:cu.id,name:String(cu.name||'')},parts:[],docs:[],log:[],createdAt:now,updatedAt:now};if(!isV)rec.cycle='4-stroke';
  if(db)db.records.set(id,rec).catch(()=>toast("Couldn't add the machine. Check your connection."));
  machines.push({id,name:rec.name||'Unnamed',kind:rec.kind,equipment:rec.equipment,owner:{...rec.owner}});return id}
function linkToMachine(p,mid){const m=machineById(mid);if(!m)return;p.logbookId=m.id;p.logbook=m.name;if(!(p.machine||'').trim())p.machine=m.name}
function typeSelect(){return `<select name="type">${LB_EQUIP.map(t=>`<option ${t==='Riding mower'?'selected':''}>${t}</option>`).join('')}<optgroup label="Vehicles">${LB_VTYPES.map(t=>`<option>${t}</option>`).join('')}</optgroup></select>`}
/* Links from the Logbook: ?job=<projectId> opens a job; ?newjob=<machineId> starts a job for that machine.
   From the shop app's Schedule tab: ?book=YYYY-MM-DD opens + Book on that day; saving tells the shop app. */
let deep=(()=>{try{const q=new URLSearchParams(location.search);const d={job:q.get('job'),newjob:q.get('newjob'),sched:q.get('sched'),book:q.get('book')};return d.job||d.newjob||d.sched||d.book?d:null}catch(e){return null}})();
let bookFromShop=false;
function handleDeep(){if(!deep||!projectsLoaded||!machinesLoaded||!customersLoaded)return false;const d=deep;deep=null;
  try{const u=new URL(location.href);u.searchParams.delete('job');u.searchParams.delete('newjob');u.searchParams.delete('sched');u.searchParams.delete('book');history.replaceState(history.state,'',u.pathname+u.search)}catch(x){}
  if(d.job&&projects[d.job]){go({name:'project',pid:d.job});return true}
  if(d.book&&custOn&&/^\d{4}-\d{2}-\d{2}$/.test(d.book)){bookFromShop=SHOP&&window.parent!==window;go({name:'new',kind:'customer',day:d.book,book:true,cid:null,mid:null});return true}
  if(d.sched&&custOn&&/^\d{4}-\d{2}-\d{2}$/.test(d.sched)){go({name:'list',tab:'customer',cview:'sched',day:d.sched});return true}
  const m=d.newjob&&machineById(d.newjob);
  if(m&&m.owner&&custOn){go({name:'new',kind:'customer',cid:m.owner.id||null,mid:m.id});return true}
  if(m){go({name:'new',kind:'mine',mid:m.id});return true}
  return false}

function blankProject(kind){return{title:'',kind:kind||'mine',status:'Not started',logbook:'',machine:'',customer:{name:'',phone:'',dropOff:'',promised:'',complaint:''},notes:'',tasks:[],createdAt:Date.now(),updatedAt:Date.now()}}
function progress(p){const t=p.tasks||[];const d=t.filter(x=>x.done).length;return{d,n:t.length,pct:t.length?Math.round(d/t.length*100):0}}
/* parts: p.parts = parts for the whole job (no task); t.parts = parts on a task. taskId '' means a job part */
function allParts(p){const out=(p.parts||[]).map(x=>({...x,taskId:'',taskTitle:''}));(p.tasks||[]).forEach(t=>(t.parts||[]).forEach(x=>out.push({...x,taskId:t.id,taskTitle:t.title})));return out}
function brands(){const s=new Set();Object.values(projects).forEach(p=>allParts(p).forEach(x=>{if(x.brand&&x.brand.trim())s.add(x.brand.trim())}));return [...s].sort((a,b)=>a.localeCompare(b))}
function partFields(x,sups,isNew){
  const p=projects[view.pid]||{};const fl=isFluid(x);
  return `<div class="grid2"><label class="f">Brand<input type="text" name="brand" maxlength="60" list="brand-list" value="${esc(x.brand||'')}" placeholder="e.g. Kohler"></label><label class="f">Part #<input type="text" name="num" maxlength="60" class="mono" aria-label="Part #" value="${esc(x.num||'')}"></label></div>
    <div class="grid2"><label class="f">Amount<input type="number" name="qty" min="${fl?'0.1':'1'}" max="9999" step="${fl?'0.1':'1'}" value="${esc(numStr(x.qty))}" inputmode="decimal" data-qtyfor="1"></label>
    <label class="f">Measured in<select name="unit" data-unitsel="1">${UNITS.map(([v,l])=>`<option value="${v}" ${(x.unit||'')===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${isNew?`<label class="f"><span data-pricelabel="1">Price ${perText(x)} ($)${p.kind==='customer'?'':' · optional'}</span><input type="number" name="price" min="0" step="0.01" inputmode="decimal" placeholder="0.00" class="mono"></label>`:''}
    <div class="grid2"><label class="f">Supplier<input type="text" name="supplier" maxlength="60" list="sup-list" value="${esc(x.supplier||'')}" placeholder="e.g. Tractor Supply"></label>
    ${isNew?`<label class="f">Status<select name="status">${PART_ST.map(s=>`<option>${s}</option>`).join('')}</select></label>`:'<span></span>'}</div>
    <span class="note">For fluids, pick Quarts or Gallons and enter the amount (decimals OK, like 4.5).</span>`;
}

/* ---------- saving ---------- */
function save(pid){
  const p=projects[pid];if(!p)return;p.updatedAt=Date.now();
  if(!db){return}
  clearTimeout(timers['s'+pid]);
  timers['s'+pid]=setTimeout(async()=>{
    try{const cur=projects[pid];if(cur)await db.doc('projects/'+pid).set(JSON.parse(JSON.stringify(cur)));timers['s'+pid]=null}
    catch(e){ if(e&&e.code==='unavailable'){setTimeout(()=>save(pid),1500)} else toast(e&&e.code==='quota_exceeded'?'Storage is full: delete an old project.':'Could not save. Check your connection.') }
  },350);
}
async function removeProject(pid){delete projects[pid];if(db){try{await db.doc('projects/'+pid).delete()}catch(e){toast('Could not delete. Try again.')}}}

/* Phone back button: each screen (the project list, a project, a task, the shop list, shop info, a new project) gets its
   own browser history entry, so Back goes to the previous screen instead of leaving the Tracker. Back also closes an
   open scanner or sheet first. Tabs and filters within a screen replace the entry rather than adding one. */
let navSkipPop=false, navRestoring=false, navReady=false;
function navSnap(){const v={name:view.name,tab:view.tab,q:view.q,pid:view.pid,tid:view.tid,kind:view.kind,shopJob:view.shopJob,shopStatus:view.shopStatus,shopSup:view.shopSup,backPid:view.backPid,cid:view.cid,cview:view.cview,day:view.day,book:view.book,who:view.who};
  return{gtt:1,k:[view.name,view.name==='project'||view.name==='task'?view.pid:view.name==='customer'?view.cid:'',view.name==='task'?view.tid:''].join(':'),v}}
function navSync(){if(signedOut||!ready)return;try{const s=navSnap(),c=history.state,ours=c&&c.gtt;
  if(!navReady||!ours||navRestoring){navReady=true;history.replaceState({...s,prevK:ours?c.prevK:null},'');return}
  if(c.k===s.k){history.replaceState({...s,prevK:c.prevK},'');return}
  if(c.prevK===s.k){navSkipPop=true;history.back();return} /* an in-app back button: step back instead of stacking a new entry */
  history.pushState({...s,prevK:c.k},'')}catch(e){}}
window.addEventListener('popstate',ev=>{const s=ev.state;
  if(navSkipPop){navSkipPop=false;try{history.replaceState({...navSnap(),prevK:s&&s.gtt?s.prevK:null},'')}catch(e){}return}
  let closed=true;
  if(window.GTScan&&GTScan.isOpen)GTScan.close();
  else if(lsheet)closeLogSheet();
  else closed=false;
  if(closed){try{history.pushState({...navSnap(),prevK:s&&s.gtt?s.k:null},'')}catch(e){}return}
  if(!s||!s.gtt||signedOut)return;
  view={...view,...s.v,editing:null,confirm:null,editPart:null,editTime:null};
  navRestoring=true;try{render()}finally{navRestoring=false}window.scrollTo(0,0)});
function render(){renderScreen();navSync()}
function renderScreen(){
  const a=document.activeElement;const keepId=a&&a.id&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')?a.id:null;const sel=keepId?[a.selectionStart,a.selectionEnd]:null;
  let html='';
  if(signedOut)html=renderSignIn();
  else if(!ready)html='<p class="muted">Loading your projects…</p>';
  else if(view.name==='project'&&projects[view.pid])html=renderProject();
  else if(view.name==='task'&&projects[view.pid]&&(projects[view.pid].tasks||[]).find(t=>t.id===view.tid))html=renderTask();
  else if(view.name==='shop')html=renderShop();
  else if(view.name==='new')html=renderNew();
  else if(view.name==='shopinfo')html=renderShopInfo();
  else if(view.name==='customer'&&custOn)html=renderCustomer();
  else {view.name='list';html=renderList()}
  app.innerHTML=html;
  if(keepId){const el=document.getElementById(keepId);if(el){el.focus();try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

  h+=js.length?(jOpen.length?jOpen.map(jcard).join(''):`<div class="empty">No open jobs for ${esc(c.name||'this customer')}.</div>`)
    +(jDone.length?`<h3 class="small muted" style="margin:10px 0 0;text-transform:uppercase;letter-spacing:.08em">Done jobs · ${jDone.length}</h3>`+jDone.map(jcard).join(''):'')

    :`<div class="empty">No jobs for ${esc(c.name||'this customer')} yet.</div>`;
  return h+'</section>';
}

function renderLabor(p){const l=p.labor||{};const lc=laborCost(p);const pc=partsCost(p);
  const rate=l.rate!==undefined&&l.rate!==''?l.rate:(shop.rate||'');
  return `<div class="panel" style="gap:10px;border-color:var(--tan)">
    <div class="between" style="align-items:baseline"><span class="eyebrow">Labor</span><span class="mono" style="font-size:18px">${lc.has?money(lc.total):'<span class="muted small">none</span>'}</span></div>
    <label class="f">What was done (optional)<input id="lab-desc" type="text" maxlength="160" value="${esc(l.desc||'')}" placeholder="e.g. Carb rebuild and tune-up" data-labor="desc"></label>
    <div class="grid2"><label class="f">Hours<input id="lab-hours" type="number" min="0" step="0.25" inputmode="decimal" class="mono" value="${esc(l.hours||'')}" placeholder="0" data-labor="hours"></label>
    <label class="f">Rate ($/hr)<input id="lab-rate" type="number" min="0" step="0.01" inputmode="decimal" class="mono" value="${esc(rate)}" placeholder="0.00" data-labor="rate"></label></div>
    ${(()=>{const ms=approveOn()?okMs(p):totalMs(p);return jobClocksOn()&&ms>=60000&&hrsQ(ms)!==+(l.hours||0)?`<button class="btn sm" data-act="usetime">Use ${approveOn()?'approved':'clocked'} time: ${numStr(hrsQ(ms))} hr${!approveOn()&&running(p)?' (so far)':''}</button>`:''})()}
    ${approveOn()&&waitMs(p)?`<span class="small" style="color:var(--warn)">${fmtDur(waitMs(p))} of clocked time is waiting for approval and isn't counted.</span>`:''}
    <span class="small muted">${lc.has?`${numStr(lc.hours)} hr × ${money(lc.rate)}/hr. `:'Leave hours empty and labor won\'t show on the invoice. '}${shop.rate?'':'Set a default rate under Shop info.'}</span>
  </div>
  ${renderDelivery(p)}
  <div class="panel" style="flex-direction:row;justify-content:space-between;align-items:center;border-color:var(--tan)"><div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">Job total</span><span class="mono" style="font-size:24px">${money(pc.total+lc.total+deliveryFee(p).total)}</span></div><span class="small muted" style="text-align:right">Parts ${money(pc.total)}${lc.has?`<br>Labor ${money(lc.total)}`:''}${deliveryFee(p).has?`<br>${deliveryFee(p).trips===2?'Pickup + delivery':delivers(p)?'Delivery':'Pickup'} ${money(deliveryFee(p).total)}`:''}</span></div>`}
/* The job's Delivery panel (Delivery fees on, and the job is picked up and/or delivered by the shop) */
function renderDelivery(p){if(!feesOn()||!tripsOf(p))return'';const c=p.customer||{},df=deliveryFee(p),cu=custOfJob(p);

/* Import a project-tracker-backup.json from the test version:
   {app:"project-tracker", version:1, projects:[{id,...}], settings:{counter, shop}} */
async function importBackup(text){
  if(!db||!projectsLoaded){toast('Still loading your projects. Try again in a moment.');return}
  let j;try{j=JSON.parse(text)}catch(e){toast("That isn't a Project Tracker backup file.");return}
  if(!j||j.app!=='project-tracker'||!Array.isArray(j.projects)){toast("That file doesn't look like a Project Tracker backup.");return}
  let added=0,skipped=0,bad=0;const writes=[];
  for(const raw of j.projects){
    const id=raw&&String(raw.id||'');if(!/^[A-Za-z0-9_-]{1,100}$/.test(id)||(raw.kind!=='mine'&&raw.kind!=='customer')){bad++;continue}
    if(projects[id]){skipped++;continue}
    const {id:_,...data}=raw;const clean=JSON.parse(JSON.stringify(data));projects[id]=clean;added++;
    writes.push(db.doc('projects/'+id).set(clean));
  }
  const s=j.settings||{};
  const cn=typeof s.counter==='number'?s.counter:Number(s.counter&&s.counter.lastJobNo)||0;
  const maxJob=Math.max(cn,...j.projects.map(p=>Number(p&&p.jobNo)||0));
  if(maxJob>counterLast){counterLast=maxJob;writes.push(db.doc('settings/counter').set({lastJobNo:maxJob}))}
  let shopNote='';
  if(s.shop&&typeof s.shop==='object'){
    if(!shop.name){shop={name:String(s.shop.name||''),phone:String(s.shop.phone||''),email:String(s.shop.email||''),address:String(s.shop.address||''),footer:String(s.shop.footer||''),rate:s.shop.rate||''};writes.push(db.doc('settings/shop').set({...shop}));shopNote=' and your shop info'}
    else shopNote=' (kept your current shop info)'}
  render();
  toast(`Imported ${added} project${added===1?'':'s'}${shopNote}${skipped?` · ${skipped} already here`:''}${bad?` · ${bad} unreadable`:''}`);
  Promise.all(writes).catch(()=>toast('Some imported items could not be saved. Check your connection.'));
}

/* ---------- PDFs (jsPDF) ---------- */
const pdfText=s=>String(s??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g,'');
function longDate(s){const d=s?new Date(s+'T00:00:00'):new Date();return isNaN(d)?String(s):d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function buildPdf(p,kind){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,M=54,R=W-M;let y=M;const c=p.customer||{};const job=jobLabel(p);
  const ensure=h=>{if(y+h>792-M){doc.addPage();y=M}};
  const line=(x1,y1,x2,y2,w=0.75,g=180)=>{doc.setDrawColor(g);doc.setLineWidth(w);doc.line(x1,y1,x2,y2)};
  const txt=(s,x,yy,o)=>doc.text(pdfText(s),x,yy,o);
  // header: shop
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(20);txt(shop.name||'Your shop name',M,y+4);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  const sub=[shop.phone,shop.email].filter(Boolean).join('   ');let hy=y+20;
  if(shop.address){txt(shop.address,M,hy);hy+=13}
  if(sub){txt(sub,M,hy);hy+=13}
  doc.setFont('helvetica','bold');doc.setFontSize(22);doc.setTextColor(20);txt(kind==='invoice'?'INVOICE':'WORK REPORT',R,y+4,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  txt((kind==='invoice'?'Invoice ':'Job ')+(job||'-'),R,y+20,{align:'right'});txt('Date: '+longDate(),R,y+33,{align:'right'});
  y=Math.max(hy,y+40)+10;line(M,y,R,y,1.5,40);y+=24;
  // customer block
  doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt('CUSTOMER',M,y);txt('MACHINE',M+270,y);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
  let cy=y+15;txt(c.name||'-',M,cy);if(c.phone){cy+=14;txt(c.phone,M,cy)}
  let my=y+15;const mach=doc.splitTextToSize(pdfText(p.machine||p.title||'-'),R-(M+270));doc.text(mach,M+270,my);my+=14*mach.length;
  doc.setFontSize(10);doc.setTextColor(90);
  if(c.dropOff){txt('Dropped off: '+longDate(c.dropOff),M+270,my);my+=13}
  y=Math.max(cy,my)+22;
  if(kind==='report'){
    doc.setFontSize(11);doc.setTextColor(20);doc.setFont('helvetica','bold');txt(String(p.title||'').trim()||'Work report',M,y);y+=18;doc.setFont('helvetica','normal');
    if(c.complaint){doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt("CUSTOMER'S COMPLAINT",M,y);y+=14;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
      const L=doc.splitTextToSize(pdfText(c.complaint),R-M);ensure(L.length*14);doc.text(L,M,y);y+=L.length*14+14}
    const doneT=(p.tasks||[]).filter(t=>t.done),open=(p.tasks||[]).filter(t=>!t.done);
    doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');ensure(30);txt('WORK PERFORMED',M,y);y+=16;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(20);
    if(!doneT.length){txt('No completed work recorded yet.',M,y);y+=16}
    doneT.forEach(t=>{const L=doc.splitTextToSize(pdfText(t.title),R-M-18);ensure(L.length*14+4);doc.setDrawColor(40);doc.setLineWidth(1);doc.rect(M,y-8,8,8);doc.line(M+1.5,y-4,M+3.5,y-1.5);doc.line(M+3.5,y-1.5,M+7,y-7);doc.text(L,M+18,y);y+=L.length*14+4});
    if(open.length){y+=8;doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');ensure(30);txt('NOT DONE / RECOMMENDED',M,y);y+=16;doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(60);
      open.forEach(t=>{const L=doc.splitTextToSize(pdfText(t.title),R-M-18);ensure(L.length*14+4);doc.setDrawColor(120);doc.rect(M,y-8,8,8);doc.text(L,M+18,y);y+=L.length*14+4})}
    const parts=allParts(p);if(parts.length){y+=12;ensure(40);doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt('PARTS',M,y);txt('BRAND / PART #',M+300,y);txt('QTY',R,y,{align:'right'});y+=6;line(M,y,R,y);y+=14;doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(20);
      parts.forEach(x=>{const L=doc.splitTextToSize(pdfText(x.name),290);const I=doc.splitTextToSize(pdfText(idText(x)||'-'),130);const n=Math.max(L.length,I.length);ensure(n*13+6);doc.text(L,M,y);doc.text(I,M+300,y);txt(isFluid(x)?qtyText(x):numStr(x.qty),R,y,{align:'right'});y+=n*13+6})}
  } else {
    // invoice table
    const cols={part:M,num:M+200,qty:M+370,each:M+440,amt:R};
    doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt('PART',cols.part,y);txt('BRAND / PART #',cols.num,y);txt('QTY',cols.qty,y,{align:'right'});txt('PRICE EACH',cols.each,y,{align:'right'});txt('AMOUNT',cols.amt,y,{align:'right'});
    y+=6;line(M,y,R,y);y+=15;doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(20);
    const parts=allParts(p);
    if(!parts.length){txt('No parts on this job.',M,y);y+=16}

      txt(hasPrice(x)?money(x.price)+(isFluid(x)?'/'+x.unit:''):'-',cols.each,y,{align:'right'});txt(hasPrice(x)?money(x.price*q):'-',cols.amt,y,{align:'right'});y+=n*13+8});
    y+=2;line(M,y,R,y);y+=22;
    const pc=partsCost(p),lc=laborCost(p);
    if(lc.has){ensure(60);doc.setFontSize(9);doc.setTextColor(120);doc.setFont('helvetica','bold');txt('LABOR',cols.part,y);txt('HOURS',cols.qty,y,{align:'right'});txt('RATE',cols.each,y,{align:'right'});txt('AMOUNT',cols.amt,y,{align:'right'});
      y+=6;line(M,y,R,y);y+=15;doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(20);
      const L=doc.splitTextToSize(pdfText(lc.desc||'Labor'),300);ensure(L.length*13+8);doc.text(L,cols.part,y);txt(numStr(lc.hours),cols.qty,y,{align:'right'});txt(money(lc.rate)+'/hr',cols.each,y,{align:'right'});txt(money(lc.total),cols.amt,y,{align:'right'});y+=L.length*13+8;
      y+=2;line(M,y,R,y);y+=22}
    ensure(80);
    doc.setFontSize(11);doc.setTextColor(60);txt('Parts',cols.each,y,{align:'right'});txt(money(pc.total),cols.amt,y,{align:'right'});y+=16;
    if(lc.has){txt('Labor',cols.each,y,{align:'right'});txt(money(lc.total),cols.amt,y,{align:'right'});y+=16}
    const df=deliveryFee(p);if(df.has){txt(pdfText(df.desc),cols.each,y,{align:'right'});txt(money(df.total),cols.amt,y,{align:'right'});y+=16}

  }

async function savePdf(p,kind){
  if(!window.jspdf){toast('PDF maker is still loading. Try again in a moment.');return}
  const who=((p.customer&&p.customer.name)||p.title||'customer').replace(/[\\/:*?"<>|]+/g,'').slice(0,40);
  const name=`${kind==='invoice'?'Invoice':'Work report'} ${jobLabel(p)||''} ${who}.pdf`.replace(/\s+/g,' ').trim();
  try{const data=buildPdf(p,kind);const url=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('PDF saved')}
  catch(e){toast('Could not create the PDF.')}
}

    h+=`<table class="tot"><tr><td class="r">Parts</td><td class="r">${esc(money(pc.total))}</td></tr>${lc.has?`<tr><td class="r">Labor</td><td class="r">${esc(money(lc.total))}</td></tr>`:''}${deliveryFee(p).has?`<tr><td class="r">${esc(deliveryFee(p).desc)}</td><td class="r">${esc(money(deliveryFee(p).total))}</td></tr>`:''}<tr class="big"><td class="r">TOTAL</td><td class="r">${esc(money(pc.total+lc.total+deliveryFee(p).total))}</td></tr></table>`;
    if(pc.missing)h+=`<div class="sub" style="text-align:right">${pc.missing} part${pc.missing>1?'s have':' has'} no price and ${pc.missing>1?'are':'is'} not included.</div>`;

  h+=`<div class="foot">${esc(kind==='invoice'?(shop.footer||'Thank you for your business.'):'Thank you for your business.')}</div>`;
