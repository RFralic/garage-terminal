<!doctype html>
<html lang="en">
<!--
  Spark Plug Finder, served at /apps/spark-plugs. A reference app like Fuel Mix and Torque Chart.
  Data: src/sparkplug/plugs.json (NGK's 2009 small-engine catalogue); search: src/sparkplug/search.js;
  page code: src/pages/sparkplugs.js. ?q=RJ19LM opens with that search. Kept for offline use by /apps/sw.js.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spark Plug Finder · Garage Terminal</title>
<meta name="description" content="Cross-reference a spark plug number (Champion, Autolite, Bosch, Denso, Torch and more) to NGK, or find the plug and gap for a mower, saw, trimmer or small engine.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18222b; --muted:#5b6872; --line:#d3d9de;
  --accent:#1d5ea8; --accent-soft:#e2ecf7; --hi:#fff3c4; --hi-ink:#6b4d00; --warn:#9a5b00; --warn-soft:#fdf1dc; --ok:#1f7a4a;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --panel:#1a2128; --ink:#e4e9ed; --muted:#93a0aa; --line:#2c3640;
  --accent:#6aa6ec; --accent-soft:#1e2d3e; --hi:#3a3216; --hi-ink:#f0cf6e; --warn:#e8b25c; --warn-soft:#2e2615; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#1a2128; --ink:#e4e9ed; --muted:#93a0aa; --line:#2c3640;
  --accent:#6aa6ec; --accent-soft:#1e2d3e; --hi:#3a3216; --hi-ink:#f0cf6e; --warn:#e8b25c; --warn-soft:#2e2615; --ok:#6fcf97; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{margin:0;font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gt-back{align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;font:600 .9rem var(--f-mono);color:var(--accent);text-decoration:none}
.gt-back:hover{text-decoration:underline}

/* search */
.searchbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.q{font:600 1.3rem var(--f-mono);padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.q:focus{outline:none;border-color:var(--accent)}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .85rem var(--f-mono);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:999px;cursor:pointer;min-height:34px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip:focus-visible,.plink:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2.sec{margin:6px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
/* a plug: NGK number big, the other brands' numbers under it */
.plug{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plug.exact{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ptop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ngk{font:700 1.8rem var(--f-mono);color:var(--accent);line-height:1.1;overflow-wrap:anywhere}
.ngk small{font:600 .8rem var(--f-display);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.matched{font-size:.95rem;color:var(--muted)}
.matched b{color:var(--ink);font-family:var(--f-mono)}
.eq{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:4px 12px;font-size:.95rem}
.eq dt{color:var(--muted)}
.eq dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
.eq dd mark{background:var(--hi);color:var(--hi-ink);border-radius:3px;padding:0 3px}
.uses{font-size:.9rem;color:var(--muted)}
.uses b{color:var(--ink)}
/* machines */
.mlist{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.mrow:first-child{border-top:0}
.mrow .who{min-width:0}
.mrow .who b{display:block;overflow-wrap:anywhere}
.mrow .who span{font-size:.85rem;color:var(--muted)}
.mrow .what{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.plink{font:700 1.05rem var(--f-mono);color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;min-height:32px}
.gap{font:500 .85rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.more{font:600 .9rem var(--f-display);border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:8px;min-height:44px;cursor:pointer}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted)}
.caveat{font-size:.85rem;color:var(--muted);margin:0;max-width:72ch}
@media (max-width:420px){.eq{grid-template-columns:minmax(0,7.5rem) minmax(0,1fr)}.ngk{font-size:1.55rem}}
</style>
<script type="module" src="/src/pages/sparkplugs.js"></script>
<!-- Inside the shop app (garageterminal.com/shop, ?shop=1): the app has its own way back, so hide the site link -->
<script>if(/[?&]shop=1(&|$)/.test(location.search))document.documentElement.classList.add('shop')</script>
<style>.shop .gt-back{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <a class="gt-back" href="/#apps">&lt; garage_terminal</a>

  <header>
    <h1>Spark Plug Finder</h1>
    <p>Type a plug number from any brand to see the NGK plug and the other brands' numbers for it. Or type a machine (maker and model) to see which plug it takes and the gap.</p>
  </header>

  <section class="searchbox" aria-label="Search">
    <label class="lbl" for="q">Plug number or machine</label>
    <input id="q" class="q" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="RJ19LM, BPMR7A, Honda GX160, Stihl MS 290…">
    <div class="chips" id="eg" aria-label="Examples"></div>
  </section>

  <div id="out" aria-live="polite"></div>

  <p class="caveat" id="src"></p>
</div>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/apps/sw.js",{scope:"/apps/"}).catch(()=>{}));</script>
</body>
</html>
