<!doctype html>
<html lang="en">
<!-- /forum: thread list. Logic: src/pages/forum-list.js -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forum · Garage Terminal</title>
<meta name="description" content="The Garage Terminal forum: shop talk, app support and releases.">
<!-- Link previews (texts, chat apps, social). Site address: update if a custom domain is added. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Garage Terminal">
<meta property="og:title" content="Forum · Garage Terminal">
<meta property="og:description" content="The Garage Terminal forum: shop talk, app support and releases.">
<meta property="og:url" content="https://garage-terminal-15499.web.app/forum">
<meta property="og:image" content="https://garage-terminal-15499.web.app/img/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0E12">
<!-- Site icons: SVG for modern browsers, .ico/.png fallbacks, home-screen icon, web manifest -->
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/forms.css">
<link rel="stylesheet" href="/src/styles/forum.css">
<link rel="stylesheet" href="/src/styles/mod.css">
<script type="module" src="/src/pages/forum-list.js"></script>
</head>
<body>
<header>
  <nav class="wrap" aria-label="Main">
    <a class="logo" href="/"><img class="logo-mark" src="/logo.svg" alt="" width="28" height="28">GARAGE_TERMINAL<span class="cursor" aria-hidden="true">_</span></a>
    <div class="links">
      <a href="/#apps">/apps</a>
      <a href="/forum" aria-current="page">/forum</a>
      <a href="/wiki">/wiki</a>
      <a href="/#bbs" hidden>/bbs</a>
    </div>
  </nav>
  <div class="wrap session" id="session" aria-live="polite"></div>
</header>

<main class="wrap page">
  <section class="block">
    <div class="shead"><h1>&gt; cd /forum</h1><span>open to read</span></div>

    <aside class="notice" id="f-notice" hidden>
      <p class="notice-tag">SYSOP NOTICE</p>
      <div class="md notice-body" id="f-notice-body"></div>
    </aside>

    <p class="mod-banner" id="f-closed" hidden>&gt; The forum is read-only right now. Reading is fine; posting is paused.</p>

    <div class="forum-bar">
      <nav class="chips" id="f-areas" aria-label="Message areas"></nav>
      <div class="forum-actions">
        <a class="btn primary" id="f-new" href="/forum/new" hidden>+ New thread</a>
        <a class="btn ghost" id="f-join" href="/join?next=%2Fforum" hidden>Join to post</a>
        <p class="mutedt small" id="f-cant" hidden></p>
      </div>
    </div>

    <div class="term">
      <div class="tbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="f-file">threads.txt</span></div>
      <p class="list-status" id="f-status">loading…</p>
      <ol class="threads" id="f-list" aria-label="Threads"></ol>
      <div class="list-more"><button class="btn ghost" id="f-more" type="button" hidden>Load more</button></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap"><span>© Garage Terminal</span><span>NO CARRIER</span></div>
</footer>
</body>
</html>
