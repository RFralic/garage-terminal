# Manually-run action: makes an existing member the sysop (creates admins/{uid}).
# GitHub -> Actions -> "Add sysop" -> Run workflow -> paste the User UID.
name: Add sysop

on:
  workflow_dispatch:
    inputs:
      uid:
        description: 'User UID (Firebase console -> Authentication -> Users)'
        required: true

permissions:
  contents: read

jobs:
  add-sysop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Grant sysop
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TARGET_UID: ${{ inputs.uid }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node scripts/add-sysop.mjs "$TARGET_UID"
          rm -f "$RUNNER_TEMP/sa.json"
