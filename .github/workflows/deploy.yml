# Tests and deploys the site.
#  - Every push and pull request: runs the Firestore rules tests on the emulator.
#    If any test fails, nothing is deployed.
#  - Push to main: deploys Firestore rules, then the website, to the live project
#    (garage-terminal-15499.web.app).
#  - Pull request: deploys the website only to a temporary preview link, posted on
#    the PR. Previews share the live database and rules; rules change only from main.
#
# Needs one GitHub secret: FIREBASE_SERVICE_ACCOUNT (the JSON key of the deploy service account).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write        # lets the hosting action report its status
  pull-requests: write # lets the hosting action comment the preview link on PRs

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs can't see secrets, so skip them instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator (used by the rules tests) needs Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Rules tests (Firestore emulator)
        run: npm run test:rules

      - run: npm run build

      - name: Deploy Firestore rules (main only)
        if: github.event_name == 'push'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --only firestore:rules,firestore:indexes --project garage-terminal-15499 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Deploy website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: garage-terminal-15499
          # Live deploy on main; PRs get a preview channel (expires after 7 days).
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
