# Tests and deploys the site.
#  - Every push and pull request: runs the tests (Firestore rules + Cloud Functions)
#    on the emulator. If any test fails, nothing is deployed.
#  - Push to main, in this order:
#      1. Firestore rules + indexes
#      2. Starting data (areas, settings) if missing: scripts/seed.mjs
#      3. The website (garage-terminal-15499.web.app)
#      4. Cloud Functions (last, so a functions problem never blocks the site),
#         plus a 1-day clean-up policy for old function images
#  - Pull request: deploys the website only to a temporary preview link, posted on
#    the PR. Previews share the live database and rules; those change only from main.
#
# Needs one GitHub secret: FIREBASE_SERVICE_ACCOUNT (the JSON key of the deploy service account).
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write        # lets the hosting action report its status
  pull-requests: write # lets the hosting action comment the preview link on PRs

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs can't see secrets, so skip them instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator (used by the tests) needs Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Tests (rules + functions, on the Firestore emulator)
        run: npm test

      - run: npm run build

      # ---- live deploy (main only) ------------------------------------------

      - name: Write deploy credentials
        if: github.event_name == 'push'
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules and indexes
        if: github.event_name == 'push'
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project garage-terminal-15499 --non-interactive

      - name: Seed starting data (areas, settings) if missing
        if: github.event_name == 'push'
        run: node scripts/seed.mjs

      - name: Deploy website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: garage-terminal-15499
          # Live deploy on main; PRs get a preview channel (expires after 7 days).
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}

      - name: Deploy Cloud Functions
        if: github.event_name == 'push'
        # --force: accept the default clean-up policy for old function images
        run: npx firebase deploy --only functions --project garage-terminal-15499 --non-interactive --force

      # Each functions deploy stores a container image in Artifact Registry.
      # Delete images older than 1 day so storage doesn't slowly cost money.
      # (Safe to repeat on every deploy; us-east1 is where the functions run.)
      - name: Set clean-up policy for old function images
        if: github.event_name == 'push'
        run: npx firebase functions:artifacts:setpolicy --location us-east1 --days 1 --force --project garage-terminal-15499 --non-interactive
      - name: Remove deploy credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
