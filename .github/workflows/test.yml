# Runs the tests (no deploy) on pushes to any branch except main.
# Handy for checking work before it goes live; main is tested by deploy.yml.
name: Test

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Tests (rules + functions, on the Firestore and Storage emulators)
        run: npm test
      - run: npm run build
