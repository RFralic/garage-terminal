<!doctype html>
<html lang="en">
<!-- /wiki: library list with search and folder filters. Logic: src/pages/library-list.js -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Library · Garage Terminal</title>
<meta name="description" content="The Garage Terminal wiki and library: guides, manuals, ebooks and files.">
<meta name="theme-color" content="#0B0E12">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/src/styles/base.css">
<link rel="stylesheet" href="/src/styles/forms.css">
<link rel="stylesheet" href="/src/styles/forum.css">
<link rel="stylesheet" href="/src/styles/mod.css">
<link rel="stylesheet" href="/src/styles/library.css">
<script type="module" src="/src/pages/library-list.js"></script>
</head>
<body>
<header>
  <nav class="wrap" aria-label="Main">
    <a class="logo" href="/">GARAGE_TERMINAL<span class="cursor" aria-hidden="true">_</span></a>
    <div class="links">
      <a href="/#apps">/apps</a>
      <a href="/forum">/forum</a>
      <a href="/wiki" aria-current="page">/wiki</a>
      <a href="/#bbs" hidden>/bbs</a>
    </div>
  </nav>
  <div class="wrap session" id="session" aria-live="polite"></div>
</header>

<main class="wrap page">
  <section class="block">
    <div class="shead"><h1>&gt; ls /library</h1><span>guides · manuals · ebooks · files</span></div>

    <div class="forum-bar">
      <input class="field lib-search" id="l-search" type="search" placeholder="Search titles and descriptions…" aria-label="Search the library" autocomplete="off">
      <a class="btn primary" id="l-add" href="/wiki/add" hidden>+ Add to library</a>
    </div>
    <nav class="chips lib-folders" id="l-folders" aria-label="Folders"></nav>

    <div class="term">
      <div class="tbar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span id="l-file">library.txt</span></div>
      <p class="list-status" id="l-status">loading…</p>
      <ol class="threads" id="l-list" aria-label="Library items"></ol>
    </div>
  </section>
</main>

<footer>
  <div class="wrap"><span>© Garage Terminal</span><span>NO CARRIER</span></div>
</footer>
</body>
</html>
